<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boost Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boost Board">
<meta name="theme-color" content="#0a0e18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed pitch canvas. Landscape = tool rail | pitch | control column. Portrait = top bar / pitch / tools / timeline. */
:root{
  --bg:#0a0e18; --panel:#111827; --panel2:#19213a; --line:#27314d; --fg:#e9eef8; --dim:#8e99b4;
  --blue:#3d9bff; --orange:#ff8a1f; --boost:#ffc93c; --danger:#ff4d5e;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{height:100%;font:14px/1.35 var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--boost);outline-offset:2px}
svg{display:block}
#app{height:100%;display:grid;grid-template-areas:"top" "stage" "coach" "tools" "time";grid-template-rows:auto 1fr auto auto auto;grid-template-columns:minmax(0,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;background:radial-gradient(ellipse at center,#141c30 0%,var(--bg) 75%)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#tools{grid-area:tools;display:flex;gap:4px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#time{grid-area:time;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel2);border-top:1px solid var(--line)}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;color:var(--fg)}
.ib svg{width:22px;height:22px}
.ib:active{background:var(--panel2)}
.ib[disabled]{opacity:.3}
.tool[aria-pressed="true"]{background:var(--boost);color:#1a1405}
.sep{flex:none;width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
.grow{flex:1}
#mapBtn{flex:1;min-width:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:10px;background:var(--panel2);text-align:left}
#mapBtn .sw{width:18px;height:18px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.25)}
#mapBtn .nm{font:600 14px var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapBtn .ar{font:600 10px var(--f-display);color:var(--dim);margin-left:auto;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;flex:none;background:var(--panel2);border-radius:10px;padding:3px;gap:2px}
.seg button{height:34px;min-width:34px;padding:0 6px;border-radius:8px;font:700 13px var(--f-display);color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#colorBtn .dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.85)}
#frames{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;align-items:center}
#frames::-webkit-scrollbar{display:none}
.fr{flex:none;height:34px;min-width:34px;padding:0 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font:700 13px var(--f-display);color:var(--dim);font-variant-numeric:tabular-nums}
.fr[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.fr.add{color:var(--boost);border-style:dashed;min-width:40px;font-size:18px}
#playBtn{background:var(--boost);color:#1a1405}
#speedBtn{font:700 12px var(--f-display);width:44px}
#loopBtn[aria-pressed="true"]{color:var(--boost)}
#hist{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
#hist .ib{width:38px;height:38px;background:rgba(17,24,39,.86);border:1px solid var(--line)}
#tools{justify-content:space-between;gap:4px}
#tools .ib{flex:1 1 0;min-width:40px;max-width:76px;width:auto;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#tools .ib span:last-child{font:600 9px var(--f-display);letter-spacing:.03em;text-transform:uppercase}
#tools .tool:not([aria-pressed="true"]) span{color:var(--dim)}
#tools .sep{display:none}
@media (max-width:480px){#mapBtn .ar{display:none}}
#resetBtn,#kickBtn{color:var(--boost)}
#resetBtn span:last-child,#kickBtn span:last-child{color:var(--boost)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.kc{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--panel2);border:2px solid transparent;text-align:left}
.kc[aria-pressed="true"]{border-color:var(--boost)}
.kc svg{flex:none}
.kc span{display:flex;flex-direction:column;gap:2px;min-width:0}
.kc b{font:600 12px var(--f-display);line-height:1.2}
.lbl{font:600 10px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* Landscape: rails on both sides so the pitch gets full height */
@media (orientation:landscape) and (max-height:620px), (orientation:landscape) and (min-width:900px){
  #app{grid-template-areas:"tools stage top" "tools stage coach" "tools stage time";grid-template-columns:auto 1fr 250px;grid-template-rows:auto 1fr auto}
  #tools{display:flex;flex-direction:column;justify-content:center;gap:4px;border-top:0;border-right:1px solid var(--line);overflow:visible;padding:6px}
  #tools .ib{width:60px;max-width:none;flex:none;height:min(50px,calc((100vh - 60px) / 8))}
  #tools{gap:2px}
  #tools .sep{display:block;width:auto;height:1px;grid-column:span 2;margin:2px 0}
  #top{min-width:0;flex-wrap:wrap;border-bottom:0;border-left:1px solid var(--line);align-content:flex-start}
  #top .seg{width:100%;justify-content:space-between}
  #top .seg button{flex:1}
  #mapBtn{order:-1;flex-basis:100%}
  #time{gap:4px;flex-wrap:wrap;align-content:flex-start;border-top:1px solid var(--line);border-left:1px solid var(--line)}
  #frames{flex-basis:100%;flex-wrap:wrap;overflow:visible;order:5}
  #modeSeg{order:2}
  #time{align-content:flex-end}
}

/* Overlays */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,6,12,.62);display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);animation:fade .15s ease}
.card{width:min(560px,100%);max-height:88%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) 20px;-webkit-user-select:text;user-select:text;animation:up .2s ease}
.modal.center{align-items:center}
.modal.center .card{border-radius:16px;width:min(420px,calc(100% - 32px))}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.modal,.card{animation:none}}
.card h2{font:700 20px var(--f-display);margin:0 0 4px;letter-spacing:.02em}
.card h3{font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.card p{margin:0 0 8px;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:42px;padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:600 14px var(--f-display);letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--boost);border-color:var(--boost);color:#1a1405}
.btn.bad{color:var(--danger)}
.btn.bad.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mapc{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;background:var(--panel2);border:2px solid transparent;text-align:left}
.mapc[aria-pressed="true"]{border-color:var(--boost)}
.mapc .pv{height:54px;border-radius:8px;position:relative;overflow:hidden}
.mapc .pv::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,.55)}
.mapc b{font:600 14px var(--f-display)}
.mapc small{color:var(--dim);font-size:12px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--panel2)}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block;font:600 15px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta small{color:var(--dim)}
.item .tag{font:700 10px var(--f-display);letter-spacing:.1em;padding:3px 6px;border-radius:6px;background:var(--line);color:var(--fg)}
.empty{padding:14px;border-radius:12px;border:1px dashed var(--line);color:var(--dim)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tog span small{display:block;color:var(--dim)}
.sw2{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw2[aria-pressed="true"]{background:var(--blue)}
.sw2[aria-pressed="true"]::after{transform:translateX(20px)}
input[type=text],textarea{width:100%;font:500 16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{height:110px;font:12px ui-monospace,Menlo,monospace;resize:none}
.pop{position:fixed;z-index:40;display:flex;gap:6px;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pop button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.pop button[aria-pressed="true"]{border-color:#fff}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);font:600 14px var(--f-display);padding:9px 16px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
.shot{width:100%;border-radius:10px;border:1px solid var(--line);-webkit-touch-callout:default}
.kbd{font:600 12px var(--f-display);color:var(--boost)}
#learnBtn{background:var(--boost);color:#1a1405;position:relative}
#learnBtn.new::after{content:"";position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--panel)}
@media (max-width:420px){.seg button{min-width:30px;padding:0 4px}}
#coach{grid-area:coach;display:flex;flex-direction:column;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);height:clamp(132px,24vh,190px);min-height:0;min-width:0}
#coach[hidden]{display:none}
#coach.min{height:auto}
#coach.min .ch-say{display:none}
.ch-h{display:flex;align-items:center;gap:6px;min-width:0}
.ch-tag{flex:none;font:700 9px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#1a1405;background:var(--boost);padding:3px 6px;border-radius:5px}
.ch-title{flex:1;min-width:0;font:600 14px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ib.sm{width:32px;height:32px;border-radius:8px}
.ib.sm svg{width:18px;height:18px}
.ch-say{flex:1;min-height:0;overflow:auto;margin:0;font:500 15px/1.42 var(--f-body);color:var(--fg);-webkit-user-select:text;user-select:text}
.ch-say .sn{font:700 11px var(--f-display);letter-spacing:.08em;color:var(--boost);margin-right:8px}
.ch-say i{color:var(--dim)}
.ch-nav{display:flex;align-items:center;gap:6px}
.ch-nav .btn{height:38px;padding:0 12px}
.ch-nav .grow{justify-content:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.wide{width:100%;justify-content:center;height:48px;font-size:16px;margin:4px 0 6px}
.btn[disabled]{opacity:.35}
.card.tall{max-height:94%}
.progrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.progrow span{font:600 12px var(--f-display);color:var(--dim);white-space:nowrap}
.prog{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--boost),#3ddc84);border-radius:4px}
.nextup{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;background:linear-gradient(120deg,rgba(255,201,60,.18),rgba(61,155,255,.12));border:1px solid rgba(255,201,60,.45);text-align:left;margin-bottom:10px}
.nextup b{font:700 16px var(--f-display)}.nextup small{color:var(--dim)}.nextup .lbl{color:var(--boost)}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);text-align:left;min-height:96px}
.hc svg{width:24px;height:24px;color:var(--boost)}
.hc b{font:700 13px/1.15 var(--f-display)}.hc small{color:var(--dim);font-size:11.5px;line-height:1.25}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:-16px;z-index:2;background:var(--panel);padding:12px 0 8px;margin-top:8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font:600 13px var(--f-display);color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cnt{color:var(--boost);letter-spacing:.04em}
.les{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:var(--panel2);text-align:left;border:1px solid transparent}
.les:active{border-color:var(--line)}
.les .lm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.les .lm b{font:600 14.5px var(--f-display);line-height:1.2}
.les .lm small{color:var(--dim);font-size:12.5px;line-height:1.3}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 13px var(--f-display);color:#06240f}
.les.done .ck{background:#3ddc84;border-color:#3ddc84}
.lv{flex:none;font:700 9px var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:6px}
.lv1{background:rgba(61,220,132,.16);color:#6ff0a6}.lv2{background:rgba(61,155,255,.18);color:#8fc4ff}.lv3{background:rgba(199,125,255,.2);color:#dcb3ff}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.donebadge{font:700 11px var(--f-display);color:#3ddc84}
.tipl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.tipl li{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);color:var(--fg);line-height:1.4}
.tipl li::before{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-display);margin-top:1px}
.tipl.ok li::before{content:"\2713";background:rgba(61,220,132,.2);color:#6ff0a6}
.tipl.no li::before{content:"\2717";background:rgba(255,77,94,.2);color:#ff8d98}
.card .qq{color:var(--fg);font:600 15.5px/1.4 var(--f-body);margin:0 0 10px}
.qopt{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;margin-bottom:6px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font:500 15px/1.3 var(--f-body);color:var(--fg)}
.qopt .qk{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line);display:grid;place-items:center;font:700 12px var(--f-display)}
.qopt.ok{border-color:#3ddc84;background:rgba(61,220,132,.13)}
.qopt.no{border-color:var(--danger);background:rgba(255,77,94,.13)}
.qopt[disabled]{cursor:default}
.qopt[disabled]:not(.ok):not(.no){opacity:.55}
.why{padding:11px 13px;border-radius:12px;background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.4);color:var(--fg);line-height:1.45;margin-top:4px}
.why.good{background:rgba(61,220,132,.1);border-color:rgba(61,220,132,.45)}
.rules{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:6px}
.rules li{counter-increment:r;display:grid;grid-template-columns:32px 1fr;column-gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.rules li::before{content:counter(r);grid-row:span 2;width:30px;height:30px;border-radius:9px;background:var(--boost);color:#1a1405;display:grid;place-items:center;font:700 14px var(--f-display)}
.rules b{font:600 15px var(--f-display)}.rules small{color:var(--dim);line-height:1.35}
.kt{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
#ktPic{flex:none;border-radius:12px;overflow:hidden}
.ktq{flex:1;min-width:0}
.streak{font:600 12px var(--f-display);color:var(--dim)}.streak b{color:var(--boost)}
.role{padding:7px 10px;border-radius:10px;background:var(--panel2);margin-top:6px;border-left:4px solid #fff}
.role b{display:block;font:700 13px var(--f-display)}.role small{color:var(--dim);font-size:12.5px}
.role.go{border-color:#ffc93c}.role.ch{border-color:#3d9bff}.role.bo{border-color:#3ddc84}
.kowrap{display:flex;gap:12px;align-items:flex-start;margin:6px 0 10px}.kowrap>div{flex:1;min-width:0}
.kitem svg{flex:none}
textarea.note{height:120px;font:500 16px/1.4 var(--f-body)}
@media (max-width:420px){.kt{flex-direction:column;align-items:center}.ktq{width:100%}}
@media (orientation:landscape) and (max-height:620px), (orientation:landscape) and (min-width:900px){
  #coach{height:auto;min-height:0;border-left:1px solid var(--line)}
  .ch-say{flex:1 1 auto;min-height:2.8em;font-size:14px}
  .ch-tag{display:none}
  .ch-nav .btn{padding:0 10px;white-space:nowrap}
  .ch-nav .t{display:none}
}

.seg.tabs{display:flex;width:100%;margin:10px 0 4px}.seg.tabs button{flex:1;height:38px;font-size:14px}
.seg.tabs button[data-t="coach"]{color:var(--boost)}.seg.tabs button[data-t="coach"][aria-pressed="true"]{background:var(--boost);color:#1a1405}
.coachhead{margin:10px 0 2px;padding:12px 14px;border-radius:14px;background:linear-gradient(120deg,rgba(255,201,60,.16),rgba(61,220,132,.1));border:1px solid rgba(255,201,60,.4)}
.coachhead .ctitle{color:var(--fg);font-size:15px;letter-spacing:.02em;text-transform:none;margin:8px 0 4px}.coachhead p{margin:0}
.unit{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--panel2);text-align:left;border:1px solid transparent}
.unit .un{flex:none;width:30px;height:30px;border-radius:9px;background:var(--boost);color:#1a1405;display:grid;place-items:center;font:700 14px var(--f-display)}
.unit.done .un{background:#3ddc84;color:#06240f}
.unit .lm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.unit .lm b{font:600 14.5px var(--f-display);line-height:1.2}.unit .lm small{color:var(--dim);font-size:12.5px;line-height:1.3}
.unit .hasnote svg{width:18px;height:18px;color:var(--boost)}
.utitle{display:flex;align-items:center;gap:8px}.utitle h2{flex:1;margin:0}
.uin{flex:1;min-width:0;font:700 19px var(--f-display);background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.tipl.drill li::before{content:"\25B6";background:rgba(61,155,255,.2);color:#8fc4ff;font-size:9px}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);cursor:pointer}
.chk input{width:22px;height:22px;accent-color:#3ddc84;flex:none}
.hint{font-size:12.5px;color:var(--dim);margin-top:10px}
</style>

<div id="app">
  <div id="top">
    <button class="ib" id="menuBtn" aria-label="Menu"></button>
    <button class="ib" id="learnBtn" aria-label="Academy: lessons, kickoff trainer, quiz" title="Academy"></button>
    <button id="mapBtn" aria-label="Choose map"><span class="sw"></span><span class="nm"></span><span class="ar"></span></button>
    <div class="seg" id="modeSeg" role="group" aria-label="Game mode"></div>
    <button class="ib" id="saveBtn" aria-label="Save play"></button>
  </div>
  <div id="stage"><canvas id="cv" aria-label="Tactics board"></canvas><div id="hist"><button class="ib" id="undoBtn" aria-label="Undo"></button><button class="ib" id="redoBtn" aria-label="Redo"></button></div></div>
  <div id="coach" hidden>
    <div class="ch-h"><span class="ch-tag" id="chTag"></span><b class="ch-title" id="chTitle"></b><button class="ib sm" id="chMin" aria-label="Collapse notes"></button><button class="ib sm" id="chClose" aria-label="Hide notes"></button></div>
    <p class="ch-say" id="chSay" aria-live="polite"></p>
    <div class="ch-nav"><button class="btn" id="chPrev" aria-label="Previous step">&lsaquo;<span class="t">&nbsp;Back</span></button><button class="btn pri grow" id="chNext">Next step &rsaquo;</button><button class="btn" id="chInfo">Tips</button><button class="ib sm" id="chEdit" aria-label="Edit step note"></button></div>
  </div>
  <div id="tools" role="toolbar" aria-label="Tools"></div>
  <div id="time">
    <button class="ib" id="playBtn" aria-label="Play animation"></button>
    <button class="ib" id="speedBtn" aria-label="Playback speed">1x</button>
    <button class="ib" id="loopBtn" aria-label="Loop" aria-pressed="false"></button>
    <div id="frames"></div>
    <button class="ib" id="noteBtn" aria-label="Step note" title="Step note"></button>
    <button class="ib" id="delFrameBtn" aria-label="Delete step"></button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(()=>{
'use strict';
// ---------- icons ----------
const I={
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
 redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/>',
 save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
 move:'<path d="M6 3l13 7-6 1.6L10.5 18z"/>',
 arrow:'<path d="M5 19L19 5"/><path d="M10 5h9v9"/>',
 run:'<path d="M4 19c3-9 9-1 13-11"/><path d="M12.5 7.5L17 8l1-4.6"/>',
 pass:'<path d="M5 19l2-2M10 14l2-2M15 9l4-4" /><path d="M11 5h8v8"/>',
 pen:'<path d="M4 20l4-1L19 8l-3-3L5 16z"/>',
 zone:'<ellipse cx="12" cy="12" rx="8.5" ry="6.5" stroke-dasharray="3 3"/>',
 text:'<path d="M5 6h14M12 6v13M9 19h6"/>',
 eraser:'<path d="M9 20h11"/><path d="M4.5 15.5l9-9 6 6-7.5 7.5H8.5z"/>',
 clear:'<path d="M4 7h16M10 7V4h4v3M6.5 7l1 13h9l1-13"/>',
 play:'<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
 pause:'<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/>',
 loop:'<path d="M17 3l3 3-3 3"/><path d="M4 12V10a4 4 0 014-4h12"/><path d="M7 21l-3-3 3-3"/><path d="M20 12v2a4 4 0 01-4 4H4"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/>',
 kick:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/><circle cx="15" cy="15" r="1.3" fill="currentColor"/><circle cx="15" cy="9" r="1.3" fill="currentColor"/><circle cx="9" cy="15" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>',
 cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c3.5 2.7 8.5 2.7 12 0v-4.5"/><path d="M22 9v6"/>',
 quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6v.3"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
 star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 up:'<path d="M6 15l6-6 6 6"/>',
 down:'<path d="M6 9l6 6 6-6"/>',
 note:'<path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5"/><path d="M8 9h8M8 12.5h5"/>',
};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- data ----------
const MAPS=[
 {id:'dfh',name:'DFH Stadium',arena:'soccar',g:['#2f7a37','#2a6e31'],wall:'#9fb3c8'},
 {id:'mannfield',name:'Mannfield',arena:'soccar',g:['#3f8a3a','#387d34'],wall:'#c9b48a'},
 {id:'champions',name:'Champions Field',arena:'soccar',g:['#256b45','#205f3d'],wall:'#d5c27a'},
 {id:'urban',name:'Urban Central',arena:'soccar',g:['#4b6a52','#43604a'],wall:'#8f9aa8'},
 {id:'beckwith',name:'Beckwith Park',arena:'soccar',g:['#3a6a2f','#335f29'],wall:'#a58d6a'},
 {id:'utopia',name:'Utopia Coliseum',arena:'soccar',g:['#2f6a6a','#2a5f5f'],wall:'#e6d9b5'},
 {id:'neotokyo',name:'Neo Tokyo',arena:'soccar',g:['#2b2d5a','#26284f'],wall:'#ff4fd8'},
 {id:'wasteland',name:'Wasteland',arena:'soccar',g:['#6d5a39','#625132'],wall:'#b07a3c'},
 {id:'aquadome',name:'AquaDome',arena:'soccar',g:['#1f5d73','#1b5366'],wall:'#7fe0ff'},
 {id:'tactical',name:'Tactical (plain)',arena:'soccar',g:['#1d2638','#1a2233'],wall:'#5a6a8a'},
 {id:'hoops',name:'Dunk House',arena:'hoops',g:['#b57c45','#a9723f'],wall:'#e3c08f'},
 {id:'snow',name:'Snowy DFH',arena:'snow',g:['#e4eef4','#dbe7ee'],wall:'#9fb3c8'},
 {id:'drop',name:'Core 707',arena:'drop',g:['#1b2032','#171b2a'],wall:'#8a7cff'},
];
const ARENA_LABEL={soccar:'Soccar',hoops:'Hoops',snow:'Snow Day',drop:'Dropshot'};
const R3=Math.sqrt(3);
const ARENAS={
 soccar:{hx:4096,hy:5120,corner:1152,goal:893,depth:880,pads:true},
 snow:{hx:4096,hy:5120,corner:1300,round:true,goal:893,depth:620,pads:true},
 hoops:{hx:2966,hy:3581,corner:620,round:true,goal:0,depth:0,pads:false},
 drop:{hx:5120,hy:5120*R3/2,goal:0,depth:0,pads:false,hex:true},
};
const BIG=[[-3584,0],[3584,0],[-3072,-4096],[3072,-4096],[-3072,4096],[3072,4096]];
const SMALL=[[0,-4240],[-1792,-4184],[1792,-4184],[-940,-3308],[940,-3308],[0,-2816],[-3584,-2484],[3584,-2484],[-1788,-2300],[1788,-2300],[-2048,-1036],[0,-1024],[2048,-1036],[-1024,0],[1024,0],[-2048,1036],[0,1024],[2048,1036],[-1788,2300],[1788,2300],[-3584,2484],[3584,2484],[0,2816],[-940,3308],[940,3308],[-1792,4184],[1792,4184],[0,4240]];
const KO={diagL:[-2048,-2560],diagR:[2048,-2560],offL:[-256,-3840],offR:[256,-3840],back:[0,-4608]};
const KO_MODE={1:['back'],2:['diagL','offR'],3:['diagL','diagR','back'],4:['diagL','diagR','offL','back']};
const SPOTS=['diagL','diagR','offL','offR','back'];
const SPOT_NAME={diagL:'Diagonal left',diagR:'Diagonal right',offL:'Off-center left',offR:'Off-center right',back:'Straight'};
function combos(n){const out=[];const rec=(i,acc)=>{if(acc.length===n){out.push(acc.slice());return}for(let j=i;j<5;j++){acc.push(SPOTS[j]);rec(j+1,acc);acc.pop()}};rec(0,[]);return out}
const COLORS=['#ffc93c','#f4f6fb','#3d9bff','#ff8a1f','#ff4d5e','#3ddc84','#c77dff'];
const TOOLS=[['run','Arrow'],['pass','Pass'],['text','Text'],['eraser','Erase']];

// ---------- storage ----------
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const settings=Object.assign({pads:true,ghosts:true,labels:true,face:true,size:1,speed:1,loop:false},LS.get('bb.settings',{}));
const saveSettings=()=>LS.set('bb.settings',settings);

// ---------- state ----------
const ang=(x,y)=>Math.atan2(y,x);
const arenaOf=mapId=>ARENAS[(MAPS.find(m=>m.id===mapId)||MAPS[0]).arena];
function kickoffObjs(mode,mapId,kick){
  const A=arenaOf(mapId), fx=A.hx/4096, fy=A.hy/5120, objs=[];
  ((kick&&kick.length===mode)?kick:KO_MODE[mode]).forEach((k,i)=>{
    const [x,y]=KO[k];
    objs.push({id:'b'+(i+1),kind:'car',team:'b',x:x*fx,y:y*fy,a:ang(-x,-y)});
    objs.push({id:'o'+(i+1),kind:'car',team:'o',x:-x*fx,y:-y*fy,a:ang(x,y)});
  });
  objs.push({id:'ball',kind:'ball',x:0,y:0});
  return objs;
}
function newBoard(mode=3,map='dfh'){return {name:'',map,mode,frames:[{objs:kickoffObjs(mode,map),marks:[]}]}}
let S=LS.get('bb.current',null);
if(!S||!S.frames||!S.frames.length) S=newBoard();
let cur=Math.min(LS.get('bb.cur',0),S.frames.length-1);
let tool='run', color=COLORS[0], selected=null;
let undoStack=[], redoStack=[];
const clone=o=>JSON.parse(JSON.stringify(o));
function pushHistory(){undoStack.push(JSON.stringify({S,cur}));if(undoStack.length>80)undoStack.shift();redoStack=[];syncUndo()}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify({S,cur}));const r=JSON.parse(undoStack.pop());S=r.S;cur=r.cur;afterLoad()}
function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify({S,cur}));const r=JSON.parse(redoStack.pop());S=r.S;cur=r.cur;afterLoad()}
let saveT=0;
function changed(){dirty=true;clearTimeout(saveT);saveT=setTimeout(()=>{LS.set('bb.current',S);LS.set('bb.cur',cur)},250)}
function afterLoad(){cur=Math.max(0,Math.min(cur,S.frames.length-1));selected=null;stopPlay();buildTop();buildFrames();syncUndo();changed();syncCoach()}
const frame=()=>S.frames[cur];
const mapObj=()=>MAPS.find(m=>m.id===S.map)||MAPS[0];
const arena=()=>ARENAS[mapObj().arena];

// ---------- canvas / view ----------
const cv=$('#cv'), ctx=cv.getContext('2d');
let DPR=1, dirty=true, zoom=1, panX=0, panY=0, V={};
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);dirty=true}
new ResizeObserver(resize).observe($('#stage'));
function view(){
  const W=cv.clientWidth,H=cv.clientHeight,A=arena();
  const bx=A.hx+120, by=A.hy+(A.depth||0)+160;
  const land=W>=H;
  const s0=(land?Math.min(W/(2*by),H/(2*bx)):Math.min(W/(2*bx),H/(2*by)))*0.97;
  V={W,H,land,s0,s:s0*zoom,cx:W/2+panX,cy:H/2+panY};
}
const Rv=(x,y)=>V.land?[y,x]:[x,-y];
function w2s(x,y){const r=Rv(x,y);return [V.cx+r[0]*V.s,V.cy+r[1]*V.s]}
function s2w(px,py){const u=(px-V.cx)/V.s,v=(py-V.cy)/V.s;return V.land?[v,u]:[u,-v]}
const px=n=>n/V.s;
function worldTf(){const d=DPR,s=V.s;if(V.land)ctx.setTransform(0,s*d,s*d,0,V.cx*d,V.cy*d);else ctx.setTransform(s*d,0,0,-s*d,V.cx*d,V.cy*d)}
function screenTf(){ctx.setTransform(DPR,0,0,DPR,0,0)}
const objScale=()=>settings.size*Math.min(1.6,Math.sqrt(zoom));

// ---------- drawing: arena ----------
function rr(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function arenaPath(A){
  ctx.beginPath();
  const {hx,hy}=A;
  if(A.hex){ctx.moveTo(-hx,0);ctx.lineTo(-hx/2,-hy);ctx.lineTo(hx/2,-hy);ctx.lineTo(hx,0);ctx.lineTo(hx/2,hy);ctx.lineTo(-hx/2,hy);ctx.closePath();return}
  if(A.round){rr(-hx,-hy,2*hx,2*hy,A.corner);return}
  const c=A.corner;
  ctx.moveTo(-hx+c,-hy);ctx.lineTo(hx-c,-hy);ctx.lineTo(hx,-hy+c);ctx.lineTo(hx,hy-c);ctx.lineTo(hx-c,hy);ctx.lineTo(-hx+c,hy);ctx.lineTo(-hx,hy-c);ctx.lineTo(-hx,-hy+c);ctx.closePath();
}
function drawGoal(A,side,ice){
  const s=side, g=A.goal, d=A.depth, y0=s*A.hy, col=s<0?'61,155,255':'255,138,31';
  ctx.save();
  ctx.beginPath();ctx.rect(-g,Math.min(y0,y0+s*d),2*g,d);
  ctx.fillStyle=`rgba(${col},${ice?.22:.32})`;ctx.fill();
  ctx.clip();
  ctx.strokeStyle=`rgba(255,255,255,${ice?.35:.18})`;ctx.lineWidth=px(1);
  for(let x=-g;x<=g;x+=180){ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y0+s*d);ctx.stroke()}
  for(let k=0;k<=d;k+=180){ctx.beginPath();ctx.moveTo(-g,y0+s*k);ctx.lineTo(g,y0+s*k);ctx.stroke()}
  ctx.restore();
  ctx.strokeStyle=`rgb(${col})`;ctx.lineWidth=px(3);
  ctx.beginPath();ctx.moveTo(-g,y0);ctx.lineTo(-g,y0+s*d);ctx.lineTo(g,y0+s*d);ctx.lineTo(g,y0);ctx.stroke();
}
function drawArena(){
  const A=arena(), M=mapObj(), type=M.arena, {hx,hy}=A;
  const line='rgba(255,255,255,.6)', lw=px(2);
  if(A.goal){drawGoal(A,-1,type==='snow');drawGoal(A,1,type==='snow')}
  ctx.save();arenaPath(A);ctx.fillStyle=M.g[0];ctx.fill();ctx.clip();
  // floor texture
  if(type==='soccar'){for(let y=-hy,i=0;y<hy;y+=640,i++){if(i%2){ctx.fillStyle=M.g[1];ctx.fillRect(-hx,y,2*hx,640)}}}
  else if(type==='hoops'){ctx.strokeStyle='rgba(60,30,10,.22)';ctx.lineWidth=px(1);for(let x=-hx;x<hx;x+=260){ctx.beginPath();ctx.moveTo(x,-hy);ctx.lineTo(x,hy);ctx.stroke()}}
  else if(type==='snow'){ctx.fillStyle=M.g[1];for(let y=-hy,i=0;y<hy;y+=900,i++){if(i%2)ctx.fillRect(-hx,y,2*hx,900)}}
  // team halves tint
  ctx.fillStyle=type==='snow'?'rgba(61,155,255,.06)':'rgba(61,155,255,.10)';ctx.fillRect(-hx,-hy,2*hx,hy);
  ctx.fillStyle=type==='snow'?'rgba(255,138,31,.06)':'rgba(255,138,31,.10)';ctx.fillRect(-hx,0,2*hx,hy);
  ctx.lineWidth=lw;ctx.strokeStyle=line;
  if(type==='soccar'){
    ctx.beginPath();ctx.moveTo(-hx,0);ctx.lineTo(hx,0);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,1000,0,7);ctx.stroke();
    ctx.fillStyle=line;ctx.beginPath();ctx.arc(0,0,px(3),0,7);ctx.fill();
    for(const s of[-1,1]){ctx.beginPath();ctx.rect(-1900,s>0?hy-1300:-hy,3800,1300);ctx.stroke();ctx.beginPath();ctx.rect(-1100,s>0?hy-520:-hy,2200,520);ctx.stroke()}
  }else if(type==='snow'){
    ctx.strokeStyle='rgba(214,48,64,.75)';ctx.lineWidth=px(4);ctx.beginPath();ctx.moveTo(-hx,0);ctx.lineTo(hx,0);ctx.stroke();
    ctx.strokeStyle='rgba(40,110,220,.7)';for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(-hx,s*1700);ctx.lineTo(hx,s*1700);ctx.stroke()}
    ctx.lineWidth=lw;ctx.beginPath();ctx.arc(0,0,900,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(214,48,64,.6)';
    for(const sx of[-1,1])for(const sy of[-1,1]){ctx.beginPath();ctx.arc(sx*2100,sy*3500,650,0,7);ctx.stroke();ctx.fillStyle='rgba(214,48,64,.7)';ctx.beginPath();ctx.arc(sx*2100,sy*3500,px(4),0,7);ctx.fill()}
    for(const s of[-1,1]){ctx.fillStyle='rgba(90,160,230,.28)';ctx.beginPath();ctx.arc(0,s*hy,800,s<0?0:Math.PI,s<0?Math.PI:2*Math.PI);ctx.fill();ctx.strokeStyle='rgba(214,48,64,.7)';ctx.stroke()}
  }else if(type==='hoops'){
    ctx.strokeStyle='rgba(255,255,255,.75)';
    ctx.beginPath();ctx.moveTo(-hx,0);ctx.lineTo(hx,0);ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,700,0,7);ctx.stroke();
    for(const s of[-1,1]){
      const ry=s*(hy-470), col=s<0?'61,155,255':'255,138,31';
      ctx.fillStyle=`rgba(${col},.22)`;ctx.beginPath();ctx.rect(-950,s>0?hy-1700:-hy,1900,1700);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.arc(0,ry,2300,s<0?0:Math.PI,s<0?Math.PI:2*Math.PI);ctx.stroke();
      ctx.lineWidth=px(5);ctx.strokeStyle=`rgb(${col})`;ctx.beginPath();ctx.arc(0,ry,380,0,7);ctx.stroke();
      ctx.lineWidth=px(1);ctx.strokeStyle='rgba(255,255,255,.6)';for(let k=-300;k<=300;k+=150){ctx.beginPath();ctx.moveTo(k,ry-Math.sqrt(380*380-k*k));ctx.lineTo(k,ry+Math.sqrt(380*380-k*k));ctx.stroke()}
      ctx.lineWidth=lw;ctx.strokeStyle='rgba(255,255,255,.75)';
    }
  }else if(type==='drop'){
    const rt=420, dx=R3*rt, dy=1.5*rt;
    for(let row=-12;row<=12;row++){const y=row*dy, off=(row&1)?dx/2:0;
      if(Math.abs(y)<rt*1.05)continue;
      for(let col=-14;col<=14;col++){const x=col*dx+off;
        if(!(Math.abs(y)+rt<=hy && Math.abs(y)+rt*0.95<=R3*(hx-Math.abs(x)-rt*0.6)))continue;
        ctx.beginPath();for(let k=0;k<6;k++){const a=Math.PI/6+k*Math.PI/3, r=rt*0.9;ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a))}ctx.closePath();
        ctx.fillStyle=y<0?'rgba(61,155,255,.20)':'rgba(255,138,31,.20)';ctx.fill();
        ctx.strokeStyle=y<0?'rgba(61,155,255,.55)':'rgba(255,138,31,.55)';ctx.lineWidth=px(1.2);ctx.stroke();}}
    ctx.strokeStyle='rgba(180,170,255,.9)';ctx.lineWidth=px(3);ctx.beginPath();ctx.moveTo(-hx,0);ctx.lineTo(hx,0);ctx.stroke();
  }
  ctx.restore();
  // pads
  if(A.pads&&settings.pads){
    const fx=A.hx/4096, fy=A.hy/5120;
    for(const [x,y] of SMALL){ctx.fillStyle='rgba(255,201,60,.55)';ctx.beginPath();ctx.arc(x*fx,y*fy,Math.max(90,px(2.6)),0,7);ctx.fill()}
    for(const [x,y] of BIG){const r=Math.max(210,px(6));
      ctx.fillStyle='rgba(255,201,60,.22)';ctx.beginPath();ctx.arc(x*fx,y*fy,r*1.8,0,7);ctx.fill();
      ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.arc(x*fx,y*fy,r,0,7);ctx.fill();
      ctx.strokeStyle='rgba(60,40,0,.6)';ctx.lineWidth=px(1.2);ctx.stroke();}
  }
  // walls
  arenaPath(A);ctx.strokeStyle=M.wall;ctx.globalAlpha=.9;ctx.lineWidth=px(4);ctx.stroke();ctx.globalAlpha=1;
}

// ---------- drawing: objects ----------
const TEAM={b:{fill:'#2f86f0',dark:'#164a8c',hi:'#9cd0ff'},o:{fill:'#ff8a1f',dark:'#8f4508',hi:'#ffd2a3'}};
function drawCar(o,alpha=1,sel=false){
  const k=objScale(), L=px(46*k), W=px(29*k), T=TEAM[o.team];
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(o.x,o.y);ctx.rotate(o.a||0);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();rr(-L/2+px(1.5),-W/2+px(2),L,W,W*0.3);ctx.fill();
  if(sel){ctx.strokeStyle='#ffc93c';ctx.lineWidth=px(3);ctx.beginPath();rr(-L/2-px(4),-W/2-px(4),L+px(8),W+px(8),W*0.45);ctx.stroke()}
  ctx.fillStyle=T.fill;ctx.beginPath();rr(-L/2,-W/2,L,W,W*0.3);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=px(1.5);ctx.stroke();
  // cabin + windshield
  ctx.fillStyle=T.dark;ctx.beginPath();rr(-L*0.22,-W*0.36,L*0.42,W*0.72,W*0.18);ctx.fill();
  ctx.fillStyle=T.hi;ctx.beginPath();ctx.moveTo(L*0.2,-W*0.33);ctx.lineTo(L*0.33,-W*0.26);ctx.lineTo(L*0.33,W*0.26);ctx.lineTo(L*0.2,W*0.33);ctx.closePath();ctx.fill();
  // headlights
  ctx.fillStyle='#fff8d0';ctx.beginPath();ctx.arc(L*0.47,-W*0.3,px(1.6*k),0,7);ctx.arc(L*0.47,W*0.3,px(1.6*k),0,7);ctx.fill();
  ctx.restore();
}
function drawBall(o,alpha=1,sel=false){
  const type=mapObj().arena, k=objScale(), r=px((type==='hoops'?19:17)*k);
  ctx.save();ctx.globalAlpha=alpha;
  if(sel){ctx.strokeStyle='#ffc93c';ctx.lineWidth=px(3);ctx.beginPath();ctx.arc(o.x,o.y,r+px(5),0,7);ctx.stroke()}
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(o.x+px(1.5),o.y-px(2),r,0,7);ctx.fill();
  if(type==='snow'){
    ctx.fillStyle='#14161c';ctx.beginPath();ctx.ellipse(o.x,o.y,r*1.15,r*1.15,0,0,7);ctx.fill();
    ctx.strokeStyle='#5a6070';ctx.lineWidth=px(1.5);ctx.stroke();
  }else{
    const g=ctx.createRadialGradient(o.x-r*.3,o.y-r*.3,r*.1,o.x,o.y,r);
    g.addColorStop(0,'#ffffff');g.addColorStop(1,type==='drop'?'#c9c2ff':type==='hoops'?'#f2d3b0':'#c9d2df');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,r,0,7);ctx.fill();
    ctx.strokeStyle='#4b5568';ctx.lineWidth=px(1.4);ctx.stroke();
    ctx.strokeStyle='rgba(75,85,104,.55)';ctx.lineWidth=px(1);
    for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(o.x+Math.cos(a)*r*.35,o.y+Math.sin(a)*r*.35);ctx.lineTo(o.x+Math.cos(a)*r*.95,o.y+Math.sin(a)*r*.95);ctx.stroke()}
    ctx.beginPath();ctx.arc(o.x,o.y,r*.35,0,7);ctx.stroke();
  }
  ctx.restore();
}
function carLabel(o){return o.label||o.id.slice(1)}
function drawLabels(objs,alpha=1){
  if(!settings.labels)return;
  const k=objScale();
  for(const o of objs){if(o.kind!=='car')continue;
    const [sx,sy]=w2s(o.x,o.y), lab=carLabel(o), custom=!!o.label&&o.label.length>2;
    ctx.globalAlpha=alpha;
    if(custom){
      ctx.font=`600 ${Math.round(11*Math.min(k,1.3))}px ${FONT}`;
      const w=ctx.measureText(lab).width+10, yy=sy+24*k;
      ctx.fillStyle='rgba(8,11,20,.78)';ctx.beginPath();rrS(sx-w/2,yy,w,16,8);ctx.fill();
      ctx.fillStyle=o.team==='b'?'#9cd0ff':'#ffd2a3';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lab,sx,yy+8.5);
    }else{
      ctx.font=`700 ${Math.round(15*k)}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(lab,sx,sy+0.5);ctx.fillStyle='#fff';ctx.fillText(lab,sx,sy+0.5);
    }

}
function rrS(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const FONT='"Chakra Petch","Arial Narrow",sans-serif';

// ---------- drawing: marks ----------
function smoothPath(p){
  ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
  if(p.length<3){ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);return}
  for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0],p[i][1],mx,my)}
  ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);
}
function headDir(p){
  const t=p[p.length-1], need=px(16);
  for(let i=p.length-2;i>=0;i--){const dx=t[0]-p[i][0],dy=t[1]-p[i][1];if(Math.hypot(dx,dy)>=need||i===0)return Math.atan2(dy,dx)}
  return 0;
}
function drawMark(m,alpha=1){
  if(m.t==='text')return;
  const p=m.p;if(!p||p.length<2)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';
  const lw=px(m.t==='run'?4.2:m.t==='pen'?3:3.4);
  if(m.t==='zone'){
    const cx=(p[0][0]+p[1][0])/2, cy=(p[0][1]+p[1][1])/2, rx=Math.abs(p[1][0]-p[0][0])/2, ry=Math.abs(p[1][1]-p[0][1])/2;
    ctx.beginPath();ctx.ellipse(cx,cy,Math.max(rx,1),Math.max(ry,1),0,0,7);
    ctx.fillStyle=m.c;ctx.globalAlpha=alpha*.2;ctx.fill();ctx.globalAlpha=alpha;
    ctx.setLineDash([px(8),px(6)]);ctx.strokeStyle=m.c;ctx.lineWidth=px(2.5);ctx.stroke();ctx.restore();return;
  }
  const straight=m.t==='arrow';
  const pts=straight?[p[0],p[p.length-1]]:p;
  if(m.t==='pass')ctx.setLineDash([px(10),px(8)]);
  // dark casing for contrast on any floor
  smoothPath(pts);ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=lw+px(3);ctx.stroke();
  smoothPath(pts);ctx.strokeStyle=m.c;ctx.lineWidth=lw;ctx.stroke();ctx.setLineDash([]);
  if(m.t!=='pen'){
    const t=pts[pts.length-1], a=headDir(pts), hl=px(15), hw=0.45;
    ctx.beginPath();ctx.moveTo(t[0]+Math.cos(a)*px(3),t[1]+Math.sin(a)*px(3));
    ctx.lineTo(t[0]-Math.cos(a-hw)*hl,t[1]-Math.sin(a-hw)*hl);ctx.lineTo(t[0]-Math.cos(a+hw)*hl,t[1]-Math.sin(a+hw)*hl);ctx.closePath();
    ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=px(3);ctx.stroke();ctx.fillStyle=m.c;ctx.fill();
  }
  ctx.restore();
}
function drawTexts(marks,alpha=1){
  for(const m of marks){if(m.t!=='text')continue;
    const [sx,sy]=w2s(m.p[0][0],m.p[0][1]);
    ctx.globalAlpha=alpha;ctx.font=`700 14px ${FONT}`;
    const w=ctx.measureText(m.text).width+16;
    ctx.fillStyle='rgba(8,11,20,.82)';ctx.beginPath();rrS(sx-w/2,sy-12,w,24,7);ctx.fill();
    ctx.strokeStyle=m.c;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=m.c;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(m.text,sx,sy+1);
    ctx.globalAlpha=1;
  }
}

// ---------- animation ----------
let playing=false, playT=0, lastTs=0, holdT=0;
const segDur=()=>1.35/settings.speed;
function lerpA(a,b,t){let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*t}
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3)}
function objIn(f,id){return S.frames[f].objs.find(o=>o.id===id)}
function posAt(id,i,e){
  const n=S.frames.length, g=k=>objIn(Math.max(0,Math.min(n-1,k)),id)||objIn(i,id);
  const a=g(i-1),b=g(i),c=g(i+1),d=g(i+2);
  return [cr(a.x,b.x,c.x,d.x,e),cr(a.y,b.y,c.y,d.y,e)];
}
function interp(t){
  const n=S.frames.length;
  if(n<2)return S.frames[0].objs;
  const i=Math.min(n-2,Math.floor(t)), raw=Math.min(1,t-i), e=.5-Math.cos(Math.PI*raw)/2;
  return S.frames[i].objs.map(o=>{
    const nx=objIn(i+1,o.id);if(!nx)return o;
    const [x,y]=posAt(o.id,i,e);
    const r={...o,x,y};
    if(o.kind==='car'){
      const dist=Math.hypot(nx.x-o.x,nx.y-o.y);
      if(dist>250&&e<0.97){const [x2,y2]=posAt(o.id,i,Math.min(1,e+.03));const va=Math.atan2(y2-y,x2-x);
        const settle=Math.max(0,(e-.8)/.2);r.a=lerpA(va,nx.a,settle*settle);
        const start=Math.min(1,e/.12);r.a=lerpA(o.a,r.a,start);}
      else r.a=lerpA(o.a,nx.a,e);
    }
    return r;
  });
}
let playEnd=null;
function play(step){
  const n=S.frames.length;
  if(n<2){toast('Add a step first: tap + and move things');return}
  if(step){if(cur>=n-1)return;playT=cur;playEnd=cur+1}else{playEnd=null;playT=cur>=n-1?0:cur}
  selected=null;playing=true;holdT=0;lastTs=performance.now();syncPlay();loop();
}
function stopPlay(){if(!playing)return;playing=false;playEnd=null;syncPlay();dirty=true}
function loop(){
  if(!playing)return;
  const now=performance.now(), dt=Math.min(.05,(now-lastTs)/1000);lastTs=now;
  const end=playEnd!=null?playEnd:S.frames.length-1;
  if(playEnd!=null&&playT>=end){playing=false;playEnd=null;cur=end;syncPlay();buildFrames();dirty=true;return}
  if(playT>=end){holdT+=dt;if(holdT>.7){if(settings.loop){playT=0;holdT=0}else{playing=false;cur=end;syncPlay();buildFrames()}}}
  else{playT=Math.min(end,playT+dt/segDur())}
  const fi=Math.min(end,Math.floor(playT+1e-6));
  if(fi!==shownFrame){shownFrame=fi;highlightFrame(fi)}
  dirty=true;requestAnimationFrame(loop);
}
let shownFrame=-1;

// ---------- render ----------
let op=null;
function render(){
  view();
  screenTf();ctx.clearRect(0,0,V.W,V.H);
  worldTf();drawArena();
  let objs, marks, mAlpha=1;
  if(playing){
    objs=interp(playT);
    const n=S.frames.length, i=Math.min(n-1,Math.floor(playT+1e-6));
    marks=S.frames[i].marks; mAlpha=i<n-1?Math.max(.15,1-(playT-i)*.9):1;
  }else{objs=frame().objs;marks=frame().marks}
  for(const m of marks)drawMark(m,mAlpha);
  if(!playing&&settings.ghosts&&cur>0){
    const prev=S.frames[cur-1].objs;
    ctx.save();ctx.setLineDash([px(4),px(5)]);ctx.lineWidth=px(2);
    for(const g of prev){const o=objs.find(q=>q.id===g.id);if(!o)continue;
      if(Math.hypot(o.x-g.x,o.y-g.y)<px(20))continue;
      ctx.strokeStyle=g.kind==='ball'?'rgba(255,255,255,.55)':g.team==='b'?'rgba(120,190,255,.7)':'rgba(255,170,90,.7)';
      ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.lineTo(o.x,o.y);ctx.stroke();
      g.kind==='car'?drawCar(g,.3):drawBall(g,.3);}
    ctx.restore();
  }
  if(op&&op.mark)drawMark(op.mark,.9);
  const cars=objs.filter(o=>o.kind==='car'), balls=objs.filter(o=>o.kind==='ball');
  for(const o of cars)drawCar(o,1,!playing&&selected===o.id);
  for(const o of balls)drawBall(o,1,!playing&&selected===o.id);
  // rotation handle
  if(!playing&&selected){const o=objs.find(q=>q.id===selected);
    if(o&&o.kind==='car'){const h=handlePos(o);worldTf();
      const [hx,hy]=s2w(h[0],h[1]);ctx.strokeStyle='#ffc93c';ctx.lineWidth=px(2);ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(hx,hy);ctx.stroke();
      ctx.fillStyle='#ffc93c';ctx.beginPath();ctx.arc(hx,hy,px(12),0,7);ctx.fill();ctx.strokeStyle='#1a1405';ctx.lineWidth=px(1.5);
      ctx.beginPath();ctx.arc(hx,hy,px(6),-.4,4.2);ctx.stroke();}}
  screenTf();
  drawLabels(cars);
  drawTexts(marks,mAlpha);
  if(op&&op.mark&&op.mark.t==='text')drawTexts([op.mark]);
  // step badge
  ctx.font=`700 12px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='top';
  const n=S.frames.length, shown=playing?Math.min(n,Math.floor(playT+1e-6)+1):cur+1;
  let label=`STEP ${shown}/${n}${S.name?'  ·  '+S.name.toUpperCase():''}`;
  const maxW=V.W-110;if(ctx.measureText(label).width+16>maxW){while(label.length>8&&ctx.measureText(label+'…').width+16>maxW)label=label.slice(0,-1);label+='…'}
  ctx.fillStyle='rgba(8,11,20,.7)';const tw=ctx.measureText(label).width+16;ctx.beginPath();rrS(8,8,tw,22,6);ctx.fill();
  ctx.fillStyle='#c9d2e6';ctx.fillText(label,16,13);
}
function tick(){if(dirty){dirty=false;render()}requestAnimationFrame(tick)}
requestAnimationFrame(tick);

// ---------- hit testing ----------
function handlePos(o){const k=objScale(), d=px(50*k);return w2s(o.x+Math.cos(o.a)*d,o.y+Math.sin(o.a)*d)}
function hitObj(sx,sy){
  const objs=frame().objs, r=34*objScale();
  let best=null,bd=1e9;
  for(const o of objs){const [x,y]=w2s(o.x,o.y);const d=Math.hypot(x-sx,y-sy);const lim=o.kind==='ball'?r*.95:r;if(d<lim&&d<=bd+ (o.kind==='ball'?6:0)){best=o;bd=d}}
  return best;
}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hitMark(sx,sy,tol=16){
  const ms=frame().marks;
  for(let i=ms.length-1;i>=0;i--){const m=ms[i];
    if(m.t==='text'){const [x,y]=w2s(m.p[0][0],m.p[0][1]);ctx.font=`700 14px ${FONT}`;const w=ctx.measureText(m.text).width/2+10;if(Math.abs(sx-x)<w&&Math.abs(sy-y)<16)return i;continue}
    if(m.t==='zone'){const a=w2s(...m.p[0]),b=w2s(...m.p[1]);const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,rx=Math.max(8,Math.abs(a[0]-b[0])/2),ry=Math.max(8,Math.abs(a[1]-b[1])/2);
      const q=((sx-cx)/rx)**2+((sy-cy)/ry)**2;if(q<1.15)return i;continue}
    const pts=(m.t==='arrow'?[m.p[0],m.p[m.p.length-1]]:m.p).map(p=>w2s(p[0],p[1]));
    for(let j=0;j<pts.length-1;j++)if(segDist([sx,sy],pts[j],pts[j+1])<tol)return i;
  }
  return -1;
}

// ---------- input ----------
const ptrs=new Map();
let lastTap={t:0,x:0,y:0}, lpTimer=0;
function pt(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pt(e);ptrs.set(e.pointerId,p);closePop();
  if(playing)stopPlay();
  if(ptrs.size===2){clearTimeout(lpTimer);if(op&&op.mark)op.mark=null;
    const [a,b]=[...ptrs.values()];const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];view();
    op={type:'pinch',d0:Math.hypot(a[0]-b[0],a[1]-b[1])||1,z0:zoom,wp:s2w(m[0],m[1])};dirty=true;return}
  if(ptrs.size>2)return;
  view();
  const [sx,sy]=p, w=s2w(sx,sy);
  if(selected){const so=frame().objs.find(q=>q.id===selected);
    if(so&&so.kind==='car'){const h=handlePos(so);if(Math.hypot(h[0]-sx,h[1]-sy)<28){op={type:'rotate',o:so,pushed:false};return}}}
  const o=hitObj(sx,sy);
  if(o){selected=o.id;op={type:'drag',o,off:[o.x-w[0],o.y-w[1]],start:[sx,sy],last:[sx,sy],pushed:false,moved:false};dirty=true;
    if(o.kind==='car'){clearTimeout(lpTimer);lpTimer=setTimeout(()=>{if(op&&op.o===o&&!op.moved){op=null;editCar(o)}},560)}
    return}
  if(tool!=='eraser'){const mi=hitMark(sx,sy,12);
    if(mi>=0&&frame().marks[mi].t==='text'){const m=frame().marks[mi];op={type:'dragText',m,off:[m.p[0][0]-w[0],m.p[0][1]-w[1]],pushed:false};return}}
  selected=null;dirty=true;
  if(tool==='eraser'){op={type:'erase',pushed:false};eraseAt(sx,sy);return}
  if(tool==='text'){op={type:'textTap',w};return}
  op={type:'draw',mark:{t:tool,c:color,p:[w,w]},last:[sx,sy],start:[sx,sy]};dirty=true;
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=pt(e);ptrs.set(e.pointerId,p);
  if(!op)return;
  view();
  const [sx,sy]=p, w=s2w(sx,sy);
  switch(op.type){
    case 'pinch':{if(ptrs.size<2)return;const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      zoom=Math.max(1,Math.min(5,op.z0*d/op.d0));const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const s=V.s0*zoom, r=Rv(op.wp[0],op.wp[1]);panX=m[0]-V.W/2-r[0]*s;panY=m[1]-V.H/2-r[1]*s;
      if(zoom===1){panX=0;panY=0}dirty=true;break}
    case 'pan':{if(zoom>1){panX=op.p0[0]+sx-op.start[0];panY=op.p0[1]+sy-op.start[1];dirty=true}break}
    case 'drag':{const o=op.o;
      if(!op.moved&&Math.hypot(sx-op.start[0],sy-op.start[1])<4)return;
      if(!op.pushed){pushHistory();op.pushed=true}
      op.moved=true;clearTimeout(lpTimer);
      const ob=op.o;ob.x=w[0]+op.off[0];ob.y=w[1]+op.off[1];clampObj(ob);
      if(ob.kind==='car'&&settings.face){const dx=sx-op.last[0],dy=sy-op.last[1];
        if(Math.hypot(dx,dy)>3){const a=s2w(op.last[0],op.last[1]);const ta=Math.atan2(w[1]-a[1],w[0]-a[0]);ob.a=lerpA(ob.a,ta,.35);op.last=[sx,sy]}}
      changed();break}
    case 'rotate':{if(!op.pushed){pushHistory();op.pushed=true;op.o=frame().objs.find(q=>q.id===op.o.id)}
      const o=op.o;o.a=Math.atan2(w[1]-o.y,w[0]-o.x);changed();break}
    case 'dragText':{if(!op.pushed){pushHistory();op.pushed=true;const i=frame().marks.indexOf(op.m);op.m=frame().marks[i]||op.m}
      op.m.p[0]=[w[0]+op.off[0],w[1]+op.off[1]];changed();break}
    case 'erase':eraseAt(sx,sy);break;
    case 'draw':{const m=op.mark;
      if(m.t==='arrow'||m.t==='zone')m.p[1]=w;
      else if(Math.hypot(sx-op.last[0],sy-op.last[1])>5){if(m.p.length===2&&m.p[0]===m.p[1])m.p[1]=w;else m.p.push(w);op.last=[sx,sy]}
      dirty=true;break}
  }
},{passive:false});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  const p=pt(e);ptrs.delete(e.pointerId);
  if(!op)return;
  if(op.type==='pinch'){if(ptrs.size===0)op=null;return}
  clearTimeout(lpTimer);
  if(op.type==='draw'){const m=op.mark, a=w2s(...m.p[0]), b=w2s(...m.p[m.p.length-1]);
    let len=0;const sp=m.p.map(q=>w2s(q[0],q[1]));for(let i=1;i<sp.length;i++)len+=Math.hypot(sp[i][0]-sp[i-1][0],sp[i][1]-sp[i-1][1]);
    const ok=m.t==='zone'?Math.hypot(a[0]-b[0],a[1]-b[1])>14:len>14;
    if(ok){const chord=Math.hypot(a[0]-b[0],a[1]-b[1]);
      if((m.t==='run'||m.t==='pass')&&chord/len>0.93){m.p=[m.p[0],m.p[m.p.length-1]];if(m.t==='run')m.t='arrow'}
      else if(m.t!=='arrow'&&m.t!=='zone')m.p=simplify(m.p);
      pushHistory();frame().marks.push(m);changed()}
    else{const now=performance.now();

  }

document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(e.key===' '){e.preventDefault();playing?stopPlay():play();return}
  const map={a:'run',p:'pass',t:'text',e:'eraser'};
  if(map[e.key])setTool(map[e.key]);if(e.key==='r')resetPositions();if(e.key==='k')randomKick();if(e.key==='l')openLearn();
  if(e.key==='ArrowRight'&&cur<S.frames.length-1){cur++;afterFrame()}
  if(e.key==='ArrowLeft'&&cur>0){cur--;afterFrame()}
});

function exportImage(){
  stopPlay();selected=null;render();
  const url=cv.toDataURL('image/png');
  const {el}=modal(`<h2>Board image</h2><p>Press and hold the image, then choose Save to Photos or Share.</p><img class="shot" alt="Tactics board, step ${cur+1}" src="${url}"><div class="row" style="margin-top:12px" id="shRow"></div>`);
  if(navigator.canShare){cv.toBlob(b=>{try{const f=new File([b],'boost-board.png',{type:'image/png'});if(navigator.canShare({files:[f]})){const btn=document.createElement('button');btn.className='btn pri';btn.textContent='Share image';btn.onclick=()=>navigator.share({files:[f],title:S.name||'Boost Board'}).catch(()=>{});el.querySelector('#shRow').appendChild(btn)}}catch(e){}})}
}
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const dec=s=>decodeURIComponent(escape(atob(s.trim())));
function shareCode(){
  const code='BB1:'+enc(JSON.stringify({name:S.name,map:S.map,mode:S.mode,frames:S.frames}));
  const {el}=modal(`<h2>Play code</h2><p>Send this code to a teammate. They open Menu, Import code, and paste it.</p><textarea id="codeOut" readonly>${esc(code)}</textarea><div class="row" style="margin-top:12px"><button class="btn pri" id="cpy">Copy code</button></div>`);
  el.querySelector('#cpy').onclick=()=>{const ta=el.querySelector('#codeOut');
    const fb=()=>{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);toast('Code selected. Use Copy from the menu')};
    try{navigator.clipboard.writeText(code).then(()=>toast('Code copied'),fb)}catch(e){fb()}};
}
function importCode(){
  const {el,close}=modal(`<h2>Import play</h2><p>Paste a code that starts with BB1:</p><textarea id="codeIn" placeholder="BB1:..."></textarea><div class="row" style="margin-top:12px"><button class="btn pri" id="imp">Load play</button></div>`);
  el.querySelector('#imp').onclick=()=>{
    try{const raw=el.querySelector('#codeIn').value.trim().replace(/^BB1:/,'');const d=JSON.parse(dec(raw));
      if(!d.frames||!d.frames.length||!MAPS.find(m=>m.id===d.map))throw 0;
      pushHistory();S={name:d.name||'Imported play',map:d.map,mode:d.mode||3,frames:d.frames};cur=0;afterLoad();close();toast('Play imported')}
    catch(e){toast('That code is not valid. Copy the full code, including BB1:')}};
}

 tips:["Small pads give 12 and come back after 4 seconds. Big pads give 100 and come back after 10.","Plan your rotation through pads you already pass.","Take a big pad if it's on your path; don't detour across the field.","Aim for 30-60 boost as 3rd man. Position matters more than a full tank."],
 bad:["Crossing the whole field for a big pad","Going for boost while you're last back","Ignoring small pads"],
 quiz:{q:"You're rotating back with almost no boost. What's best?",o:["Drive across the field to the far big pad","Take the pads that are on your rotation path","Stay where you are"],a:1,why:"Pads on your path refill you without leaving your team short-handed."}},
{id:'r6',cat:'rot',lvl:2,title:'When to break rotation',sum:'Rotation is a guide, not a law. If you\'re clearly closest and it\'s safe, take it.',mode:3,steps:[
 {say:"A clear comes out to your left. You're the 3rd man, but you're far closer than anyone. Waiting for the 'right' player gives Orange a free touch.",pos:{ball:[-1400,-900],b1:[2400,2200,'1st'],b2:[1500,500,'2nd'],b3:[-1200,-2200,'3rd'],o1:[-200,600],o2:[1000,3000],o3:[-300,4600]},m:[R(G,[-1200,-2200],[-1350,-1150]),TX(G,-2500,-1800,'I got it!'),R(B,[1500,500],[300,-2800]),TX(B,1600,-2100,'Cover')]},
 {say:"So you take it and call 'I got it!'. Your 2nd sees you go and drops back to cover the net. Rotation bends around the play.",pos:{ball:[-1500,500],b3:[-1350,-700,'1st'],b2:[300,-2800,'3rd'],b1:[1600,1500,'2nd'],o1:[-600,1000]},m:[PS(W,[-1500,500],[-3000,2600])]}],
 tips:["The real goal: someone on the ball and someone back, at all times.","If you're clearly closest and it's safe, take it.","When a teammate breaks rotation, fill in behind them.","Always tell the team with quick chat."],

{id:'r7',cat:'rot',lvl:2,title:"The 2nd man's job",sum:'Follow-ups, 50/50s, rebounds and passes all land near the 2nd man.',mode:3,steps:[

 tips:["You're the follow-up. Shots, 50/50s, rebounds and passes all land near you.","Stay 3-4 car lengths behind the 1st, not beside them.","Face the play so you can react either way.","Keep some boost; you'll need speed when the ball pops."],
 bad:["Driving on the 1st man's bumper","Turning away from the play at the wrong moment"],

// ===== ATTACK =====

{id:'o2',cat:'off',lvl:2,title:'Centre pass from the corner',sum:'The corner is a bad place to shoot and a great place to pass from.',mode:3,steps:[

{id:'o3',cat:'off',lvl:2,title:'Backboard pass',sum:'Hit it up the back wall; the ball drops into the middle for your teammate.',mode:3,steps:[

{id:'o4',cat:'off',lvl:2,title:'Infield pass past a challenger',sum:'When an opponent commits to you, pass away from them.',mode:3,steps:[

{id:'o5',cat:'off',lvl:3,title:'Bump the goalie',sum:'A bump or demo on the last defender right as the shot comes = open net.',mode:3,steps:[

 {say:"The goalie is bumped out of the goal (or demolished) just before the shot arrives.",pos:{o1:[1300,4700,'BUMPED'],b2:[-150,4700],ball:[450,4300],b1:[400,3100]},m:[]},

// ===== DEFENSE =====
{id:'d1',cat:'def',lvl:1,title:'Shadow defense',sum:'Drive back between ball and net, match their speed, challenge on the bad touch.',mode:3,steps:[

 {say:"Match their speed. You're giving them space but no shot, and your teammates get time to get back.",pos:{ball:[450,-600],o1:[550,-100],b1:[350,-1800],b2:[-600,-3000],b3:[0,-4600],o2:[-1600,600]},m:[ZN(B,-300,-2400,1100,-1300)]},

 bad:["Diving at a controlled dribble","Turning your back on the ball to drive to net"],

{id:'d2',cat:'def',lvl:2,title:'Back-post defense',sum:'When the ball is in your corner, defend from the far post so you can see everything.',mode:3,steps:[
 {say:"Ball in your left corner. A defender sitting at the near (front) post can't see the middle, and a pass behind them is a free goal.",pos:{ball:[-2600,-3600],o1:[-2300,-3000],o2:[300,-1500],o3:[-200,600],b1:[-1200,-1800,'1st'],b2:[1300,-1900,'2nd'],b3:[-800,-4800,'3rd']},m:[ZN(Rd,-1300,-5100,-400,-4500),TX(Rd,-1900,-4300,'Front post: blind'),R(G,[-800,-4800],[750,-4700])]},
 {say:"From the back post you see the ball, the pass and every opponent. A shot at the near post still has to cross in front of you.",pos:{b3:[750,-4700]},m:[LN(G,[750,-4700],[-2600,-3600]),LN(G,[750,-4700],[300,-1500]),TX(G,1700,-3500,'See all')]},
 {say:"The centre pass comes, and the back-post defender steps up into it, facing the play.",pos:{ball:[400,-3300],o2:[350,-2600],b3:[450,-4100],o1:[-2400,-3300]},m:[PS(W,[-2600,-3600],[400,-3300]),R(G,[750,-4700],[450,-4100])]}],
 tips:["Ball on one side? Defend from the far post.","Facing the ball, you can drive forward into any save.","Rotating to the back post is also how you join the defense.","If the ball is right in front of the net, take the middle."],
 bad:["Hugging the near post","Sitting on the goal line facing the wall"],
 quiz:{q:"The ball is in your right corner. Where should the last defender be?",o:["Right post (near the ball)","Left post (back post)","Out in the corner with the ball"],a:1,why:"The back post lets you see the whole play and step up into passes or shots."}},
{id:'d3',cat:'def',lvl:1,title:'Clear to the corners',sum:'The middle is where the opponents wait. Send clears up the side walls.',mode:3,steps:[
 {say:"You're defending near your net. Where you send the ball matters. Red: the middle, where Orange is waiting. Green: up the side wall.",pos:{ball:[-1200,-3600],b3:[-900,-4300,'3rd'],b1:[600,-1500,'1st'],b2:[1400,-3000,'2nd'],o1:[-1300,-2700],o2:[500,-500],o3:[-400,1200]},m:[PS(Rd,[-1200,-3600],[300,-300]),TX(Rd,1300,-200,'Middle'),PS(G,[-1200,-3600],[-3800,800]),TX(G,-2800,1500,'Side wall')]},
 {say:"Clear it up the middle and it lands on an opponent, who shoots straight back.",pos:{ball:[300,-300],o2:[450,-700],b3:[-1000,-3900]},m:[PS(W,[300,-300],[0,-5000]),TX(Rd,1300,-2200,'Shot')]},
 {say:"Clear it up the side and it goes to a corner where nobody is. Your team has time to reset.",pos:{ball:[-3800,800],o2:[400,-500],b3:[-1100,-3800]},m:[TX(G,-2600,200,'Safe')]}],
 tips:["Clear toward the side walls and corners.","A soft clear to the side is better than a hard clear to the middle.","If you can't clear well, push the ball into the side wall.","Only clear to the middle when a teammate is clearly there to receive it."],
 bad:["Booming it up the middle every time","Hitting it across your own goal"],
 quiz:{q:"You're defending in front of your net. Where should you clear?",o:["Straight up the middle, as hard as you can","Up the side walls, toward the corners","Across the front of your own goal"],a:1,why:"The side walls send the ball away from where the opponents usually wait."}},
{id:'d4',cat:'def',lvl:1,title:"Last man: don't dive",sum:"If both teammates are ahead of the ball, you're the last line. Hold, don't gamble.",mode:3,steps:[
 {say:"Both teammates are up the field. You're the last player back. Challenge here and miss, and it's an open net.",pos:{ball:[300,400],o1:[400,1100],o2:[-1800,1400],o3:[1500,2600],b1:[1800,2400,'1st'],b2:[-2500,2200,'2nd'],b3:[200,-1200,'LAST']},m:[R(Rd,[200,-1200],[300,250]),TX(Rd,1300,-500,'Dive in?'),R(G,[200,-1200],[0,-3700]),TX(G,1100,-3500,'Hold')]},
 {say:"Dive in and lose the 50/50, and they're through with nobody back.",pos:{o1:[700,-800],ball:[600,-1500],b3:[200,500]},m:[PS(W,[600,-1500],[0,-5000]),TX(Rd,1500,-2700,'Open net')]},
 {say:"Hold instead: shadow back, stay goal-side and wait for teammates to rotate. Now any shot is in front of you.",pos:{b3:[0,-3700],o1:[400,-500],ball:[400,-1100],b1:[1500,500],b2:[-1800,-200]},m:[ZN(G,-800,-4300,800,-3100),R(B,[1500,500],[900,-2200]),R(B,[-1800,-200],[-1000,-2400])]}],
 tips:["Count teammates: if both are in front of the ball, you're last man.","As last man, only challenge a 50/50 you'll surely win, or a ball about to be shot.","Delaying is winning: every second lets teammates get back.","Call 'Defending...' so they know you're holding."],
 bad:["Last man challenging at midfield","Going for boost as last man"],
 quiz:{q:"Both teammates are ahead of the ball and an opponent is coming at you. You're last man. What do you do?",o:["Challenge as early as possible","Hold, shadow back and wait for help","Go for corner boost"],a:1,why:"If you miss, it's an open net. Holding buys time for your team to get back."}},
{id:'d5',cat:'def',lvl:2,title:'Defending the centre pass',sum:'One pressures the ball, one marks the middle, one holds the back post.',mode:3,steps:[
 {say:"Orange has the ball in your right corner with a teammate waiting in the middle. Three jobs: the 1st pressures the ball, the 2nd marks the middle, the 3rd holds back post.",pos:{ball:[3000,-3800],o1:[2700,-3200],o2:[0,-2200],o3:[-1500,-400],b1:[2300,-2600,'1st'],b2:[-600,-2800,'2nd'],b3:[-500,-4800,'3rd']},m:[R(Y,[2300,-2600],[2800,-3400]),TX(B,-1600,-2400,'Mark'),TX(G,-1400,-4400,'Back post')]},
 {say:"The centre pass comes, but the 2nd is already between the pass and the goal and gets there first.",pos:{ball:[100,-3200],o1:[2600,-3500],b1:[2200,-3450],o2:[100,-2600],b2:[-50,-3100],b3:[-500,-4700]},m:[PS(W,[3000,-3800],[100,-3200]),R(B,[-600,-2800],[-50,-3050])]},
 {say:"Cleared wide. Everyone had one job, and nobody chased the same ball.",pos:{ball:[-3000,0],b2:[-200,-3300]},m:[PS(W,[100,-3200],[-3000,0])]}],
 tips:["Watch the opponents without the ball. The pass target is the danger.","2nd defender: stay goal-side of the receiver.","Last man holds back post and doesn't chase.","Clear out wide once you win it."],
 bad:["Two defenders going to the corner","Ignoring the opponent waiting in the middle"],
 quiz:{q:"Orange has the ball in your corner and a player waiting in the middle. You're the 2nd defender. Your job?",o:["Join the 1st in the corner","Mark the middle, staying goal-side of the receiver","Go up for a counter"],a:1,why:"The centre pass is the real danger. Marking the receiver cuts it out."}},
{id:'d6',cat:'def',lvl:2,title:'Outnumbered: delay',sum:"2 attackers vs 1 defender? Don't dive. Buy time until your team is back.",mode:3,steps:[
 {say:"Two attackers, one defender. Diving in would leave the other attacker an open net. Back off and buy time while teammates race back.",pos:{ball:[-500,800],o1:[-400,1500],o2:[1500,1600],o3:[-1500,3500],b3:[0,-2400,'3rd'],b1:[-2500,3200,'1st'],b2:[2600,2600,'2nd']},m:[R(G,[0,-2400],[300,-3600]),R(B,[-2500,3200],[-3000,0],[-1600,-3000]),R(B,[2600,2600],[3100,0],[1600,-3000]),TX(G,1300,-3300,'Delay')]},
 {say:"Stay in front of the ball and between both attackers. A fake challenge (drive at them, then brake) can force a rushed touch.",pos:{ball:[0,-1400],o1:[-150,-900],o2:[1700,-1300],b3:[200,-3500],b1:[-3000,0],b2:[3100,200]},m:[ZN(G,-400,-4100,800,-2900),TX(G,1500,-4000,'Fake + wait')]},
 {say:"Your teammates are back. Now it's 3 v 2 in your favour: challenge with support behind you.",pos:{ball:[-300,-2600],o1:[-200,-2000],b3:[-150,-3300],b1:[-1600,-3200],b2:[1600,-3000],o2:[1800,-2200]},m:[R(G,[-150,-3300],[-280,-2850]),TX(G,-1300,-3900,'Now go')]}],
 tips:["Outnumbered? Delay, don't dive.","Position between the ball and the second attacker's passing lane.","Fake challenges make attackers rush.","Teammates: race back on the outside, then come in."],
 bad:["Diving in alone against two attackers","Teammates coasting back slowly"],
 quiz:{q:"It's 2 attackers against you alone. Teammates are racing back. What do you do?",o:["Challenge immediately","Delay: stay between ball and goal and buy time","Leave the net to get boost"],a:1,why:"Every second you delay, your teammates get closer. Then you can challenge with support."}},

 {say:"Your corner pads are your defensive fuel. The 3rd man lives off them. Don't leave them for Orange to steal.",pos:{},m:[ZN(B,-3440,-4480,-2700,-3720),ZN(B,2700,-4480,3440,-3720),TX(B,0,-3900,'Your corners')]},
 {say:"Their corner pads are what you take on offense. It fills you up and leaves them empty.",pos:{},m:[ZN(Rd,-3440,3720,-2700,4480),ZN(Rd,2700,3720,3440,4480),TX(Rd,0,3900,'Steal these')]}],

 quiz:{q:"How much boost does a small pad give?",o:["12","33","100"],a:0,why:"Small pads give 12 and come back after 4 seconds. Big pads give 100 and come back after 10."}},
{id:'b2',cat:'boost',lvl:2,title:'Steal their corner boost',sum:'When you\'re pinning them in, the 2nd man takes their boost. Starve them.',mode:3,steps:[
 {say:"Blue is pinning Orange in their half. The ball is on the left, so the 2nd man grabs their right corner boost.",pos:{ball:[-1800,3400],b1:[-1500,2800,'1st'],b2:[500,1900,'2nd'],b3:[300,-300,'3rd'],o1:[-1000,4000],o2:[200,4700],o3:[-2200,1600]},m:[R(B,[500,1900],[2000,3000],[3000,4000]),ZN(Rd,2700,3720,3440,4480),TX(B,1300,2700,'Steal')]},
 {say:"Now you're full, and the defender who wanted that pad has nothing. Rotate straight back into position as 2nd.",pos:{b2:[2950,4000,'100'],ball:[-1500,3700],o1:[-1300,4200],o2:[0,4800],o3:[-1500,2600]},m:[R(B,[2950,4000],[1000,2800]),TX(O,1300,4700,'Empty')]},
 {say:"Starving them makes their clears weak and their challenges slow. Do it when it's safe, never as last man.",pos:{b2:[900,2800,'2nd'],ball:[-1200,3900],b1:[-1100,3300]},m:[]}],
 tips:["Steal when your team has the ball pinned and you're 2nd.","Take the corner away from the ball, then come back fast.","An empty opponent can't challenge or clear well.","Never steal as last man."],
 bad:["Stealing as the last man back","Taking the corner the ball is about to roll into"],
 quiz:{q:"When is a good time to steal their corner boost?",o:["When you're last man back","When your team has them pinned and you're the 2nd","Right after kickoff, always"],a:1,why:"As 2nd during pressure you can take it and get back before the play changes."}},
{id:'b3',cat:'boost',lvl:1,title:"Don't fetch boost as last man",sum:'The small pads in front of your net refill you without leaving the goal.',mode:3,steps:[
 {say:"You're last back with 10 boost and Orange is coming. Driving out to the side big pad (red) opens the whole middle. The small pads in front of the net (green) keep you home.",pos:{ball:[1500,800],o1:[1200,1500],o2:[-1200,2000],o3:[0,4200],b1:[2000,2800,'1st'],b2:[-1500,2900,'2nd'],b3:[-500,-2400,'10 boost']},m:[R(Rd,[-500,-2400],[-3584,0]),TX(Rd,-2700,-1300,'Big pad?'),R(G,[-500,-2400],[-940,-3308],[0,-2816],[940,-3308],[200,-4300]),TX(G,1700,-3800,'Small pads')]},
 {say:"Go for the big pad and Orange walks in with an open shot.",pos:{b3:[-3584,0],ball:[600,-2000],o1:[600,-1400]},m:[PS(W,[600,-2000],[0,-5000]),TX(Rd,1500,-2900,'Open net')]},
 {say:"Three small pads in front of the net give +36 without leaving your post.",pos:{b3:[200,-4300,'46 boost'],ball:[800,-800],o1:[900,-300]},m:[TX(G,1400,-4000,'+36')]}],
 tips:["Pads in front of your goal: centre, both sides of the box.","Last man needs position more than boost.","Ask for help: 'Need boost!' tells a teammate to cover.","Grab corner boost only when a teammate is back."],
 bad:["Last man leaving for the side big pad","Panicking about low boost and leaving the net"],
 quiz:{q:"You're last man with 10 boost and the ball is coming. What do you do?",o:["Go get the side big pad","Grab the small pads near your net and stay in position","Drive up to challenge"],a:1,why:"Position first. The small pads near the net refill you without leaving the goal empty."}},

// ===== GAME SENSE =====
{id:'g1',cat:'sense',lvl:1,title:'Quick chat that helps',sum:'Tell your team what you\'re doing. It prevents double commits and empty nets.',mode:3,steps:[
 {say:"Callouts say what you're doing. 'I got it!' means you're going for the ball. 'Defending...' means you're staying back.",pos:{ball:[-1200,600],b1:[-1300,-500,'1st'],b2:[800,-1600,'2nd'],b3:[0,-4000,'3rd'],o1:[-900,1500],o2:[1200,1200],o3:[0,4300]},m:[TX(Y,-2400,-200,'I got it!'),TX(G,1300,-4000,'Defending...')]},
 {say:"'All yours' or 'Go for it!' gives a ball to a teammate. 'In position' says you're ready for a pass. 'Need boost!' explains why you're going for a pad.",pos:{ball:[-1000,2600],b1:[-1100,1900],b2:[500,600],b3:[100,-1700]},m:[TX(B,1500,800,'In position'),TX(G,1200,-1700,'Need boost!')]},
 {say:"Keep it positive. 'Nice shot!' after a miss and 'What a save!' (when you mean it) keep everyone playing well. Tilt loses more games than bad mechanics.",pos:{},m:[TX(W,0,0,'Nice shot!')]}],
 tips:["Only say 'I got it!' when you're really committing.","Trust your teammates' calls.","Bind quick chats so you can press them without looking.","Mute toxic chat. Never spam sarcastic 'What a save!'."],
 bad:["Spamming chat","Calling 'I got it!' and then not going"],
 quiz:{q:"A teammate calls 'I got it!' for a ball you were also going for. You:",o:["Go anyway","Back off and support","Spam 'I got it!' back"],a:1,why:"Trusting the call prevents a double commit. Support and be ready for what comes out."}},
{id:'g2',cat:'sense',lvl:2,title:'Protecting a lead',sum:'Up by one late? You don\'t need a goal; they do. Play safe and use the clock.',mode:3,steps:[
 {say:"You're up by one with 30 seconds left. You don't need another goal. You need them not to score.",pos:{ball:[800,2800],b1:[600,2100,'1st'],b2:[-400,200,'2nd'],b3:[0,-2600,'3rd'],o1:[500,3700],o2:[-1500,4200],o3:[1700,1500]},m:[TX(W,0,-800,'Up 1 · 0:30'),ZN(G,-1200,-3200,1200,-2000)]},
 {say:"Keep the ball in their corners and on the walls. Every second it's far from your goal is a second off their clock.",pos:{ball:[3300,3800],b1:[2800,3300],o1:[2400,4200]},m:[PS(W,[800,2800],[3300,3800]),TX(W,2300,2500,'Corner it')]},
 {say:"Keep two players back, take boost to deny them, and skip risky aerials. Remember: when time hits zero, the game ends when the ball touches the ground.",pos:{b2:[-300,-1200],b3:[0,-3600]},m:[TX(G,1200,-3600,'Two back')]}],
 tips:["Late lead: safety first, two players back.","Play the ball into their corners and onto the walls.","Take their boost when you can.","At 0:00 the game ends when the ball hits the ground; keep it away from your net."],
 bad:["Chasing a second goal with all three players","Risky passes across your own half"],
 quiz:{q:"You're up 1 with 30 seconds left. What's the priority?",o:["Score again fast","Keep the ball far from your net and keep two players back","Go for demos"],a:1,why:"They need a goal, you don't. Safe positioning and corner play run the clock out."}},
{id:'g3',cat:'sense',lvl:2,title:'Chasing a goal late',sum:'Down by one in the last minute? Push higher, keep the ball in, take smart risks.',mode:3,steps:[
 {say:"Down by one with a minute left: you need a goal, so take more risk. Push all three players up and keep the ball in their half.",pos:{ball:[-2000,3500],b1:[-1700,2900,'1st'],b2:[0,2200,'2nd'],b3:[400,800,'3rd'],o1:[-1300,4300],o2:[300,4800],o3:[1500,3000]},m:[ZN(Y,-3000,1500,3000,4500),TX(Y,0,1100,'All up')]},
 {say:"Your 3rd sits at midfield, not in net. A clear that gets past them is a risk worth taking now.",pos:{ball:[0,1200],b3:[200,600],b2:[-600,2000],b1:[-2000,3000]},m:[R(G,[200,600],[50,1000]),TX(G,1300,500,'Keep it in')]},
 {say:"Last seconds: get the ball toward their net and keep it in the air if you can. While the ball is up, the game isn't over.",pos:{ball:[300,3800],b2:[100,3000],b3:[0,1500],b1:[-1500,3600]},m:[PS(W,[0,1200],[300,3800]),TX(Y,0,4500,'Shoot')]}],
 tips:["Last minute and losing: push higher than normal.","3rd man at midfield to keep clears in.","Shoot more; any shot can go in.","Keep the ball off the ground in the final seconds."],
 bad:["Playing it safe when you need a goal","Giving up the last 10 seconds"],
 quiz:{q:"You're down 1 with 20 seconds left. What should your 3rd man do?",o:["Stay in your own net","Push up to midfield to keep the ball in","Go for boost in your corner"],a:1,why:"You need a goal. Keeping the ball in their half matters more than defending now."}},

// ===== 2s & 1s =====
{id:'m1',cat:'modes',lvl:1,title:'2s rotation: corner to back post',sum:'Challenge, rotate wide, teammate takes over the play.',mode:2,steps:[
 {say:"Blue's 1st challenges in the corner. The 2nd moves up to support but stays behind the ball.",pos:{ball:[-1500,2000],b1:[-1200,1300,'1st'],b2:[300,-800,'2nd'],o1:[-1300,2900],o2:[500,4300]},m:[R(Y,[-1200,1300],[-1450,1850]),R(B,[300,-800],[-300,400]),TX(B,1000,-300,'Support')]},
 {say:"The 1st rotates out wide, through the boost, toward the back post. The 2nd takes over the play.",pos:{ball:[-2800,3400],b1:[1800,500,'2nd'],b2:[-900,1500,'1st'],o1:[-2300,3300],o2:[300,4400]},m:[R(Y,[1800,500],[3584,0],[2400,-2600],[500,-4300]),TX(Y,2800,-1500,'Boost + back'),R(B,[-900,1500],[-2400,3000])]},
 {say:"The new 1st plays it off the back wall while the other is safely back. In 2s there's no 3rd man, so rotating back is even more important.",pos:{ball:[-2900,3700],b1:[500,-3300],b2:[-2500,3100],o1:[-1800,4200],o2:[1200,2400]},m:[PS(W,[-2900,3700],[-600,4900]),TX(W,-1500,4500,'Backboard')]}],
 tips:["In 2s, one player on the ball, one back. Always.","Rotate wide through boost, then to the back post.","Talk more than in 3s; there's no safety net.","Don't both chase."],
 bad:["Both players in the opponent's half with no one back","Rotating through the middle"],
 quiz:{q:"In 2s your teammate is challenging in the opponent's corner. Where are you?",o:["In the corner with them","Behind the ball, ready to support or defend","In your own goal line"],a:1,why:"In 2s you're both the support and the safety. Stay behind the ball, ready for both."}},
{id:'m2',cat:'modes',lvl:2,title:'2s backboard pass play',sum:'Corner touch off the back wall, teammate reads the bounce.',mode:2,steps:[
 {say:"Blue's 1st hits the ball up the back wall. The 2nd starts moving toward the middle to read the drop.",pos:{ball:[-3300,3700],b1:[-3200,3200,'1st'],b2:[200,1400,'2nd'],o1:[0,4900],o2:[2300,2200]},m:[PS(W,[-3300,3700],[-1800,4600],[-500,5050]),R(B,[200,1400],[0,2800],[-300,3700]),TX(B,1000,2600,'Read it')]},
 {say:"The ball drops off the wall into the middle, and the 2nd is underneath it.",pos:{ball:[-500,5000],b1:[-3100,3600],b2:[-200,3600],o1:[-700,4700],o2:[1700,3000]},m:[PS(W,[-500,5000],[-250,4300])]},
 {say:"Goal. The passer is already rotating back.",pos:{ball:[150,5500],b1:[-2600,3000],b2:[0,4300],o1:[-900,4500],o2:[1300,3600]},m:[TX(Y,0,3600,'Goal')]}],
 tips:["Hit high on the back wall.","Receiver waits around the penalty spot.","Passer rotates back right after the pass."],
 bad:["Passer staying in the corner to watch"],
 quiz:{q:"You just hit a backboard pass in 2s. What next?",o:["Wait in the corner","Rotate back toward your half","Drive at the goal too"],a:1,why:"With only two players, someone must be back. The passer rotates while the receiver shoots."}},
{id:'m3',cat:'modes',lvl:1,title:'1s shadow defense',sum:'Retreat between ball and goal, match speed, challenge on the bad touch.',mode:1,steps:[

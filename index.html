 {say:"Go for the big pad and Orange walks in with an open shot.",pos:{b3:[-3584,0],ball:[600,-2000],o1:[600,-1400]},m:[PS(W,[600,-2000],[0,-5000]),TX(Rd,1500,-2900,'Open net')]},
 {say:"Three small pads in front of the net give +36 without leaving your post.",pos:{b3:[200,-4300,'46 boost'],ball:[800,-800],o1:[900,-300]},m:[TX(G,1400,-4000,'+36')]}],
 tips:["Pads in front of your goal: centre, both sides of the box.","Last man needs position more than boost.","Ask for help: 'Need boost!' tells a teammate to cover.","Grab corner boost only when a teammate is back."],
 bad:["Last man leaving for the side big pad","Panicking about low boost and leaving the net"],
 quiz:{q:"You're last man with 10 boost and the ball is coming. What do you do?",o:["Go get the side big pad","Grab the small pads near your net and stay in position","Drive up to challenge"],a:1,why:"Position first. The small pads near the net refill you without leaving the goal empty."}},

// ===== GAME SENSE =====
{id:'g1',cat:'sense',lvl:1,title:'Quick chat that helps',sum:'Tell your team what you\'re doing. It prevents double commits and empty nets.',mode:3,steps:[
 {say:"Callouts say what you're doing. 'I got it!' means you're going for the ball. 'Defending...' means you're staying back.",pos:{ball:[-1200,600],b1:[-1300,-500,'1st'],b2:[800,-1600,'2nd'],b3:[0,-4000,'3rd'],o1:[-900,1500],o2:[1200,1200],o3:[0,4300]},m:[TX(Y,-2400,-200,'I got it!'),TX(G,1300,-4000,'Defending...')]},
 {say:"'All yours' or 'Go for it!' gives a ball to a teammate. 'In position' says you're ready for a pass. 'Need boost!' explains why you're going for a pad.",pos:{ball:[-1000,2600],b1:[-1100,1900],b2:[500,600],b3:[100,-1700]},m:[TX(B,1500,800,'In position'),TX(G,1200,-1700,'Need boost!')]},
 {say:"Keep it positive. 'Nice shot!' after a miss and 'What a save!' (when you mean it) keep everyone playing well. Tilt loses more games than bad mechanics.",pos:{},m:[TX(W,0,0,'Nice shot!')]}],
 tips:["Only say 'I got it!' when you're really committing.","Trust your teammates' calls.","Bind quick chats so you can press them without looking.","Mute toxic chat. Never spam sarcastic 'What a save!'."],
 bad:["Spamming chat","Calling 'I got it!' and then not going"],
 quiz:{q:"A teammate calls 'I got it!' for a ball you were also going for. You:",o:["Go anyway","Back off and support","Spam 'I got it!' back"],a:1,why:"Trusting the call prevents a double commit. Support and be ready for what comes out."}},
{id:'g2',cat:'sense',lvl:2,title:'Protecting a lead',sum:'Up by one late? You don\'t need a goal; they do. Play safe and use the clock.',mode:3,steps:[
 {say:"You're up by one with 30 seconds left. You don't need another goal. You need them not to score.",pos:{ball:[800,2800],b1:[600,2100,'1st'],b2:[-400,200,'2nd'],b3:[0,-2600,'3rd'],o1:[500,3700],o2:[-1500,4200],o3:[1700,1500]},m:[TX(W,0,-800,'Up 1 · 0:30'),ZN(G,-1200,-3200,1200,-2000)]},
 {say:"Keep the ball in their corners and on the walls. Every second it's far from your goal is a second off their clock.",pos:{ball:[3300,3800],b1:[2800,3300],o1:[2400,4200]},m:[PS(W,[800,2800],[3300,3800]),TX(W,2300,2500,'Corner it')]},
 {say:"Keep two players back, take boost to deny them, and skip risky aerials. Remember: when time hits zero, the game ends when the ball touches the ground.",pos:{b2:[-300,-1200],b3:[0,-3600]},m:[TX(G,1200,-3600,'Two back')]}],
 tips:["Late lead: safety first, two players back.","Play the ball into their corners and onto the walls.","Take their boost when you can.","At 0:00 the game ends when the ball hits the ground; keep it away from your net."],
 bad:["Chasing a second goal with all three players","Risky passes across your own half"],
 quiz:{q:"You're up 1 with 30 seconds left. What's the priority?",o:["Score again fast","Keep the ball far from your net and keep two players back","Go for demos"],a:1,why:"They need a goal, you don't. Safe positioning and corner play run the clock out."}},
{id:'g3',cat:'sense',lvl:2,title:'Chasing a goal late',sum:'Down by one in the last minute? Push higher, keep the ball in, take smart risks.',mode:3,steps:[
 {say:"Down by one with a minute left: you need a goal, so take more risk. Push all three players up and keep the ball in their half.",pos:{ball:[-2000,3500],b1:[-1700,2900,'1st'],b2:[0,2200,'2nd'],b3:[400,800,'3rd'],o1:[-1300,4300],o2:[300,4800],o3:[1500,3000]},m:[ZN(Y,-3000,1500,3000,4500),TX(Y,0,1100,'All up')]},
 {say:"Your 3rd sits at midfield, not in net. A clear that gets past them is a risk worth taking now.",pos:{ball:[0,1200],b3:[200,600],b2:[-600,2000],b1:[-2000,3000]},m:[R(G,[200,600],[50,1000]),TX(G,1300,500,'Keep it in')]},
 {say:"Last seconds: get the ball toward their net and keep it in the air if you can. While the ball is up, the game isn't over.",pos:{ball:[300,3800],b2:[100,3000],b3:[0,1500],b1:[-1500,3600]},m:[PS(W,[0,1200],[300,3800]),TX(Y,0,4500,'Shoot')]}],
 tips:["Last minute and losing: push higher than normal.","3rd man at midfield to keep clears in.","Shoot more; any shot can go in.","Keep the ball off the ground in the final seconds."],
 bad:["Playing it safe when you need a goal","Giving up the last 10 seconds"],
 quiz:{q:"You're down 1 with 20 seconds left. What should your 3rd man do?",o:["Stay in your own net","Push up to midfield to keep the ball in","Go for boost in your corner"],a:1,why:"You need a goal. Keeping the ball in their half matters more than defending now."}},

{id:'m2',cat:'modes',lvl:2,title:'2s backboard pass play',sum:'Corner touch off the back wall, teammate reads the bounce.',mode:2,steps:[

 {say:"Goal. The passer is already rotating back.",pos:{ball:[150,5500],b1:[-2600,3000],b2:[0,4300],o1:[-900,4500],o2:[1300,3600]},m:[TX(Y,0,3600,'Goal')]}],

// ===== more lessons: 3s, 2s, 1s =====
LESSONS.push(
// ----- 3s kickoffs -----
{id:'k9',cat:'kick',lvl:1,title:'Diagonal + off-centre + straight',sum:'Diagonal goes, off-centre cheats, straight takes boost on the far side.',gen:['diagL','offR','back'],
 tips:["Diagonal left is closest, so it goes.","Off-centre right is next closest, so it cheats and grabs the small pad in front of it on the way.","Straight is farthest: it takes the LEFT corner boost, the side away from the cheater, so both sides of the field are covered.","Nobody should say 'who goes?' in this spawn. Practise it until it's instant."],
 bad:["Straight spawn grabbing boost on the same side as the cheater","Off-centre going because the diagonal hesitated"],
 quiz:{q:"Spawns: diagonal left, off-centre right, straight. You're straight. Which boost do you take?",o:["Left corner","Right corner","None, stay in net"],a:0,why:"The cheater (off-centre right) covers the right side, so you take the left corner and both sides are covered."}},
{id:'k10',cat:'kick',lvl:2,title:'Diagonal with two off-centres',sum:'The diagonal goes. The off-centre on the far side cheats, the other one grabs boost.',gen:['diagR','offL','offR'],
 tips:["Diagonal right is closest, so it goes even though it's on the right.","Two off-centres are left. The one on the other side from the kicker (off-centre left) cheats, so the cheater and kicker cover both halves.","Off-centre right takes the right corner boost and comes back to net.","There's no straight spawn here, so the boost player must get back fast: nobody else is deep."],
 bad:["Both off-centres cheating","Boost player staying in the corner while Orange wins the kickoff"],
 quiz:{q:"Spawns: diagonal right, off-centre left, off-centre right. Who cheats?",o:["Off-centre left","Off-centre right","Nobody"],a:0,why:"The kicker is on the right, so the off-centre on the left side cheats. That way the left half isn't empty."}},
{id:'k11',cat:'kick',lvl:2,title:'Neutral kickoff: the ball goes up',sum:'Both kickers hit at the same time and the ball flies high. The cheater reads the drop.',mode:3,kick:KO3,steps:[
 {say:"Both kickers hit with the same power at the same time. The ball flies straight up and comes down near midfield. This is a neutral kickoff, and it happens a lot.",pos:CONTACT3,m:[ZN(W,-500,-500,500,500),TX(W,0,900,'Ball goes up')]},
 {say:"The kickers are still in the air and slow. The cheater, who is already on the ground with boost, reads where the ball will land and attacks the drop. The boost player stays deep.",pos:{ball:[400,-500],b1:[-500,-800],o1:[600,900],b2:[1000,-1300,'CHEAT'],o2:[-1100,1300],b3:[-2950,-4050]},m:[R(B,[1000,-1300],[520,-650]),ZN(Y,-200,-1100,1000,100),TX(Y,1900,-400,'Landing spot')]},
 {say:"The cheater wins the drop and pushes the ball into their half. The kicker lands, turns, and becomes 2nd. The boost player comes up as 3rd with 100 boost.",pos:{ball:[-1500,2500],b2:[-700,700,'1st'],b1:[0,-700,'2nd'],b3:[-1800,-2600,'3rd'],o1:[900,800],o2:[-1300,1900],o3:[2400,3800]},m:[PS(W,[400,-500],[-1500,2500]),R(G,[-2950,-4050],[-1800,-2600])]}],
 tips:["If the ball goes up, the cheater is usually first to it.","Kicker: land on your wheels and turn back. Don't jump again for a ball you can't reach.","Boost player: stay deep until you know who wins the drop.","If Orange's cheater is closer to the drop, your cheater shadows instead of diving."],
 bad:["Kicker jumping again and missing","Cheater driving under the ball and letting it land behind them"],
 quiz:{q:"The kickoff goes straight up. Who should usually play the drop?",o:["The kicker, again","The cheater","The boost player"],a:1,why:"The cheater is on the ground with boost and already close. The kickers are still in the air."}},

// ----- 3s rotation -----
{id:'r8',cat:'rot',lvl:2,title:'Rotation after a save',sum:"Don't chase your own save. The nearest teammate takes the next touch, the other drops into net.",mode:3,steps:[
 {say:"Orange shoots. Your last man is in net and makes the save.",pos:{ball:[-300,-4000],b3:[-100,-4800,'3rd'],b1:[-1800,-1500,'1st'],b2:[1500,-2200,'2nd'],o1:[-600,-2600],o2:[1200,-1200],o3:[200,800]},m:[PS(W,[-600,-2600],[-300,-4300]),TX(G,1000,-4700,'Save')]},
 {say:"The save goes to the corner. The saver is on the ground facing the wrong way. The teammate closest to the ball takes the next touch. The other drops straight into net.",pos:{ball:[-3200,-2600],b3:[-300,-4400],b1:[-2400,-1900],b2:[900,-3000],o1:[-1400,-2900],o2:[400,-1600]},m:[R(Y,[-1800,-1500],[-2400,-1900],[-3000,-2400]),R(B,[1500,-2200],[900,-3000],[200,-4600]),TX(B,1600,-3900,'Into net')]},
 {say:"The ball is cleared up the wall. The teammate is in net. The saver gets up, grabs boost out wide, and comes back as 2nd. No gap in net at any moment.",pos:{ball:[-3600,600],b1:[-3000,-2300,'1st'],b2:[200,-4600,'3rd'],b3:[2500,-3200,'2nd'],o1:[-2200,-1500],o2:[-500,-300]},m:[PS(W,[-3200,-2600],[-3600,600]),R(G,[-300,-4400],[2500,-3200],[3072,-4096])]}],
 tips:["A save is not the end of the play. The rebound is the danger.","Saver: get up and go wide. Don't chase the ball you just saved.","Teammates: the closest takes the rebound, the other goes to net.","Call it: 'I got it!' or 'Defending...'."],
 bad:["Saver chasing their own save while a teammate also goes","Both teammates going for the rebound and leaving the net empty"],
 quiz:{q:"Your teammate makes a save and the ball rolls to the corner. You're the closest. What do you do?",o:["Wait for the saver to clear it","Take the next touch and clear it wide","Go to the opponent's half for a pass"],a:1,why:"The saver is out of position. The closest player takes the rebound while the other covers the net."}},
{id:'r9',cat:'rot',lvl:1,title:'3rd man on offense: where to sit',sum:'When your team attacks, the 3rd man waits near midfield, not in their own net.',mode:3,steps:[
 {say:"Your team is attacking in their corner. The 3rd man sitting in their own net (red) is too far back. Every clear becomes a free ball for Orange.",pos:{ball:[2400,3800],b1:[2100,3200,'1st'],b2:[600,1900,'2nd'],b3:[0,-4500,'3rd'],o1:[1700,4500],o2:[-300,4800],o3:[-1200,1000]},m:[ZN(Rd,-900,-5000,900,-3800),TX(Rd,1800,-4400,'Too deep'),ZN(G,-1500,-700,1500,700),TX(G,0,1000,'Here')]},
 {say:"The 3rd moves up to midfield. When Orange clears into the middle, the 3rd is right there to stop it.",pos:{ball:[-500,700],b3:[-400,100],o2:[-200,4600],o1:[1500,3900]},m:[PS(W,[2400,3800],[-500,700]),R(G,[-400,100],[-480,550]),TX(G,900,0,'Cut it out')]},
 {say:"The ball goes back into their half and the attack keeps going. Rule: stay behind the ball and behind both teammates, and watch the orange player hanging around midfield.",pos:{ball:[800,3000],b3:[-200,800],o3:[-1500,600]},m:[PS(W,[-500,700],[800,3000]),LN(Rd,[-1500,600],[-200,800]),TX(Rd,-2400,1200,'Watch them')]}],
 tips:["Offense: the 3rd sits around midfield, behind both teammates.","If an orange player hangs back at midfield, stay a bit deeper so they can't get behind you.","If all three of them defend, you can push up a little further.","Never be ahead of the ball as 3rd man."],
 bad:["3rd man parked in own net during an attack","3rd man joining the attack in the corner"],
 quiz:{q:"Your two teammates are attacking in Orange's corner. You're 3rd. Where?",o:["In your own net","Around midfield, behind both teammates","In Orange's corner too"],a:1,why:"From midfield you stop clears and keep the pressure, and you're still the last player back."}},
{id:'r10',cat:'rot',lvl:2,title:'Fill in when a teammate is beaten',sum:'The moment your 1st man gets beaten, the next player becomes 1st. No waiting.',mode:3,steps:[
 {say:"Your 1st man challenges and gets beaten. The orange attacker is through.",pos:{ball:[-600,-300],o1:[-500,300],b1:[-400,-900,'1st'],b2:[700,-1800,'2nd'],b3:[0,-4300,'3rd'],o2:[1500,1000],o3:[-200,2800]},m:[R(Rd,[-400,-900],[-500,-350]),TX(Rd,-1700,-700,'Beaten')]},
 {say:"Instantly, the 2nd becomes the new 1st and shadows the ball. The 3rd stays home. The beaten player is facing the wrong way, so they're out of the play for now.",pos:{ball:[-300,-1700],o1:[-400,-1200],b1:[-700,600,''],b2:[200,-2700,'1st'],b3:[0,-4500,'2nd']},m:[R(B,[700,-1800],[200,-2700]),TX(B,1300,-2700,'New 1st')]},
 {say:"The beaten player turns out wide, grabs boost and comes back as the new 3rd. The jobs moved backwards, but the team never had a hole.",pos:{b1:[-3300,-2000,'3rd'],ball:[-400,-2500],o1:[-500,-2000],b2:[-200,-3100,'1st'],b3:[200,-4600,'2nd']},m:[R(Y,[-700,600],[-3584,0],[-3300,-2000])]}],
 tips:["When a teammate is beaten, don't wait for them. You're 1st now.","Beaten player: turn wide, grab boost, come back as 3rd.","Don't panic-dive. Shadow first, challenge on the bad touch.","Say 'Defending...' when you take over as last man."],
 bad:["Waiting for the beaten teammate to recover","Beaten player turning back through the middle"],
 quiz:{q:"Your 1st man just got dribbled past. You're 2nd. What now?",o:["Wait for them to recover","You are the new 1st: shadow the ball","Go for boost"],a:1,why:"The jobs move instantly. You take over the ball while the beaten player recovers as 3rd."}},
{id:'r11',cat:'rot',lvl:2,title:'Spacing: one player per lane',sum:'Three cars on one ball means open space everywhere else. Spread out.',mode:3,steps:[
 {say:"Three blue cars around one ball. That's ball chasing.",pos:{ball:[-1800,1500],b1:[-1700,900,''],b2:[-1100,600,''],b3:[-2200,400,''],o1:[-1600,2300],o2:[500,3600],o3:[1500,-200]},m:[ZN(Rd,-2800,0,-500,1700),TX(Rd,-1500,-400,'Ball chasing')]},
 {say:"One touch over the crowd, and Orange's spare player has a free run at your empty net.",pos:{ball:[1800,-1800],o3:[1600,-1100]},m:[PS(W,[-1800,1500],[1800,-1800]),R(O,[1600,-1100],[600,-4200]),TX(Rd,2600,-3000,'Open net')]},
 {say:"Now properly: 1st on the ball, 2nd in the middle lane, 3rd deep on the other side. Each lane is covered.",pos:{ball:[-1800,1500],o3:[1500,-200],b1:[-1700,900,'1st'],b2:[0,-200,'2nd'],b3:[900,-2500,'3rd']},m:[LN(W,[-1700,900],[0,-200],[900,-2500],[-1700,900]),TX(W,1600,-1200,'Spread')]}],
 tips:["Each player covers a different lane: ball side, middle, far side.","If you're the third car near the ball, leave.","A spread triangle is hard to beat with one touch.","Watch the spare orange player: someone must always be between them and your net."],
 bad:["Everyone near the ball","Two players in the same lane"],
 quiz:{q:"You see both teammates already near the ball. What do you do?",o:["Join them, three is stronger","Stay back in a different lane","Go demo someone"],a:1,why:"Two near the ball is already enough. The third covers the space and the counter."}},

// ----- 3s attack -----
{id:'o6',cat:'off',lvl:2,title:'Give and go (1-2 pass)',sum:'Pass when the defender commits, keep running, get it back in front of goal.',mode:3,steps:[
 {say:"You carry the ball up the right side. A defender comes to challenge you.",pos:{ball:[1800,1200],b1:[1700,700,'1st'],b2:[-300,800,'2nd'],b3:[0,-1800,'3rd'],o1:[1500,2400],o2:[-200,4600],o3:[-1500,2500]},m:[R(O,[1500,2400],[1700,1500])]},
 {say:"Right before they reach you, pass into the middle to your 2nd. The challenger is now out of the play.",pos:{ball:[-200,2000],b1:[1900,1500],o1:[1800,1700],b2:[-300,1500]},m:[PS(W,[1800,1200],[-200,2000]),R(Y,[1900,1500],[1100,3300]),TX(Y,2500,2700,'Keep running')]},
 {say:"Keep running toward goal after you pass. Your teammate gives it back into the space in front of the net.",pos:{ball:[800,3800],b1:[1000,3300],b2:[-200,2000],o2:[-400,4700],o3:[-900,2600]},m:[PS(W,[-200,2000],[800,3800])]},
 {say:"Shoot first time. Two touches beat their defender.",pos:{ball:[300,5500],b1:[700,4300],o2:[-600,4900]},m:[TX(Y,1600,4700,'Goal')]}],
 tips:["Pass when the defender commits to you, not before.","After the pass, keep driving toward the goal. Don't stop to watch.","The return pass goes into space in front of the receiver.","Works best on the ground: easy to control."],
 bad:["Passing too early, before the defender commits","Stopping after the pass"],
 quiz:{q:"You pass to your teammate in the middle. What do you do next?",o:["Stop and watch","Keep running toward goal for the return","Rotate straight back"],a:1,why:"Your run forces the defence to choose. If nobody follows you, the return pass puts you in front of an open net."}},
{id:'o7',cat:'off',lvl:1,title:'Shoot to the far post',sum:'From the side, the goalie guards the near post. Aim low and far.',mode:3,steps:[
 {say:"You're shooting from the right side. The goalie is on the near post, so the far post is open.",pos:{ball:[1500,3300],b1:[1600,2700,'1st'],b2:[-200,1700,'2nd'],b3:[0,-500,'3rd'],o1:[-1500,2600],o2:[500,4900],o3:[2200,1000]},m:[ZN(G,-893,4800,0,5120),TX(G,-1700,4500,'Far post')]},
 {say:"A low shot to the far post. Hard to reach, and if saved, it bounces out toward your 2nd, who is already driving in.",pos:{ball:[-700,5400],b1:[1400,3200],b2:[-400,3300],o2:[200,4900]},m:[PS(W,[1500,3300],[-700,5400]),R(B,[-200,1700],[-400,3300])]}],
 tips:["From the side, aim for the far post.","Low shots are harder to save than high ones for most goalies.","A rebound off the far post comes back into the middle: perfect for your 2nd man.","Power isn't everything; placement scores."],
 bad:["Shooting straight at the goalie","Blasting from the corner into the near post"],
 quiz:{q:"You shoot from the right wing. Where do you aim?",o:["The near post","The far post","Straight at the goalie"],a:1,why:"The goalie covers the near post. The far post is open, and rebounds land in the middle for your teammate."}},
{id:'o8',cat:'off',lvl:2,title:'Keep the pressure: stop their clear',sum:'A clear that gets stopped means another 10 seconds of attack.',mode:3,steps:[
 {say:"You've been attacking. Their goalie is about to clear. A good team doesn't let the ball leave their half.",pos:{ball:[1200,4200],o2:[1100,4800],b1:[1600,3500,'1st'],b2:[-500,2300,'2nd'],b3:[300,300,'3rd'],o1:[-1800,3500],o3:[-500,-600]},m:[PS(Rd,[1200,4200],[-700,1800]),TX(Rd,-1800,2100,'Clear')]},
 {say:"The 2nd man read it and meets the clear. The 3rd is behind in case they miss.",pos:{ball:[-600,1900],b2:[-650,2200],b3:[0,700],b1:[1700,3800]},m:[R(B,[-500,2300],[-620,2050]),R(G,[300,300],[0,700])]},
 {say:"The ball goes back in, toward their corner. The old 1st rotates out, the 2nd becomes 1st. Tired defenders make mistakes.",pos:{ball:[-2400,3900],b2:[-1000,2700,'1st'],b1:[2900,1600,'3rd'],b3:[-200,1500,'2nd']},m:[PS(W,[-600,1900],[-2400,3900]),R(Y,[1700,3800],[2900,1600],[3584,0])]}],
 tips:["2nd man: guess where the clear goes and be there first.","3rd man: sit behind the 2nd, ready if they miss.","Stopping clears is how you get long pressure.","Don't dive at a clear you can't reach; let it come to you."],
 bad:["2nd man too close to the 1st, so the clear goes past both","3rd man too deep to stop anything"],
 quiz:{q:"Their goalie is clearing. You're 2nd man. Your job?",o:["Rotate back to net","Read the clear and meet it","Go for their corner boost"],a:1,why:"Stopping the clear keeps the attack alive. The 3rd covers if you miss."}},
{id:'o9',cat:'off',lvl:2,title:'Switch the play',sum:"They're crowded on one side? Pass to the empty side and shoot before they shift.",mode:3,steps:[
 {say:"All three orange players are on the left. The right side is empty.",pos:{ball:[-2600,3200],b1:[-2300,2600,'1st'],o1:[-2400,3800],o2:[-1300,4500],o3:[-1500,2000],b2:[1600,2000,'2nd'],b3:[0,-500,'3rd']},m:[ZN(Rd,-3300,1700,-900,4700),TX(Rd,-2100,1300,'Crowded'),ZN(G,600,2200,3000,4300),TX(G,1800,4600,'Open')]},
 {say:"Pass across to the open side. Your 2nd should be waiting there, not in the crowd.",pos:{ball:[1700,3500],b2:[1500,2900]},m:[PS(W,[-2600,3200],[1700,3500])]},
 {say:"The defence has to cross the whole goal. Shoot before they get there.",pos:{ball:[500,5500],b2:[1300,3700],o2:[-500,4800],o1:[-1700,3900]},m:[PS(W,[1700,3500],[500,5500]),TX(Y,1600,4800,'Goal')]}],
 tips:["Look for the empty side when the defence crowds the ball.","2nd man: don't go to the crowd. Wait on the open side.","Shoot quickly after the switch.","Keep the pass on the ground or low; it's easier to control."],
 bad:["2nd man joining the crowd","Taking too long after the switch"],
 quiz:{q:"All three defenders are on the left side. Your 2nd man should be...",o:["On the left too","On the open right side","In your own net"],a:1,why:"The open side is where the goal comes from. One pass across and the defence can't recover in time."}},

// ----- 3s defense -----
{id:'d7',cat:'def',lvl:1,title:'All back on a counter',sum:'Caught high up? Everyone sprints back along the sides while the 3rd slows them down.',mode:3,steps:[
 {say:"Orange breaks out with the ball. Your 1st and 2nd are caught high up the field.",pos:{ball:[500,1000],o1:[600,1500],b1:[-1500,3200,'1st'],b2:[1800,2800,'2nd'],b3:[0,-200,'3rd'],o2:[-800,3600],o3:[1500,4600]},m:[R(O,[600,1500],[400,-2500]),TX(Rd,1700,500,'Counter!')]},
 {say:"Everyone sprints back, but along the sides, not through the middle. The 3rd shadows and slows the attacker down.",pos:{ball:[400,-1600],o1:[400,-1100],b3:[300,-2400,''],b1:[-3200,-300,''],b2:[3200,-500,'']},m:[R(B,[-3200,-300],[-1500,-3900]),R(B,[3200,-500],[1200,-4100]),ZN(G,-500,-3000,1100,-1900),TX(G,1800,-2300,'Shadow')]},
 {say:"By the time the attacker reaches your box, all three are back. Now the 3rd can challenge, because two teammates cover behind.",pos:{ball:[300,-3200],o1:[300,-2700],b3:[300,-3700,'1st'],b1:[-1300,-4300,'2nd'],b2:[1100,-4600,'3rd']},m:[R(Y,[300,-3700],[300,-3350])]}],
 tips:["Counter: everyone back, along the sides.","3rd man: shadow and delay, don't dive.","Use small pads on the way back.","When all three are back, you can challenge."],
 bad:["Driving back through the middle and bumping teammates","3rd diving alone before help arrives"],
 quiz:{q:"Orange counters. You're the 3rd man and alone. What do you do?",o:["Challenge right away","Shadow and delay until your teammates are back","Go for boost"],a:1,why:"Buy time. Once your teammates arrive, you can challenge with cover."}},
{id:'d8',cat:'def',lvl:3,title:'Defending the backboard',sum:'Ball up your back wall? The defender in front of the net clears it off the wall.',mode:3,steps:[
 {say:"Orange plays the ball up your back wall. It will drop right in front of your goal.",pos:{ball:[-3300,-3700],o1:[-3100,-3200],o2:[200,-1400],o3:[800,1500],b1:[-1500,-4500,''],b2:[1200,-4700,''],b3:[400,-2500,'']},m:[PS(W,[-3300,-3700],[-1500,-4900],[-300,-5050]),TX(Rd,-1800,-3500,'Backboard')]},
 {say:"The defender closest to the net reads it and goes up the wall to clear it before it drops. The other covers the drop in front of goal.",pos:{ball:[-400,-5050],b2:[-300,-4600,'1st'],o2:[-200,-3300],b1:[-700,-3800,'2nd']},m:[R(Y,[1200,-4700],[-300,-4600]),TX(Y,1200,-4000,'Clear off the wall')]},
 {say:"Cleared out wide. If the clear had missed, the teammate in front of the net was there for the drop.",pos:{ball:[-3600,-1500],b3:[800,-3400,'3rd']},m:[PS(W,[-400,-5050],[-3600,-1500])]}],
 tips:["Watch for orange players in your corner: backboard passes are coming.","Closest to the net: clear it off the wall.","Second defender: cover the drop in front.","Clear it to the side, not back into the middle."],
 bad:["Everyone watching the ball land","Clearing it into the middle"],
 quiz:{q:"Orange hits the ball up your back wall. You're closest to the net. What do you do?",o:["Wait for it to drop","Go up and clear it off the wall","Go to the corner"],a:1,why:"If it drops in front of the net, an attacker is waiting. Clearing it off the wall stops the pass."}},
{id:'d9',cat:'def',lvl:1,title:'Corner defense: one goes in',sum:'Ball in your corner: only one defender goes in. The others guard the middle and net.',mode:3,steps:[
 {say:"The ball is in your corner with an attacker. Only ONE player goes in there. The others stay in front of the net.",pos:{ball:[-3300,-4200],o1:[-2800,-3800],o2:[-500,-2000],o3:[700,600],b1:[-2200,-2500,'1st'],b2:[400,-4600,'2nd'],b3:[1400,-1800,'3rd']},m:[ZN(Rd,-4050,-5050,-2400,-3300),TX(Rd,-3100,-2900,'One only'),R(Y,[-2200,-2500],[-3000,-3900])]},
 {say:"Orange tries the centre pass. Your other two are already covering the middle and the net, so the pass dies.",pos:{ball:[-300,-2900],b3:[-200,-2400],b2:[300,-4500],b1:[-3000,-3900],o1:[-2900,-4300]},m:[PS(W,[-3300,-4200],[-300,-2900]),R(G,[1400,-1800],[-200,-2400])]},
 {say:"Cleared out wide. The attack is over.",pos:{ball:[2400,1000],b3:[-100,-2100,'1st']},m:[PS(W,[-300,-2900],[2400,1000])]}],
 tips:["Corner: one goes in, the others don't.","2nd defender: cover the pass to the middle.","3rd: in net, at the back post.","The corner defender doesn't have to win; just stop a clean pass."],
 bad:["Two defenders in the corner","Nobody covering the centre pass"],
 quiz:{q:"The ball is in your corner and a teammate is already there. What do you do?",o:["Go in and help","Cover the middle or the net","Go for boost"],a:1,why:"Two in the corner leaves the middle open. One pass and it's a goal."}},

// ----- 3s boost + game sense -----
{id:'b4',cat:'boost',lvl:1,title:"Low on boost? Say it",sum:"No boost means you can't challenge. Call 'Need boost!' and let the team cover.",mode:3,steps:[
 {say:"You're 2nd man with no boost. Diving into a 50/50 now means you'll lose it.",pos:{ball:[-1500,2500],b1:[-1300,1900,'1st'],b2:[600,500,'0 boost'],b3:[0,-2400,'3rd'],o1:[-1300,3400],o2:[400,4600],o3:[1600,1400]},m:[]},
 {say:"Call 'Need boost!' and grab the pads near you. Your 3rd steps up to cover your spot for those few seconds.",pos:{b2:[3584,0,'100'],b3:[-200,-200,'2nd']},m:[R(B,[600,500],[1024,0],[2048,-1036],[3584,0]),R(G,[0,-2400],[-200,-200]),TX(G,-1300,-1300,'Covers')]},
 {say:"Full again, you come back in as 3rd. The quick chat let the team adjust instead of guessing.",pos:{b2:[1200,-2800,'3rd']},m:[R(B,[3584,0],[1200,-2800])]}],
 tips:["0 boost = you can't challenge, can't save high balls.","Say 'Need boost!' so a teammate can cover.","Take pads close to you; the side big pad is often on your way.","When a teammate calls it, step up and cover."],
 bad:["Challenging with no boost","Going for boost without telling anyone"],
 quiz:{q:"You're 2nd man with 0 boost. What do you do?",o:["Challenge anyway","Call 'Need boost!' and grab nearby pads","Drive into the corner"],a:1,why:"Your team can cover you if they know. Then you come back full and useful."}},
{id:'g4',cat:'sense',lvl:2,title:'Demos: when they help',sum:'Demo the last defender to open the net. Never demo as the last man.',mode:3,steps:[
 {say:"Orange's last defender is driving back to their net. Your 2nd man has full boost and a clean line at them.",pos:{ball:[-1500,3200],b1:[-1300,2600,'1st'],b2:[1500,1800,'2nd'],b3:[0,-200,'3rd'],o1:[-1800,3900],o2:[1800,3100],o3:[-300,1500]},m:[R(Y,[1500,1800],[1800,3000]),TX(Y,2800,2300,'Demo')]},
 {say:"Demo! For 3 seconds they have one fewer defender. Your 1st centres the ball into the open net.",pos:{o2:[1800,3100,'DEMO'],b2:[1900,3300],ball:[300,4300]},m:[PS(W,[-1500,3200],[300,4300]),TX(Rd,2900,3600,'Out 3s')]},
 {say:"Goal. But remember: only the 1st or 2nd man goes for demos. If your last man misses a demo, it's a free goal for them.",pos:{ball:[200,5500]},m:[TX(G,0,-900,'3rd stays')]}],
 tips:["Demo the player rotating back to their net: it opens the goal.","Only 1st or 2nd man goes for demos.","A demo needs supersonic speed: full boost and a straight line.","Don't chase demos across the field."],
 bad:["Last man going for a demo","Chasing a demo instead of playing the ball"],
 quiz:{q:"Which player should go for demos?",o:["The last man","The 1st or 2nd man, when it opens the net","Anyone, anytime"],a:1,why:"A missed demo by the last man leaves your net empty. The 1st and 2nd have cover behind them."}},
{id:'g5',cat:'sense',lvl:2,title:'Count the opponents before you go',sum:'Where are all three orange cars? The one you forget is the one who scores.',mode:3,steps:[
 {say:"Before you challenge, count the orange cars. Where are all three?",pos:{ball:[0,1500],b1:[-400,500,'1st'],b2:[1200,-500,'2nd'],b3:[0,-2600,'3rd'],o1:[200,2300],o2:[1500,2700],o3:[-1800,1000]},m:[TX(W,0,3500,'1, 2, 3?')]},
 {say:"One is hanging out wide, waiting for a pass. If your 1st challenges and loses, the ball goes there and they're through.",pos:{},m:[ZN(Rd,-2700,400,-1000,1700),TX(Rd,-1800,2000,'Lurking'),PS(Rd,[0,1500],[-1800,1000])]},
 {say:"Your 2nd shifts to cover that lane. Now the 1st can challenge, because the dangerous pass is covered.",pos:{b2:[-1100,-100]},m:[R(B,[1200,-500],[-1100,-100]),R(Y,[-400,500],[-80,1250]),TX(B,-1500,-1300,'Covered')]}],
 tips:["Count all three opponents before you commit.","The lurking player at midfield is the most dangerous one.","2nd man: cover the lane to the lurker.","Ball-cam off for a moment is how pros count."],
 bad:["Only watching the ball","Forgetting the player hanging at midfield"],
 quiz:{q:"An orange player is waiting alone near midfield. You're 2nd man. What do you do?",o:["Ignore them, watch the ball","Cover the passing lane to them","Go demo them"],a:1,why:"If the 1st loses the challenge, that's where the ball goes. Covering the lane takes away their best option."}},

// ----- 3s teamwork -----
{id:'t1',cat:'team',lvl:1,title:'After a goal against: lift them up',sum:'What you type in the next 5 seconds decides the next 5 minutes.',mode:3,steps:[
 {say:"Your teammate misses an easy save and Orange scores. Everyone feels bad, especially the one who missed.",pos:{ball:[200,-5500],o1:[300,-4200],b3:[-900,-4700,'missed'],b1:[-1600,-1500,''],b2:[1700,-1200,''],o2:[-1000,-1000],o3:[1500,1500]},m:[TX(Rd,0,-3300,'Goal against')]},
 {say:"Say 'No problem.', 'Nice try!' or 'We got this!' and move on. Never 'Wow!' or a sarcastic 'What a save!'. A tilted teammate plays worse; a calm one plays better.",pos:{},m:[TX(G,-1600,-300,'"No problem!"'),TX(Rd,1700,-2700,'Not "Wow!"')]},
 {say:"Next kickoff: talk early and keep it simple. 'I got it', 'Defending...', 'Nice!'. Small wins bring the confidence back.",pos:{ball:[0,0],b1:[-2048,-2560,'GO'],b2:[2048,-2560,'CHEAT'],b3:[0,-4608,'BOOST'],o1:[2048,2560],o2:[-2048,2560],o3:[0,4608]},m:[TX(Y,0,-1500,'Reset. Next play.')]}],
 tips:["First message after a goal against: positive or nothing.","Praise specific things: 'Great rotation!', 'Nice save!'.","Say 'My bad' fast when it's your fault. It makes everyone honest.","If you're tilted, type nothing. Mute if you need to."],
 bad:["'Wow!' or sarcastic 'What a save!'","Blaming in the middle of the game","Going silent and giving up"],
 quiz:{q:"Your teammate misses a save and they score. What do you say?",o:["'Wow...'","'No problem, we got this!'","'What a save!' (sarcastic)"],a:1,why:"A calm teammate plays better. Negative chat makes the next mistake more likely."}},
{id:'t2',cat:'team',lvl:1,title:'The team plan before the match',sum:'30 seconds of talk before kickoff saves a lot of confusion in the game.',mode:3,kick:KO3,steps:[
 {say:"Before the first kickoff, agree on the kickoff rule: closest goes, next closest cheats, farthest grabs boost. Left goes on a tie.",pos:{b1:[-2048,-2560,'GO'],b2:[2048,-2560,'CHEAT'],b3:[0,-4608,'BOOST']},m:[TX(Y,0,-1300,'Same rule for all')]},
 {say:"Agree how you'll talk: 'I got it!' means I'm going. 'Defending...' means I'm last. 'Need boost!' means cover me. Then everyone trusts the calls.",pos:{},m:[TX(B,2400,-1700,'"I got it!"'),TX(G,0,-3600,'"Defending..."')]},
 {say:"Agree on one focus for the game, e.g. 'We clear to the sides' or 'We follow up shots'. One thing everyone remembers is better than ten things nobody does.",pos:{},m:[TX(W,0,1800,'One focus')]}],
 tips:["Agree on the kickoff rule.","Agree on 3 quick chats: 'I got it!', 'Defending...', 'Need boost!'.","Pick one focus for the game.","After the game: one good thing, one thing to fix. That's all."],
 bad:["Going into a match with no plan","Arguing about the plan in the middle of the game"],
 quiz:{q:"What's the best 'team focus' before a match?",o:["Ten things to remember","One simple focus everyone remembers","No plan, just play"],a:1,why:"One clear focus is easy to follow under pressure. Ten things get forgotten."}},

// ===== 2s =====
{id:'w1',cat:'kick',lvl:1,title:'2s kickoff: go and cheat',sum:'Diagonal goes. The other player cheats only a little and stays ready to defend.',gen:['diagL','offR'],
 tips:["Closest goes: diagonal beats off-centre.","The other player cheats only a little. In 2s nobody else is back, so don't go too far forward.","If Orange wins the kickoff, the cheater is the last defender: turn back straight away.","If we win it, the cheater presses and the kicker drops back."],
 bad:["Cheating so far that a lost kickoff is an open net","Both going for the ball"],
 quiz:{q:"In 2s, how far should the cheater go?",o:["Right up beside the ball","Only a little, ready to defend","Not at all, stay in net"],a:1,why:"In 2s the cheater is also the last defender. A small cheat lets you collect a good kickoff and still defend a bad one."}},
{id:'w2',cat:'kick',lvl:1,title:'2s kickoff: two off-centres',sum:'Same type of spawn? Left goes. The right one cheats a little.',gen:['offL','offR'],
 tips:["Two off-centres are the same distance. Left goes.","The off-centre kicker drives over the centre small pad, then turns into the ball.","The right player takes the small pad on its side and waits a little behind.","Go instantly. Hesitating gives Orange a free hit."],
 bad:["Both off-centres hesitating","Right player cheating too far"],
 quiz:{q:"2s spawns: off-centre left and off-centre right. Who goes?",o:["Off-centre left","Off-centre right","Whoever is faster"],a:0,why:"Same distance, so left goes. A fixed rule means no hesitation."}},
{id:'w3',cat:'rot',lvl:1,title:'2s: the two jobs',sum:'One pressures, one covers. In 2s the support player is also the last man.',mode:2,steps:[
 {say:"2s has two jobs. The 1st pressures the ball. The 2nd stays behind it and covers everything: support AND last man at the same time.",pos:{ball:[-1200,2000],b1:[-1000,1300,'1st'],b2:[300,-1000,'2nd'],o1:[-1100,2900],o2:[800,4300]},m:[LN(W,[-1000,1300],[300,-1000]),TX(Y,-2300,1000,'Pressure'),TX(B,1500,-1000,'Cover')]},
 {say:"The ball pops loose toward midfield. The 2nd can take it, but only because the 1st is already turning back to cover.",pos:{ball:[200,900],b2:[250,500],b1:[-1600,1600],o1:[-500,2300]},m:[R(B,[300,-1000],[250,500]),R(Y,[-1000,1300],[-1600,1600],[-2800,-700]),TX(Y,-3000,500,'Turns back')]},
 {say:"Jobs swap. In 2s you swap all the time, so always know whether you're 1st or 2nd.",pos:{ball:[500,2900],b2:[400,2200,'1st'],b1:[-1800,-1500,'2nd']},m:[PS(W,[200,900],[500,2900])]}],
 tips:["One on the ball, one behind it. Always.","The 2nd is support and last man at once: stay behind the ball.","When the 2nd takes the ball, the 1st turns back at once.","Talk on every swap."],
 bad:["Both players ahead of the ball","2nd man too close to the 1st"],
 quiz:{q:"In 2s, your teammate is on the ball. Where are you?",o:["Right beside them","Behind the ball, ready to support or defend","In their corner"],a:1,why:"You're the only cover. Stay behind the ball so you can support and defend."}},
{id:'w4',cat:'def',lvl:1,title:"2s defense: don't both go",sum:'One shadows the ball, one guards the net and the pass.',mode:2,steps:[
 {say:"Orange attacks with both players. Your 1st shadows the ball, your 2nd guards the net and the pass.",pos:{ball:[-1500,-1800],o1:[-1300,-1200],o2:[900,-500],b1:[-1300,-2700,'1st'],b2:[400,-4400,'2nd']},m:[ZN(G,-2000,-3300,-700,-2300),TX(G,-2900,-3000,'Shadow'),TX(B,1400,-4600,'Net + pass')]},
 {say:"They pass across. Because the 2nd stayed home, they're in position to block the shot. The 1st turns back to help.",pos:{ball:[800,-2300],o2:[900,-1700],b2:[700,-3800],b1:[-1100,-3000]},m:[PS(W,[-1500,-1800],[800,-2300]),R(B,[400,-4400],[700,-3800])]},
 {say:"Cleared to the side wall. If both had dived at the first ball, this was an open net.",pos:{ball:[3500,0],b2:[900,-2600]},m:[PS(W,[800,-2300],[3500,0])]}],
 tips:["One shadows, one guards. Never both dive.","2nd defender: stay between the pass and the net.","Clear to the side walls.","Talk: 'I got it!' / 'Defending...'."],
 bad:["Both defenders diving at the ball","Clearing into the middle"],
 quiz:{q:"In 2s defense, your teammate shadows the ball. You?",o:["Also challenge","Guard the net and the pass","Go for boost"],a:1,why:"If you both go, one pass is an open net. You cover the second option."}},
{id:'w5',cat:'boost',lvl:2,title:'2s: when your teammate gets boost',sum:"Teammate going for boost? For a few seconds it's 1 vs 2. Play safe.",mode:2,steps:[
 {say:"Your teammate goes for boost. For a few seconds it's really 1 vs 2, so your job changes.",pos:{ball:[0,1500],b1:[-600,800,'1st'],b2:[1800,-500,'0 boost'],o1:[200,2300],o2:[-1000,4000]},m:[R(B,[1800,-500],[3072,-4096]),TX(B,2900,-2200,'Boost')]},
 {say:"Don't challenge. Back off, shadow and delay until they're back.",pos:{b1:[-200,-1500,'last man'],ball:[300,600],o1:[300,1100],b2:[3072,-4096,'100']},m:[R(Y,[-600,800],[-200,-1500]),TX(Y,1000,-1900,'Delay')]},
 {say:"Teammate's back with 100 boost. Now you can challenge, and they cover.",pos:{b2:[1000,-3000,'2nd'],b1:[100,-700,'1st'],ball:[300,-100],o1:[300,350]},m:[R(Y,[-200,-1500],[150,-500])]}],
 tips:["Teammate getting boost = you play safe.","Shadow and delay. Don't dive.","Say 'Need boost!' when you go, so your teammate knows.","Take boost on your rotation path to be quick."],
 bad:["Challenging while your teammate is in the corner","Both going for boost at the same time"],
 quiz:{q:"In 2s, your teammate goes for corner boost. What do you do?",o:["Challenge hard","Play safe and delay until they're back","Go for boost too"],a:1,why:"For a few seconds you're alone. Delaying stops them from scoring until they're back."}},
{id:'w6',cat:'off',lvl:2,title:'2s attack: centre and follow',sum:'The 1st centres, the 2nd drives in, the passer becomes the defender.',mode:2,steps:[
 {say:"In 2s, the 2nd waits around midfield, not in the box. Too close and nobody is home.",pos:{ball:[2700,3700],b1:[2400,3200,'1st'],b2:[0,800,'2nd'],o1:[400,4900],o2:[1500,2500]},m:[ZN(G,-1000,300,1000,1300),TX(G,1800,800,'Wait')]},
 {say:"The 1st centres. The 2nd sees the pass coming and drives in to meet it.",pos:{ball:[200,3300],b2:[100,2500]},m:[PS(W,[2700,3700],[200,3300]),R(B,[0,800],[100,2500])]},
 {say:"Shot. The passer turns back immediately. In 2s, the passer becomes the defender.",pos:{ball:[-500,5500],b2:[100,3100],b1:[2900,1200,'back']},m:[PS(W,[200,3300],[-500,5500]),R(Y,[2400,3200],[2900,1200],[1000,-3500])]}],
 tips:["2nd waits around midfield until the pass is coming.","Pass to the middle, not into the goalie.","Passer: rotate back right after the pass.","If the pass is bad, the 2nd stays back instead."],
 bad:["2nd man in the box too early","Passer staying in the corner"],
 quiz:{q:"You just centred the ball in 2s. What do you do?",o:["Wait in the corner","Rotate back to defend","Drive to the goal too"],a:1,why:"Your teammate is shooting. Someone must be back, and that's you."}},
{id:'w7',cat:'kick',lvl:1,title:'2s: lost the kickoff',sum:"The cheater is the only one back. Get goal-side first; don't chase into the corner.",mode:2,kick:['diagL','offR'],steps:[
 {say:"Orange wins the kickoff and the ball rolls toward your left side. Your cheater is the only one between ball and net.",pos:{b1:[-180,-225,'GO'],b2:[1000,-2050,'CHEAT'],o1:[180,225],o2:[-1000,2050]},m:[PS(W,[0,0],[-1300,-2700])]},
 {say:"The cheater does NOT chase it into the corner. They go goal-side first. The kicker turns back.",pos:{ball:[-1300,-2700],b2:[-200,-4300,''],o1:[-700,-1600],b1:[-600,-900,'']},m:[R(B,[1000,-2050],[-200,-4300]),TX(B,900,-4300,'Goal-side'),R(Y,[-180,-225],[-600,-900])]},
 {say:"The kicker comes back and takes the ball, with the cheater covering. Defence safe.",pos:{b1:[-1600,-2300,'1st'],ball:[-1900,-3100],o1:[-1500,-2800],b2:[-200,-4500,'2nd']},m:[R(Y,[-600,-900],[-1600,-2300])]}],
 tips:["Lost kickoff in 2s: cheater goes goal-side first.","Kicker: land, turn, come back.","Don't both chase the ball into your corner.","Clear wide once you have it."],
 bad:["Cheater chasing into the corner","Kicker sitting still after losing"],
 quiz:{q:"In 2s you're the cheater and the kickoff is lost. What first?",o:["Chase the ball","Get between the ball and your net","Grab boost"],a:1,why:"You're the last defender. Goal-side first, then challenge when your teammate is back."}},

// ===== 1s =====
{id:'x1',cat:'kick',lvl:1,title:'1s kickoff',sum:'In 1s you always go. Fast kickoff, then react to who won it.',gen:['back'],
 tips:["Always go in 1s.","Boost the whole way, take the small pad, flip early for speed, flip again into the ball.","If you win it, follow it up. If you lose it, go straight back to net.","Don't fake in 1s unless you really know your opponent always goes."],
 bad:["Slow kickoff","Chasing after a lost kickoff instead of going back"],
 quiz:{q:"In 1s, who goes for the kickoff?",o:["You, always","Only if you're faster","Nobody, wait"],a:0,why:"There's nobody else. A slow or missed kickoff is a free shot for them."}},
{id:'x2',cat:'def',lvl:1,title:'1s: after a lost kickoff',sum:'Ball going to your half? Go back to the far post, not through the middle.',mode:1,steps:[
 {say:"You lose the kickoff and the ball heads into your half. Your opponent follows it.",pos:{ball:[-800,-2000],o1:[-300,-600],b1:[200,-300]},m:[PS(W,[0,0],[-800,-2000])]},
 {say:"Go straight back toward your net on the far side (back post). Don't turn around in the middle and get beaten.",pos:{b1:[800,-4300],o1:[-800,-1700],ball:[-1000,-2500]},m:[R(B,[200,-300],[1500,-2000],[800,-4300]),TX(B,2400,-2600,'Back post')]},
 {say:"Now you face the play with the whole field in front of you. Defend calmly.",pos:{b1:[300,-4300],ball:[-1100,-3000],o1:[-1000,-2400]},m:[ZN(G,-400,-4900,800,-3700)]}],
 tips:["Lost kickoff: back post first.","Never turn in front of the attacker.","Face the play before you challenge.","Small pads near your goal refill you."],
 bad:["Turning back through the middle","Challenging from behind"],
 quiz:{q:"You lose the kickoff in 1s. Where do you go?",o:["Chase the ball","Back post of your net","Their corner boost"],a:1,why:"From the back post you see everything and you're in front of the shot."}},
{id:'x3',cat:'boost',lvl:2,title:'1s: steal their boost',sum:'Boost is everything in 1s. Take theirs after your challenge.',mode:1,steps:[
 {say:"In 1s, boost is everything. Your opponent is low.",pos:{ball:[-2700,3800],b1:[-2300,3200],o1:[-1500,4700,'low']},m:[]},
 {say:"After your challenge, take their corner boost. Now they have to go far for boost, or play without it.",pos:{b1:[-3072,4096,'took it'],ball:[0,2000],o1:[-400,2600]},m:[R(Y,[-2300,3200],[-3072,4096]),PS(W,[-2700,3800],[0,2000])]},
 {say:"A player without boost can't challenge hard or defend high balls. Starve them and keep the pressure.",pos:{o1:[-3584,0,'0 boost'],b1:[-1000,2600],ball:[500,1800]},m:[R(O,[-400,2600],[-3584,0]),TX(Rd,-2700,-600,'Far')]}],
 tips:["Take their corner boost when you're near it.","A player with no boost can't challenge or fly.","Keep your own boost above 30 when you can.","Don't steal boost if it leaves your net open."],
 bad:["Ignoring boost","Taking boost when the ball is going to your net"],
 quiz:{q:"In 1s you just challenged in their corner. Their big pad is right there. Do you take it?",o:["Yes, if the ball isn't heading to my net","Never","Only if I'm at 0"],a:0,why:"Stealing it starves your opponent, but only if your net isn't in danger."}},
{id:'x4',cat:'def',lvl:1,title:"1s: don't overcommit",sum:'Diving at a dribble gets you flicked. Stay back, mirror, challenge on the bad touch.',mode:1,steps:[
 {say:"The opponent has the ball on their roof. If you jump at them now, a small flick beats you.",pos:{ball:[0,500],o1:[0,0],b1:[0,-1500]},m:[R(Rd,[0,-1500],[0,300]),TX(Rd,1200,-700,'Dive')]},
 {say:"One flick, and they have an open net while you're flipping the wrong way.",pos:{ball:[300,-3000],o1:[200,-1700],b1:[0,600]},m:[PS(W,[0,500],[300,-3000])]},
 {say:"Instead: stay 2-3 car lengths away, mirror them, and fake a challenge to make them flick early. Challenge only when the ball is off their car.",pos:{ball:[0,500],o1:[0,0],b1:[0,-2200,'fake']},m:[ZN(G,-900,-2800,900,-1600),TX(G,1700,-2200,'Mirror')]}],
 tips:["Stay 2-3 car lengths from a dribbler.","Fake a challenge to make them flick early.","Challenge when the ball is off their car.","Patience wins 1s."],
 bad:["Jumping at a controlled dribble","Getting too close"],
 quiz:{q:"Your opponent dribbles toward you in 1s. Best move?",o:["Jump at them","Mirror from 2-3 car lengths and wait","Turn and go for boost"],a:1,why:"Diving gives them an easy flick. Wait for the ball to leave their car."}},
{id:'x5',cat:'off',lvl:1,title:"1s: shoot when they're out of position",sum:'Most 1s goals come from the opponent being away from their net.',mode:1,steps:[
 {say:"Your opponent went for boost in the corner. Their goal is open for a few seconds.",pos:{ball:[1500,1500],b1:[1300,900],o1:[-3200,3800,'boosting']},m:[TX(Rd,-1800,4500,'Not in net')]},
 {say:"Shoot now, even from far. In 1s, most goals come from the opponent being out of position.",pos:{ball:[300,5500],b1:[1400,1700],o1:[-2500,4300]},m:[PS(W,[1500,1500],[300,5500])]},
 {say:"Follow your shot in case it's saved. If it's cleared, turn back at once: you're also the only defender.",pos:{b1:[700,3300]},m:[R(B,[1400,1700],[700,3300])]}],
 tips:["Watch where the opponent is, not just the ball.","Shoot when they're away from their net.","Follow up your shot.","After a miss, get back fast."],
 bad:["Dribbling forever while the net is open","Shooting into a goalie who is set"],
 quiz:{q:"In 1s, the opponent is in their corner getting boost. You have the ball at midfield.",o:["Dribble slowly","Shoot now","Pass"],a:1,why:"Their net is empty for a few seconds. Even a long shot can go in."}},
{id:'x6',cat:'def',lvl:2,title:'1s: recover after a miss',sum:'Missed the ball? Land, turn, and go back along the side. Fast.',mode:1,steps:[
 {say:"You jump for the ball and miss. Now you're far from your goal.",pos:{ball:[-500,3300],b1:[-400,2900,'whiff'],o1:[-600,3900]},m:[]},
 {say:"They hit it past you. Land on your wheels, turn, boost back. Don't watch the ball; drive.",pos:{ball:[-800,800],o1:[-700,1600],b1:[-1500,2000,'']},m:[PS(W,[-500,3300],[-800,800])]},
 {say:"Go back along the side to reach your net before they shoot. In 1s, only go up for balls you're sure to win.",pos:{b1:[-800,-3900],ball:[-600,-1600],o1:[-600,-1000]},m:[R(B,[-1500,2000],[-3200,0],[-800,-3900])]}],
 tips:["Land on your wheels after every jump.","Recover first, watch later.","Go back along the side.","Only jump for balls you're sure to win."],
 bad:["Watching the replay of your miss in your head","Turning back through the middle"],
 quiz:{q:"You whiff an aerial in 1s. What now?",o:["Try again right away","Land, turn and go back to your net","Go for boost"],a:1,why:"You're the only defender. Getting back is all that matters."}}
);

{id:'n2',cat:'sense',lvl:2,title:'Patience: wait for their touch',sum:'Do not dive at a dribbler. Stay in front, then win the ball on their bad touch.',mode:3,steps:[

// ---------- kickoff roles + generated kickoff lessons ----------
const KD={diagL:1,diagR:1,offL:2,offR:2,back:3};
function koRoles(k){
  const s=k.slice().sort((a,b)=>KD[a]-KD[b]||KO[a][0]-KO[b][0]);
  const go=s[0], rest=s.slice(1);
  // tie for cheat (two off-centres left after a diagonal): the one on the far side from the kicker cheats
  if(rest.length>=2&&KD[rest[0]]===KD[rest[1]]&&Math.sign(KO[rest[0]][0])===Math.sign(KO[go][0]))[rest[0],rest[1]]=[rest[1],rest[0]];
  return {go,tie:k.some(x=>x!==go&&KD[x]===KD[go]),cheat:rest[0]||null,boost:k.length>=3?rest[1]:null,net:k.length>=4?rest[2]:null};
}
const sgn=sp=>Math.sign(KO[sp][0]);
function cheatSpot(sp){const s=sgn(sp);return sp.startsWith('diag')?[s*1150,-1450]:sp.startsWith('off')?[s*1000,-2050]:[0,-2700]}
function boostSide(r){return r.cheat&&sgn(r.cheat)?-sgn(r.cheat):(sgn(r.go)?-sgn(r.go):-1)}
function koTargets(k,r){const T={};T[r.go]=[0,0];if(r.cheat)T[r.cheat]=cheatSpot(r.cheat);if(r.boost)T[r.boost]=[boostSide(r)*3072,-4096];if(r.net)T[r.net]=[0,-4700];return T}
const nm=sp=>SPOT_NAME[sp];
function koSay(k,r){
  const n=k.length,bs=boostSide(r)<0?'left':'right';
  if(n===1)return "In 1s you always go. Boost straight at the ball and flip into it.";

    'From straight back: the longest kickoff. Hold boost, take the centre pad, flip early for speed and again into the ball.';
  st[1].say=tech+(r.cheat?' The cheater waits behind the ball\'s line.':'')+(r.boost?' The boost player fills up to 100.':'');

  if(r.boost){st[2].pos[id(r.boost)]=[bs*900,-2600,'3rd'];st[2].pos[oid(r.boost)]=[cs*2600,3500]}
  if(r.net){st[2].pos[id(r.net)]=[0,-4500,'4th'];st[2].pos[oid(r.net)]=[0,4800]}

  const side=cs>0?'right':'left';

    n===2?`Say we win it toward their ${side} corner. The cheater presses as 1st. The kicker recovers and drops back as the last man.`:
    `Say we win it toward their ${side} corner. The cheater is already moving, so they press as 1st. The kicker recovers as 2nd. The boost player comes up as 3rd with 100 boost.`;

}

function buildLesson(P){
  const map=mapObj().arena==='soccar'?S.map:'dfh';
  const kick=P.gen||P.kick||null, mode=P.gen?P.gen.length:P.mode, steps=P.gen?genKick(P.gen):P.steps;
  const S2={name:P.title,map,mode,kick:kick&&kick.length===mode?kick.slice():null,lessonId:P.id,frames:[]};
  let prev=kickoffObjs(mode,map,kick&&kick.length===mode?kick:null);
  steps.forEach(st=>{
    const objs=prev.map(o=>{const n={...o};const q=st.pos&&st.pos[o.id];if(q){n.x=q[0];n.y=q[1];if(q.length>2){if(q[2])n.label=q[2];else delete n.label}}return n});
    const f={objs,marks:clone(st.m||[])};if(st.say)f.say=st.say;S2.frames.push(f);prev=objs;
  });
  const n=S2.frames.length, kso=kickoffObjs(mode,map,kick&&kick.length===mode?kick:null);
  for(let i=0;i<n;i++)for(const o of S2.frames[i].objs){if(o.kind!=='car')continue;
    const nx=i<n-1?S2.frames[i+1].objs.find(q=>q.id===o.id):null, pv=i>0?S2.frames[i-1].objs.find(q=>q.id===o.id):null;
    const ball=S2.frames[i].objs.find(q=>q.kind==='ball'), faceBall=Math.atan2(ball.y-o.y,ball.x-o.x);
    if(i===0){if(kick)continue;o.a=nx&&Math.hypot(nx.x-o.x,nx.y-o.y)>600?Math.atan2(nx.y-o.y,nx.x-o.x):faceBall;continue}
    const ks=i>0&&kso.find(q=>q.id===o.id&&Math.abs(q.x-o.x)<2&&Math.abs(q.y-o.y)<2);if(ks){o.a=ks.a;continue}
    if(pv&&Math.hypot(o.x-pv.x,o.y-pv.y)>200)o.a=Math.atan2(o.y-pv.y,o.x-pv.x);else o.a=faceBall;
  }
  return S2;
}

function xpNow(){

  x+=Object.keys(prog.done||{}).length*50;
  x+=Object.values(r).reduce((a,v)=>a+(v.runs||0)*30+(v.hits||0)*5,0);

  return x;

const lvlOf=x=>{let l=1,need=200,acc=0;while(x>=acc+need){acc+=need;l++;need=Math.round(need*1.18)}return {l,into:x-acc,need}};

function seedRand(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return ()=>{h=(h*1103515245+12345)>>>0;return h/4294967296}}

  const next=()=>{if(i<blocks.length-1){i++;left=blocks[i][1]*60;splash(blocks[i][0].split(' ')[0].toUpperCase()+'!','go');draw()}else{clearInterval(t);run=false;imp.sess++;saveImp();splash('SESSION DONE!','hit');close()}};

const GLOSS=[['1st / 2nd / 3rd man','The three jobs in 3s: pressure the ball, support, and stay back as safety.'],['Back post','The far post of your goal, away from the ball. Rotate to it on defense to see the whole play.'],['Ball cam','Camera that always looks at the ball. Most players use it most of the time.'],['Boost starve','Taking the other team\'s boost so they run out.'],['Cheat / cheating up','Moving up a bit as 2nd man to be ready for the next touch.'],['Ceiling shot','Driving onto the ceiling, dropping off with your flip saved, then using it on the ball.'],['Chain dash','Wavedashing again and again to keep speed.'],['Demo','Destroying an opponent by hitting them at supersonic speed.'],['Double commit','Two teammates going for the same ball. Usually a goal against.'],['Double tap','Hitting the ball off the backboard, then hitting it again into the net.'],['Dribble','Carrying the ball on top of your car.'],['Fast aerial','Jump + boost, then a quick second jump to get up fast.'],['50/50','Both players hit the ball at the same time.'],['Flick','Using a flip to launch the ball off your roof.'],['Flip reset','Touching the ball with all four wheels in the air to get your flip back.'],['Half-flip','A backflip you cancel and roll out of to turn around quickly.'],['Half-volley','Hitting the ball right after it bounces.'],['Kickoff','The start of each round. Closest player goes.'],['Last man','The player furthest back. If they go up, the net is open.'],['Musty flick','A flick where you tip the nose up and backflip into the ball.'],['Overcommit','Too many players going forward, leaving the net open.'],['Pinch','Hitting the ball into a wall or another car to send it very fast.'],['Powerslide','The handbrake. Used to turn sharply.'],['Pre-jump','Jumping early to meet a ball before the opponent can.'],['Recovery','Landing on your wheels and getting back to speed after a play.'],['Redirect','Changing the direction of a pass in the air towards the net.'],['Rotation','The cycle of moving between 1st, 2nd and 3rd so someone is always back.'],['Shadow defense','Driving back with the attacker, between ball and goal, without diving in.'],['Small pads','The boost pads that give 12 boost. Take them on your path.'],['Speed flip','The fastest kickoff flip: diagonal flip with a cancel.'],['Supersonic','Top speed. Your car leaves a trail.'],['Touch','Any hit on the ball. A good first touch sets up the play.'],['Wavedash','Flipping right as your wheels touch the ground for free speed.'],['Whiff','Missing the ball completely.'],['Zap dash','An advanced dash technique for very fast speed.'],['Air roll','Rolling the car in the air to control your angle.'],['Backboard read','Predicting where the ball comes down after hitting the back wall.'],['Clear','Hitting the ball away from your goal, best to the corners.'],['Infield pass','Passing the ball into the middle for a teammate.']];

function bcVal(o,f){if(!o)return null;if(f==='_small'){const s=o.count_collected_small,b=o.count_collected_big;return s!=null&&b!=null&&(s+b)>0?Math.round(s/(s+b)*1000)/10:null}return o[f]==null?null:o[f]}
function bcInsights(d){
  const out=[];const modes=new Set((d.recent||[]).map(r=>r.mode));
  for(const M of BCM){const a=bcVal(d.me,M.f),b=bcVal(d.lobby,M.f);if(a==null||b==null)continue;
    if(M.mode&&![...modes].some(m=>M.mode.includes(m)))continue;
    const diff=(a-b)*M.good;out.push({M,a,b,diff,bad:diff<=-M.gap,goodp:diff>=M.gap,score:diff/M.gap})}
  return out;
}
const fmtN=(v,u)=>v==null?'-':(Math.abs(v)>=100?Math.round(v):Math.round(v*10)/10)+u;
function bcCompare(x){const mx=Math.max(x.a,x.b)*1.15||1;
  return `<div class="cmp"><div class="cmp-h"><b>${esc(x.M.n)}</b>${x.bad?'<span class="bdg bad">WORK ON THIS</span>':x.goodp?'<span class="bdg good">STRENGTH</span>':''}</div>
   <div class="cmp-r"><span>You</span><div class="cmp-b"><i class="me${x.bad?' bad':x.goodp?' good':''}" style="width:${Math.max(2,x.a/mx*100)}%"></i></div><b>${fmtN(x.a,x.M.u)}</b></div>
   <div class="cmp-r"><span>Lobby</span><div class="cmp-b"><i style="width:${Math.max(2,x.b/mx*100)}%"></i></div><b>${fmtN(x.b,x.M.u)}</b></div></div>`}
async function bcLoad(id){const r=await fetch(BC_URL+encodeURIComponent(id)+'.json?t='+Date.now(),{cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('http '+r.status);return r.json()}
function parseBcLink(v){v=(v||'').trim();
  const m=/ballchasing\.com\/player\/([a-z]+)\/([^/?#\s]+)/i.exec(v);if(m)return {p:m[1].toLowerCase(),i:decodeURIComponent(m[2])};
  const m2=/^(steam|epic|ps4|xbox|switch):(\S+)$/i.exec(v);if(m2)return {p:m2[1].toLowerCase(),i:m2[2]};
  if(v.length>=2&&v.length<=32)return {n:v};return null}

// ---------- Today's plan: one list of what to do today, built from everything the app knows about you ----------
function planItems(){
  const day=TODAY(), it=[], R=rk.r>=0?RANKS[rk.r]:null, s=gameStats(), top=s.top[0];
  if(!imp.daily[day])it.push({id:'daily',t:'Daily challenge',sub:'Tip, drill and one question. +100 XP',go:openDaily,auto:()=>!!imp.daily[day]});
  try{myHw().filter(h=>!h.done).slice(0,2).forEach(h=>it.push({id:'hw'+h.id,t:'Coach: '+hwLabel(h),sub:h.text||'Homework from your coach',go:openHomework}))}catch(e){}
  if(top){const F=FIX[top[0]];it.push({id:'fix',t:'Fix #1: '+TAGN[top[0]],sub:F.txt,go:()=>{const L=F.les&&lessonById(F.les[0]);L?openLesson(L.id):openGameLog()}})}
  else if(R){const L=lessonById(R.les[0]);if(L)it.push({id:'fix',t:'Lesson: '+L.title,sub:'Picked for '+R.n,go:()=>openLesson(L.id)})}
  {const c=wmContinue(),L=seriesLessons(c.s)[c.i];if(L)it.push({id:'watch',t:'Watch: '+L.title,sub:c.s.n+' · lesson '+(c.i+1)+' of '+seriesLessons(c.s).length,go:()=>startWatch(c.s,c.i),auto:()=>!!prog.done[L.id]})}
  const mk=sklNext()||'recover',sl=Math.min(2,sklState(mk).lv);
  it.push({id:'mech',t:'Skill test: '+MECHS[mk].n+' (level '+(sl+1)+')',sub:SKL[sl].n+'. Pass with '+SKL[sl].goal+'/10',go:()=>openSkill(mk)});
  const pk=top&&FIX[top[0]].pack||'p_shoot';const P=packById(pk);if(P)it.push({id:'pack',t:'Training: '+P.name,sub:'Do it in Rocket League, log hit or miss',go:()=>openPack(pk)});
  if(it.length>=5)return it.slice(0,5);
  it.push({id:'warm',t:'Warm up 10 min before ranked',sub:'Free play: 50 touches, mix ground and air',go:()=>openSession()});
  it.push({id:'log',t:'Log your ranked games',sub:'5 seconds each. Finds your weak spots',go:()=>logGame(imp.lm||'3')});
  return it.slice(0,5);
}

// ---------- Skill tests: measurable mechanic practice (3 levels, score out of 10) ----------
const SKL=[
 {n:'Slow, in free play',d:'Take your time. Do the mechanic 10 times at a slow, controlled speed. Count how many work.',goal:7},
 {n:'Full speed',d:'Same mechanic, 10 tries at full game speed in free play or a training pack. Count the clean ones.',goal:7},
 {n:'In real games',d:'Over your next games (casual or ranked), try it 10 times when the chance is there. Count how many work.',goal:5}];
function sklState(k){imp.skl=imp.skl||{};return imp.skl[k]||(imp.skl[k]={lv:0,log:[]})}
function sklNext(){
  // The next mechanic to test: one you are learning, else the first not-started one for your rank.
  const R=rk.r>=0?RANKS[rk.r]:null, keys=Object.keys(MECHS);
  const learning=keys.filter(k=>imp.mech[k]===1&&sklState(k).lv<3);
  if(learning.length)return learning[0];
  return (R?R.mech:keys).find(k=>imp.mech[k]!==2&&sklState(k).lv<3)||keys.find(k=>sklState(k).lv<3);
}
function openSkill(k){
  const M=MECHS[k],st=sklState(k);let pick=null;
  const {el,close}=modal(`<div class="banner"><span>SKILL TEST</span>${esc(M.n)}</div>
   <div class="sklv">${SKL.map((L,i)=>`<div class="skl${i<st.lv?' pass':i===st.lv?' now':''}"><b>${i<st.lv?'✓':i+1}</b><span>${esc(L.n)}</span></div>`).join('')}</div>
   ${st.lv>=3?`<div class="nextup"><span class="lbl">Mastered</span><b>You passed all 3 levels!</b><small>Keep using it in games. Test again any time to stay sharp.</small></div>`:''}
   <h3>How to do it</h3><p>${esc(M.how)}</p>
   <h3>${st.lv>=3?'Test again':'Level '+(st.lv+1)+': '+esc(SKL[Math.min(2,st.lv)].n)}</h3><p>${esc(SKL[Math.min(2,st.lv)].d)} <b>Pass: ${SKL[Math.min(2,st.lv)].goal}/10.</b></p>
   <div class="sk10">${Array.from({length:11},(_,i)=>`<button data-v="${i}">${i}</button>`).join('')}</div>
   <div class="row" style="margin-top:10px"><button class="btn pri" id="skSave" disabled>Save result</button><button class="btn" id="skX">Close</button></div>
   ${st.log.length?`<h3>Your results</h3><div class="skhist">${st.log.slice(-12).map(r=>`<span class="${r.p?'p':''}" title="Level ${r.l+1}"><i style="height:${r.v*10}%"></i><b>${r.v}</b></span>`).join('')}</div>`:''}`,false,'tall');
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{pick=+b.dataset.v;el.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));el.querySelector('#skSave').disabled=false});
  el.querySelector('#skX').onclick=close;
  el.querySelector('#skSave').onclick=()=>{const L=Math.min(2,st.lv),pass=pick>=SKL[L].goal;
    st.log.push({l:L,v:pick,p:pass,d:Date.now()});imp.reps[k]=(imp.reps[k]||0)+1;
    if(pass&&st.lv<3){st.lv++;if(st.lv>=1&&!imp.mech[k])imp.mech[k]=1;if(st.lv>=3)imp.mech[k]=2;splash(st.lv>=3?'MASTERED!':'LEVEL UP!','hit')}
    else if(!pass)splash(pick+'/10 · AGAIN!','go');
    if(!imp.mech[k])imp.mech[k]=1;saveImp();close();openSkill(k)};
}

function chooser(title,items){
  const {el,close}=modal(`<div class="banner"><span>ACADEMY</span>${esc(title)}</div><div class="list">${items.map(([ic,t,s],i)=>`<button class="chs" data-i="${i}">${ic}<span class="lm"><b>${esc(t)}</b><small>${esc(s)}</small></span><span class="ar">›</span></button>`).join('')}</div>
   <div class="row" style="margin-top:14px"><button class="btn" id="chBack">‹ Home</button></div>`,false,'tall');
  el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{close();items[+b.dataset.i][3]()});
  el.querySelector('#chBack').onclick=()=>{close();openHome()};
}

// ---------- Watch & learn: lessons play by themselves like a video, then the next lesson starts ----------
const SERIES=[
 {id:'s_basics',n:'3s basics',d:'Start here: the jobs, kickoffs and rotation',ls:['r1','k1','r3','r2','r5','o1','d1','d3']},
 {id:'s_plat',n:'Get out of Plat',d:'The habits that keep most players stuck',ls:['r9','o8','b1','n10','n2','n1','o7','g5']},
 {id:'s_def',n:'Defense masterclass',d:'Shadow, back post, clears, last man',ls:['d1','d2','n3','n5','n11','d9','d7','d8','n14']},
 {id:'s_att',n:'Attack and passing',d:'Follow up, passes and pressure',ls:['o1','o2','o3','o6','o9','n8','o5']},
 {id:'s_sense',n:'Game sense',d:'Read the game like a high rank',ls:['n11','n2','n1','g5','g2','g3','n12','g4']},
 {id:'s_2s',n:'2s essentials',d:'Everything you need for doubles',mode:2},
 {id:'s_1s',n:'1s essentials',d:'Win your duels',mode:1}];
function seriesLessons(s){return (s.ls?s.ls.map(lessonById):LESSONS.filter(l=>!l.gen&&l.mode===s.mode)).filter(l=>l&&(l.steps||l.gen))}
let WM=null;
function openWatch(){
  const {el,close}=modal(`<div class="banner"><span>WATCH</span>&amp; LEARN</div>
   <p>Pick a series. Lessons play on the board by themselves with the coach talking you through every step, then the next one starts. Just watch.</p>
   <div class="list">${SERIES.map((s,i)=>{const ls=seriesLessons(s),dn=ls.filter(l=>prog.done[l.id]).length,full=dn===ls.length;
     return `<button class="ser${full?' done':''}" data-s="${i}"><span class="ser-n">${full?'✓':svg('play')}</span><span class="lm"><b>${esc(s.n)}</b><small>${esc(s.d)}</small><span class="ser-p"><i style="width:${Math.round(dn/ls.length*100)}%"></i></span><small>${dn}/${ls.length} watched · about ${Math.round(ls.length*0.6+.5)} min</small></span></button>`}).join('')}</div>
   <div class="row" style="margin-top:14px"><button class="btn" id="wtHome">‹ Home</button></div>`,false,'tall');
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=SERIES[+b.dataset.s],ls=seriesLessons(s),start=Math.max(0,ls.findIndex(l=>!prog.done[l.id]));close();startWatch(s,start===-1?0:start)});
  el.querySelector('#wtHome').onclick=()=>{close();openHome()};
}
function startWatch(s,i){const ls=seriesLessons(s);if(!ls.length)return;WM={s,ls,i:Math.max(0,Math.min(ls.length-1,i||0)),paused:false,tok:0};wmLoad()}
function wmLoad(){
  if(!WM)return;const L=WM.ls[WM.i];WM.tok++;
  watchLesson(L);coachHidden=false;syncCoach();wmBar();wmWait(WM.tok,1200);
}
function wmRead(){const say=(S.frames[cur]&&S.frames[cur].say)||'';return 2200+say.length*48}
function wmWait(tok,ms){setTimeout(()=>wmTick(tok),ms)}
function wmTick(tok){
  if(!WM||tok!==WM.tok)return;if(WM.paused){wmWait(tok,300);return}
  if(!WM.ls[WM.i]||S.lessonId!==WM.ls[WM.i].id){WM=null;wmBar();return}
  if(playing){wmWait(tok,150);return}
  const n=S.frames.length;
  if(!WM.read){WM.read=true;wmWait(tok,wmRead());return}
  WM.read=false;
  if(cur<n-1){play(true);wmWait(tok,200);return}
  // Lesson finished
  const L=WM.ls[WM.i];if(!prog.done[L.id]){prog.done[L.id]=1;saveProg();try{pushStats()}catch(e){}}
  if(WM.i<WM.ls.length-1){WM.nextIn=3;wmBar();const cd=()=>{if(!WM||tok!==WM.tok)return;if(WM.paused){setTimeout(cd,300);return}WM.nextIn--;if(WM.nextIn<=0){WM.nextIn=0;WM.i++;WM.read=false;wmLoad()}else{wmBar();setTimeout(cd,1000)}};setTimeout(cd,1000)}
  else wmFinish();
}
function wmBar(){
  let b=$('#wmBar');if(!WM){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='wmBar';$('#stage').appendChild(b)}
  const L=WM.ls[WM.i];
  b.innerHTML=`<div class="wm-row"><span class="pk-tag">${WM.i+1}/${WM.ls.length}</span><b class="wm-t">${WM.nextIn?'Next lesson in '+WM.nextIn+'...':esc(L.title)}</b><button class="ib sm" id="wmPl" aria-label="${WM.paused?'Play':'Pause'}">${svg(WM.paused?'play':'pause')}</button><button class="ib sm" id="wmN" aria-label="Next lesson"${WM.i<WM.ls.length-1?'':' disabled'}>⏭</button><button class="ib sm" id="wmX" aria-label="Stop watching">${svg('x')}</button></div>`;
  b.querySelector('#wmPl').onclick=()=>{WM.paused=!WM.paused;if(WM.paused)stopPlay();wmBar()};
  b.querySelector('#wmN').onclick=()=>{if(WM.i<WM.ls.length-1){WM.i++;WM.read=false;WM.nextIn=0;wmLoad()}};
  b.querySelector('#wmX').onclick=()=>{WM=null;wmBar();toast('Stopped watching')};
}
function wmFinish(){
  const s=WM.s,n=WM.ls.length;WM=null;wmBar();
  const {el,close}=modal(`<div class="banner"><span>SERIES</span>COMPLETE</div><p style="text-align:center"><b>${esc(s.n)}</b>: all ${n} lessons watched. +${n*50} XP</p>
   <p class="hint" style="text-align:center">Now try it in your games. One idea per game is enough.</p>
   <div class="row" style="justify-content:center;margin-top:12px"><button class="btn pri" id="wfQ">Take the quiz</button><button class="btn" id="wfM">More series</button></div>`,true);
  splash('SERIES DONE!','hit');
  el.querySelector('#wfQ').onclick=()=>{close();openQuiz(s.mode||3)};el.querySelector('#wfM').onclick=()=>{close();openWatch()};
}
function wmContinue(){const s=SERIES.find(x=>seriesLessons(x).some(l=>!prog.done[l.id]))||SERIES[0],ls=seriesLessons(s);return {s,i:Math.max(0,ls.findIndex(l=>!prog.done[l.id]))}}

// ---------- boot ----------
buildStatic();initCoach();setTool('run');buildTop();buildFrames();syncUndo();syncPlay();
window.addEventListener('hashchange',()=>{const c=location.hash.match(/^#c=([\w-]+)/);if(c){document.querySelectorAll('.modal').forEach(x=>x.remove());importCoach(c[1]);return}const m=location.hash.match(/^#l=([\w:,]+)/);if(m&&lessonById(decodeURIComponent(m[1]))){document.querySelectorAll('.modal').forEach(x=>x.remove());openLesson(decodeURIComponent(m[1]))}});
const hm=location.hash.match(/^#l=([\w:,]+)/), hc=location.hash.match(/^#c=([\w-]+)/);
if(hc){LS.set('bb.seenAcademy',true);LS.set('bb.seenAcademy2',true);LS.set('bb.seen2',true);setTimeout(()=>importCoach(hc[1]),300)}
else if(hm&&lessonById(decodeURIComponent(hm[1])))setTimeout(()=>openLesson(decodeURIComponent(hm[1])),300);
else if(!LS.get('bb.name','')&&!LS.get('bb.askedSignup',false)){LS.set('bb.askedSignup',true);setTimeout(()=>openAccount('up'),300)}
else if(!LS.get('bb.seenAcademy',false)){LS.set('bb.seenAcademy',true);LS.set('bb.seenAcademy2',true);LS.set('bb.seen2',true);setTimeout(openWelcome,500)}
else if(!LS.get('bb.seenAcademy2',false)){LS.set('bb.seenAcademy2',true);setTimeout(openNews,500)}
else if(LS.get('bb.planDay','')!==new Date().toDateString()){LS.set('bb.planDay',new Date().toDateString());setTimeout(openPlan,700)}
else if(!LS.get('bb.seen2',false)){LS.set('bb.seen2',true);setTimeout(()=>toast('Drag a car or ball to move it. Drag the field to draw'),600)}
})();
</script>

</html>

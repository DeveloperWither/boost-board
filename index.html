const CONTACT3={b1:[-180,-225,'GO'],b2:[1150,-1450,'CHEAT'],b3:[-2950,-4050,'BOOST'],o1:[180,225],o2:[-1150,1450],o3:[2950,4050]};

const LESSONS=[
// ===== KICKOFFS =====
{id:'k1',cat:'kick',lvl:1,title:'3s kickoff: go, cheat, boost',sum:'The one rule every 3s team needs: closest goes, next closest cheats, farthest grabs boost.',gen:KO3,
 tips:["Closest to the ball goes. Diagonals are closest, then off-centres, then the straight (back) spawn.","Two diagonals? Left goes (left from your own car's view). Same for two off-centres.","Second closest cheats: drive up beside the centre circle and stop behind the ball's line.","Farthest grabs the corner boost on the side away from the cheater, then comes back. They are last back until the play settles.","Agree the rule with your team before the match so nobody hesitates."],
 bad:["Two players both going for the ball","Cheater driving past the ball before contact","Nobody near the net for the first seconds","Boost player staying in the corner after grabbing boost"],
 quiz:{q:"Spawns: diagonal left, diagonal right, straight. You are diagonal right. What do you do?",o:["Go for the ball","Cheat up beside the circle","Grab corner boost and go back"],a:1,why:"Two diagonals tie, so left goes. You're second closest, so you cheat. Straight is farthest and grabs boost."}},
{id:'k2',cat:'kick',lvl:1,title:'Off-centre kickoffs',sum:'No diagonals: the left off-centre goes and drives over the centre boost pad on the way.',gen:['offL','offR','back'],
 tips:["Off-centre kicker: drive straight over the small pad in front of you, then turn into the ball and flip.","Off-centre is slower than a diagonal, so go instantly. Any hesitation gives them a free hit.","The other off-centre cheats and picks up the small pad on their side on the way.","The straight spawn grabs corner boost on the side away from the cheater."],
 bad:["Missing the small pad on the way","Turning too late and hitting the ball with the side of your car"],
 quiz:{q:"Spawns: off-centre left, off-centre right, straight. Who goes?",o:["Off-centre left","Off-centre right","Straight"],a:0,why:"No diagonal. The two off-centres are the same distance, so the left one goes."}},
{id:'k3',cat:'kick',lvl:1,title:'Diagonal beats off-centre',sum:'A diagonal is always closer than an off-centre, so the diagonal goes, even on the right.',gen:['diagR','offL','back'],
 tips:["The diagonal is the shortest path to the ball, so the diagonal player goes, left or right.","'Left goes' only breaks a tie between two spawns of the same type.","The off-centre cheats and grabs the small pad in front of them.","The straight spawn grabs boost on the side away from the cheater."],
 bad:["Off-centre going because 'left goes'","Both players going and bumping each other"],
 quiz:{q:"You spawn off-centre left. A teammate spawns diagonal right. Who goes?",o:["You, because left goes","Diagonal right, because diagonal is closer","Whoever presses the throttle first"],a:1,why:"'Left goes' is only a tie-break. A diagonal is closer than an off-centre, so the diagonal goes."}},
{id:'k4',cat:'kick',lvl:2,title:'Kickoff technique: boost, flip, flip',sum:'How to actually win the kickoff: full boost, an early flip for speed, a second flip into the ball.',mode:1,kick:['diagL'],steps:[
 {say:"Hold boost from the very first moment and aim slightly inside the ball's centre. From a diagonal you drive over a small pad automatically.",pos:{},m:[R(Y,[-2048,-2560],[-1788,-2300],[-1250,-1560]),TX(Y,-2300,-1700,'Boost now')]},
 {say:"Speed: after the pad, do one quick flip forward while still boosting. Pros use a speed flip; a normal front flip still beats no flip.",pos:{b1:[-1250,-1560],o1:[1250,1560]},m:[TX(G,-2100,-1000,'Flip 1'),R(Y,[-1250,-1560],[-230,-290])]},
 {say:"About one car length from the ball, flip INTO it. The flip gives the hit its power. Flip too early and you arrive weak; too late and you get bounced.",pos:{b1:[-230,-290],o1:[260,330]},m:[ZN(W,-450,-450,450,450),TX(Y,-1200,-500,'Flip 2')]},
 {say:"Hit first with full power and the ball goes past them. Aim a little off-centre to send it toward their corner instead of straight at their goalie.",pos:{ball:[1500,2700],b1:[100,350],o1:[700,800]},m:[PS(W,[0,0],[1500,2700]),TX(W,2200,1800,'Into the corner')]}],
 tips:["Boost the whole way. Never let go of boost before contact.","Final flip about one car length from the ball.","To steer the ball, hit it slightly on the opposite side of where you want it to go.","Practice in free play or against bots: 20 kickoffs from each spawn."],
 bad:["Letting go of boost to steer","Flipping from too far away","Jumping into the ball without flipping"],
 quiz:{q:"When should you do your final flip on a kickoff?",o:["As soon as the countdown ends","About one car length before the ball","After the opponent hits it"],a:1,why:"Flipping right before contact puts the flip's power into the ball. Too early and you arrive slow and weak."}},
{id:'k5',cat:'kick',lvl:1,title:'Won the kickoff: attack!',sum:'The ball goes forward. Who presses, who follows, who stays back.',mode:3,kick:KO3,steps:[
 {say:"Contact. Blue wins the 50/50 and the ball heads toward Orange's right corner.",pos:CONTACT3,m:[PS(W,[0,0],[1800,3200]),R(B,[1150,-1450],[1300,1700])]},
 {say:"The cheater is already moving forward, so they become 1st man and press the ball. The kicker recovers as 2nd. The boost player has 100 boost and moves up as 3rd.",pos:{ball:[1800,3200],b1:[200,700,'2nd'],b2:[1300,1700,'1st'],b3:[-1300,-2700,'3rd'],o1:[-300,600],o2:[-500,3900],o3:[2500,3900]},m:[R(B,[1300,1700],[1750,2950]),R(G,[-1300,-2700],[-400,-300])]},
 {say:"Pressure forces a weak clear into the middle. The 2nd man is in the perfect spot to shoot. The 3rd sits at half to stop any counter.",pos:{ball:[200,3000],b2:[1900,3100],b1:[0,2100],b3:[-400,-300],o3:[2300,3600],o2:[0,4500],o1:[-200,1600]},m:[R(Y,[0,2100],[150,2850]),TX(Y,-1000,2400,'Shoot')]}],
 tips:["Winning the kickoff is only half the job; the follow-up decides if you score.","Cheater: as soon as the ball goes forward, go. You're the fastest player into their half.","Kicker: land, recover and become 2nd. Don't chase the ball you just hit.","Boost player: come up to half once the ball is in their half."],
 bad:["Kicker chasing their own kickoff hit","3rd man staying in goal while the team attacks","Everyone driving into the same corner"],
 quiz:{q:"You win the kickoff into their corner. You were the cheater. What now?",o:["Wait in the middle for a pass","Press the ball as 1st man","Go back to defend"],a:1,why:"You're already moving forward with the best angle, so you press. The kicker recovers behind you as 2nd."}},
{id:'k6',cat:'kick',lvl:1,title:'Lost the kickoff: defend',sum:'The ball comes your way. Stay calm: the boost player is usually closest.',mode:3,kick:KO3,steps:[
 {say:"Orange wins it and the ball rolls into your left corner. Your boost player is right there with 100 boost. The cheater must get goal-side fast.",pos:CONTACT3,m:[PS(W,[0,0],[-1600,-3100]),R(G,[-2950,-4050],[-2700,-3600]),R(B,[1150,-1450],[500,-3300])]},
 {say:"The boost player takes the first touch and clears it up the side wall, away from the middle. The cheater heads to net. The kicker turns around and becomes 2nd.",pos:{ball:[-1600,-3100],b3:[-2700,-3600,'1st'],b2:[500,-3300,'3rd'],b1:[-300,-900,'2nd'],o1:[-500,-1000],o2:[-1300,-700],o3:[1500,3200]},m:[PS(W,[-1600,-3100],[-3700,-400]),TX(W,-2700,-1700,'Clear wide'),R(B,[500,-3300],[0,-4650])]},
 {say:"Safe. The ball is out wide, someone is in net, and the team can reset and rotate normally.",pos:{ball:[-3700,-400],b3:[-2300,-2900],b2:[0,-4650],b1:[-1000,-1600],o1:[-2100,-900],o2:[-900,300],o3:[800,2400]},m:[]}],
 tips:["Lost kickoffs are when early goals happen. React fast.","Boost player: you're often closest, with full boost. Take the ball calmly.","Cheater: if the ball gets past you, turn back at once and get between ball and net.","Clear to the side walls, not up the middle where the opponents are waiting."],
 bad:["Cheater chasing the ball into the corner (now nobody covers the net)","Clearing straight up the middle","Kicker sitting still after losing the 50/50"],
 quiz:{q:"The kickoff is lost and the ball rolls past you, the cheater. What do you do?",o:["Chase it into the corner","Turn back and get between the ball and the net","Go grab mid boost"],a:1,why:"Your boost player is usually closer to the ball. Your job is to cover the net so a bad touch isn't a goal."}},
{id:'k7',cat:'kick',lvl:2,title:'Cheating: the right distance',sum:'Close enough to collect, far enough back to defend.',mode:3,kick:KO3,steps:[
 {say:"The cheater drives up toward the side of the centre circle and stops behind the ball's line. Green is a good spot. Red is too far: if Orange wins it, you're out of the play.",pos:{b1:[-2048,-2560,'GO'],b2:[2048,-2560,'CHEAT'],b3:[0,-4608,'BOOST']},m:[ZN(G,700,-2000,1600,-1100),TX(G,1150,-2350,'Good cheat'),ZN(Rd,300,-600,1300,300),TX(Rd,1600,-150,'Too far'),R(B,[2048,-2560],[1150,-1500])]},
 {say:"The 50/50 pops toward the cheater's side. Because they're waiting, not rushing, they take it with control.",pos:{b1:[-180,-225],b2:[1150,-1500],b3:[-2950,-4050],o1:[180,225],o2:[-1150,1450],o3:[2950,4050]},m:[PS(W,[0,0],[1300,-900]),R(B,[1150,-1500],[1250,-1100])]},
 {say:"The cheater takes possession and pushes forward. If the ball had gone past instead, they were still deep enough to turn and defend.",pos:{ball:[1300,-900],b2:[1250,-1250,'1st'],b1:[-300,-500,'2nd'],b3:[-2600,-3200,'3rd']},m:[R(B,[1250,-1250],[1500,600]),TX(B,2200,-300,'Take it')]}],
 tips:["Good cheat zone: beside the centre circle, behind the ball.","Never drive past the ball's line before contact.","If their kicker always wins, cheat a little less.","Grab small pads as you cheat; don't burn all your boost."],
 bad:["Cheating straight at the ball and colliding with your own kicker","Cheating so far that a lost kickoff is a free shot for them"],
 quiz:{q:"Where should the cheater wait during a 3s kickoff?",o:["Right behind the kicker, bumper to bumper","Beside the centre circle, behind the ball's line","In the opponent's half to get there first"],a:1,why:"Beside the circle you can collect a ball that pops your way and still turn back if they win it."}},
{id:'k8',cat:'kick',lvl:3,title:'Fake and delayed kickoffs',sum:'A rare trick: let them hit a ball with nobody on it, then take it with speed.',mode:3,kick:KO3,steps:[
 {say:"Fake: Blue's kicker doesn't go. Orange flips hard into a ball with nobody on it, so the ball rolls slowly. Only do this if your team knows the plan.",pos:{b1:[-2048,-2560,'FAKE'],b2:[2048,-2560,'CHEAT'],b3:[0,-4608,'BOOST']},m:[R(O,[2048,2560],[200,250]),TX(Y,-2048,-3200,'Wait'),R(G,[0,-4608],[-2900,-4100])]},
 {say:"Their free hit rolls into your half, softly. Your kicker, still full on boost, meets it with speed and control.",pos:{o1:[220,280],ball:[-500,-1300],b1:[-1700,-2200],b2:[1150,-1450],b3:[-2950,-4050],o2:[-1150,1450],o3:[2950,4050]},m:[R(Y,[-1700,-2200],[-650,-1500])]},
 {say:"You arrive faster than the ball and push it past their kicker, who just flipped and has little boost left.",pos:{ball:[-300,900],b1:[-450,-450,'1st'],o1:[100,600],b2:[900,-400,'2nd'],b3:[-2500,-3300,'3rd']},m:[PS(W,[-500,-1300],[-300,900])]}],
 tips:["Fakes work best against opponents who always flip hard into the ball.","Agree on fakes beforehand; a surprise fake confuses your own team.","Delayed kickoff: drive slowly, let them hit first, then take the loose ball.","Use rarely. If they read it, they get a free touch toward your goal."],
 bad:["Faking without telling your team","Faking every kickoff"],
 quiz:{q:"Why can a fake kickoff work?",o:["The ball goes faster","Their hit is soft with nobody on it, and you arrive with boost and control","Hitting first is not allowed"],a:1,why:"An unopposed hit rolls softly. You arrive with speed and boost and take possession."}},

// ===== ROTATION =====
{id:'r1',cat:'rot',lvl:1,title:'The 3 jobs: 1st, 2nd, 3rd man',sum:'Pressure, support, safety. The triangle that every good 3s team plays.',mode:3,steps:[
 {say:"Every 3s play has three jobs. The 1st man pressures the ball. The 2nd supports a few car lengths behind. The 3rd stays back as safety. Together you make a triangle.",pos:{ball:[-1800,2800],b1:[-1500,2000,'1st'],b2:[-200,600,'2nd'],b3:[400,-1600,'3rd'],o1:[-1300,3800],o2:[300,4700],o3:[1600,1600]},m:[LN(W,[-1500,2000],[-200,600],[400,-1600],[-1500,2000]),TX(Y,-2700,1500,'Pressure'),TX(B,800,700,'Support'),TX(G,1500,-1600,'Safety'),R(Y,[-1500,2000],[-1750,2650])]},
 {say:"The 1st man challenges and the ball pops into the middle. The 2nd is in the right place to take it. The 3rd moves up to midfield because the team is attacking.",pos:{ball:[0,2600],b1:[-1750,2700],b2:[-300,1800],b3:[200,-300],o1:[-900,3500],o2:[0,4700],o3:[1300,1200]},m:[R(B,[-300,1800],[-100,2350]),R(Y,[-1750,2700],[-3300,1000])]},
 {say:"Everyone moves up one job. The old 2nd is now 1st, the old 3rd is 2nd, and the old 1st rotates back as the new 3rd. The jobs move; the triangle stays.",pos:{ball:[100,3300],b1:[-3300,1000,'3rd'],b2:[-100,2400,'1st'],b3:[200,800,'2nd'],o1:[-600,3600],o2:[100,4700],o3:[1400,1800]},m:[LN(W,[-100,2400],[200,800],[-3300,1000],[-100,2400])]}],
 tips:["1st man: win the ball or force a bad touch.","2nd man: stay 3-4 car lengths behind the 1st, ready for whatever comes out.","3rd man: on offense, push up to around midfield. On defense, guard the net.","Count your teammates. If both are in front of you, you're the 3rd man."],
 bad:["All three players in the same third of the field","2nd man so close to the 1st that one touch beats both","3rd man sitting in goal while the team attacks"],
 quiz:{q:"Your team is attacking. You're the 3rd man. Where should you be?",o:["In your own goal","Around midfield, behind both teammates","In the opponent's corner helping the 1st man"],a:1,why:"Around midfield you can stop clears and counters while still being the last player back."}},
{id:'r2',cat:'rot',lvl:1,title:'Back-post rotation',sum:'After your touch, rotate wide and back to the far post. Everyone moves up one.',mode:3,steps:[
 {say:"Blue's 1st man challenges the ball on the right side.",pos:{ball:[1500,1900],b1:[1100,1150,'1st'],b2:[-400,-200,'2nd'],b3:[-200,-3000,'3rd'],o1:[1700,3100],o2:[-500,3800],o3:[-1500,1400]},m:[R(Y,[1100,1150],[1450,1750])]},
 {say:"The ball goes left. The old 1st doesn't turn back into the play: they drive out wide and back toward the far post, grabbing boost on the way. The 2nd takes over as 1st, the 3rd steps up as 2nd.",pos:{ball:[-1200,600],b1:[2700,300],b2:[-700,-100],b3:[-300,-1800],o1:[-500,1700],o2:[-200,3600],o3:[-2200,900]},m:[R(Y,[2700,300],[3500,-200],[3000,-2400],[1000,-4100]),R(B,[-700,-100],[-1150,500]),R(G,[-300,-1800],[-500,-700]),TX(Y,2700,-2700,'Back post')]},
 {say:"From the back post the new 3rd sees everything: the ball, both teammates and all three opponents.",pos:{ball:[-1100,1200],b1:[1000,-4100,'3rd'],b2:[-1150,550,'1st'],b3:[-500,-700,'2nd'],o1:[-800,2300],o2:[300,3900],o3:[-2600,1600]},m:[LN(G,[1000,-4100],[-1100,1200]),TX(G,1900,-3700,'Sees all')]}],
 tips:["Back post = the goal post farther from the ball.","From the back post the whole play is in front of you.","Grab small pads or a side big pad on the way.","Rotating ball-side (through the play) blocks teammates and hides the field from you."],
 bad:["Rotating through the middle of the play","Turning straight back into the ball after your challenge","Parking in goal facing the back wall"],
 quiz:{q:"The ball is on the left side of the field. You rotate back. Where do you go?",o:["The left post, near the ball","The right post (back post)","Into the left corner"],a:1,why:"The back post is the one away from the ball. From there you can see the ball, the pass and your teammates."}},
{id:'r3',cat:'rot',lvl:1,title:'Never double commit',sum:'Two players on one ball = one pass beats both. One challenges, one covers.',mode:3,steps:[
 {say:"Orange brings the ball up. Blue's 1st AND 2nd both drive at it. That's a double commit.",pos:{ball:[-800,-800],o1:[-600,-150],o2:[1000,400],o3:[-300,2500],b1:[-900,-2100,'1st'],b2:[400,-2400,'2nd'],b3:[0,-4400,'3rd']},m:[R(Rd,[-900,-2100],[-800,-1200]),R(Rd,[400,-2400],[-500,-1300]),TX(Rd,1400,-1700,'Both go?')]},
 {say:"One easy pass beats both of them. Now it's 2 attackers against your goalie.",pos:{ball:[1200,-2700],o1:[-700,-600],o2:[1200,-2100],b1:[-800,-1250],b2:[-450,-1350],b3:[200,-4500]},m:[PS(W,[-800,-800],[1200,-2700]),TX(Rd,2300,-3200,'2 beaten')]},
 {say:"Again, properly: only the 1st challenges. The 2nd stays a few car lengths back, covering the pass to the right. The 3rd guards the net.",pos:{ball:[-800,-800],o1:[-600,-150],o2:[1000,400],b1:[-850,-1500],b2:[600,-2900],b3:[0,-4400]},m:[R(Y,[-850,-1500],[-800,-1100]),ZN(B,0,-3500,1500,-2300),TX(B,1900,-2000,'Cover pass'),TX(G,1100,-4700,'Net')]},
 {say:"The same pass now goes straight to the 2nd man. One challenges, one covers, one guards.",pos:{ball:[900,-2400],o1:[-700,-600],o2:[1100,-1600],b1:[-700,-1200],b2:[900,-2700]},m:[R(B,[900,-2700],[900,-2450]),TX(B,1900,-3100,'Cut out')]}],
 tips:["Before you go, check: is a teammate already going? Then you support.","Use 'I got it!' when you commit, and trust it when a teammate says it.","Support from 3-4 car lengths behind, on the side of the likely pass.","If you're both equally close, the one facing the ball more goes."],
 bad:["Two players challenging the same ball","Going for the ball without checking teammates","Ignoring a teammate's 'I got it!'"],
 quiz:{q:"A teammate goes for the ball you were also driving at. What do you do?",o:["Go anyway, two is better than one","Back off and cover the pass or rebound","Go grab big boost"],a:1,why:"Two players on one ball means one pass or bounce beats you both. Covering keeps your team alive."}},
{id:'r4',cat:'rot',lvl:2,title:"Don't cut off your teammate",sum:'After your touch, rotate out wide, not across the field through the next man\'s lane.',mode:3,steps:[
 {say:"Blue's 1st just challenged in the corner. The red path cuts across the field straight through the 2nd man's lane. The yellow path goes out wide, takes the side big pad, and heads back.",pos:{ball:[2700,3700],b1:[2400,3300,'1st'],b2:[500,1800,'2nd'],b3:[-300,-200,'3rd'],o1:[1600,4300],o2:[-200,4600],o3:[-1500,1200]},m:[R(Rd,[2400,3300],[1200,2500],[-200,1500]),TX(Rd,-1000,2300,'Cuts across'),R(Y,[2400,3300],[3500,1500],[3584,0],[2600,-2600]),TX(Y,3100,700,'Wide')]},
 {say:"Because the old 1st went wide, the 2nd has a clear lane to the ball. The 3rd moves up behind.",pos:{ball:[1500,3300],b1:[3584,100,'3rd'],b2:[1200,2700,'1st'],b3:[200,900,'2nd'],o1:[1900,4000],o2:[0,4600]},m:[R(Y,[3584,100],[2400,-2700],[-700,-4400])]},
 {say:"The old 1st arrives at the back post with 100 boost, ready for anything that comes back.",pos:{b1:[-700,-4400],b2:[1450,3050],b3:[300,1500],ball:[1300,3600]},m:[]}],
 tips:["After your touch, rotate out to the side, away from teammates' paths.","If a teammate is coming in, you're an obstacle. Get out of the way.","The side big pad is a natural rotation stop.","Glance at your teammates (ball-cam off briefly) before you turn."],
 bad:["Bumping your own teammate","Rotating through the middle of the field","Stopping in front of the goal you're attacking"],
 quiz:{q:"You just challenged the ball in their corner. How do you rotate?",o:["Through the middle of the field","Out wide along the side, then back","Stay in the corner and wait"],a:1,why:"Going wide keeps the middle lane open for your 2nd man and lets you pick up the side boost."}},
{id:'r5',cat:'rot',lvl:1,title:'Boost on the way back',sum:'Rotate through pads that are already on your path. Never cross the field for one.',mode:3,steps:[
 {say:"You're out of the play with 6 boost. Don't drive across the field for the far big pad (red). Rotate back down your own side: the side big pad and small pads are all on the way (yellow).",pos:{ball:[800,3300],b1:[-2600,3000,'6 boost'],b2:[600,2300,'1st'],b3:[-200,400,'2nd'],o1:[700,4100],o2:[-400,4700],o3:[1800,1700]},m:[R(Y,[-2600,3000],[-3584,0],[-1788,-2300],[-940,-3308],[-600,-4300]),TX(Y,-2600,-1300,'On the way'),R(Rd,[-2600,3000],[-800,2000],[2000,1200],[3584,0]),TX(Rd,1500,500,'Across')]},
 {say:"The side big pad is right on your rotation path, so take it. Big pads give 100.",pos:{b1:[-3584,0,'100 boost'],ball:[300,3500],b2:[500,2900],b3:[0,1200],o1:[400,4300]},m:[]},
 {say:"You arrive at the back post full of boost. A player with boost is a threat; a player with zero is a spectator.",pos:{b1:[-600,-4300,'3rd'],ball:[-400,3600],b2:[-200,3000],b3:[300,1300],o1:[0,4400]},m:[]}],
 tips:["Small pads give 12 and come back after 4 seconds. Big pads give 100 and come back after 10.","Plan your rotation through pads you already pass.","Take a big pad if it's on your path; don't detour across the field.","Aim for 30-60 boost as 3rd man. Position matters more than a full tank."],
 bad:["Crossing the whole field for a big pad","Going for boost while you're last back","Ignoring small pads"],
 quiz:{q:"You're rotating back with almost no boost. What's best?",o:["Drive across the field to the far big pad","Take the pads that are on your rotation path","Stay where you are"],a:1,why:"Pads on your path refill you without leaving your team short-handed."}},
{id:'r6',cat:'rot',lvl:2,title:'When to break rotation',sum:'Rotation is a guide, not a law. If you\'re clearly closest and it\'s safe, take it.',mode:3,steps:[
 {say:"A clear comes out to your left. You're the 3rd man, but you're far closer than anyone. Waiting for the 'right' player gives Orange a free touch.",pos:{ball:[-1400,-900],b1:[2400,2200,'1st'],b2:[1500,500,'2nd'],b3:[-1200,-2200,'3rd'],o1:[-200,600],o2:[1000,3000],o3:[-300,4600]},m:[R(G,[-1200,-2200],[-1350,-1150]),TX(G,-2500,-1800,'I got it!'),R(B,[1500,500],[300,-2800]),TX(B,1600,-2100,'Cover')]},
 {say:"So you take it and call 'I got it!'. Your 2nd sees you go and drops back to cover the net. Rotation bends around the play.",pos:{ball:[-1500,500],b3:[-1350,-700,'1st'],b2:[300,-2800,'3rd'],b1:[1600,1500,'2nd'],o1:[-600,1000]},m:[PS(W,[-1500,500],[-3000,2600])]}],
 tips:["The real goal: someone on the ball and someone back, at all times.","If you're clearly closest and it's safe, take it.","When a teammate breaks rotation, fill in behind them.","Always tell the team with quick chat."],
 bad:["Leaving a free ball because 'it's not my turn'","Breaking rotation as last man on a 50/50"],
 quiz:{q:"You're 3rd man. The ball rolls right to you and both teammates are far away. What do you do?",o:["Leave it, it's the 1st man's ball","Take it, call 'I got it!', and let a teammate cover","Go back to net"],a:1,why:"A free ball is worth taking. Calling it lets your teammate drop back and cover for you."}},
{id:'r7',cat:'rot',lvl:2,title:"The 2nd man's job",sum:'Follow-ups, 50/50s, rebounds and passes all land near the 2nd man.',mode:3,steps:[

// ---------- kickoff roles + generated kickoff lessons ----------
const KD={diagL:1,diagR:1,offL:2,offR:2,back:3};
function koRoles(k){
  const s=k.slice().sort((a,b)=>KD[a]-KD[b]||KO[a][0]-KO[b][0]);
  const go=s[0], rest=s.slice(1);
  // tie for cheat (two off-centres left after a diagonal): the one on the far side from the kicker cheats
  if(rest.length>=2&&KD[rest[0]]===KD[rest[1]]&&Math.sign(KO[rest[0]][0])===Math.sign(KO[go][0]))[rest[0],rest[1]]=[rest[1],rest[0]];
  return {go,tie:k.some(x=>x!==go&&KD[x]===KD[go]),cheat:rest[0]||null,boost:k.length>=3?rest[1]:null,net:k.length>=4?rest[2]:null};
}
const sgn=sp=>Math.sign(KO[sp][0]);
function cheatSpot(sp){const s=sgn(sp);return sp.startsWith('diag')?[s*1150,-1450]:sp.startsWith('off')?[s*1000,-2050]:[0,-2700]}
function boostSide(r){return r.cheat&&sgn(r.cheat)?-sgn(r.cheat):(sgn(r.go)?-sgn(r.go):-1)}
function koTargets(k,r){const T={};T[r.go]=[0,0];if(r.cheat)T[r.cheat]=cheatSpot(r.cheat);if(r.boost)T[r.boost]=[boostSide(r)*3072,-4096];if(r.net)T[r.net]=[0,-4700];return T}
const nm=sp=>SPOT_NAME[sp];
function koSay(k,r){
  const n=k.length,bs=boostSide(r)<0?'left':'right';
  if(n===1)return "In 1s you always go. Boost straight at the ball and flip into it.";
  let s=`${nm(r.go)} goes`+(r.tie?` (two ${KD[r.go]===1?'diagonals':'off-centres'}, so left goes). `:' (closest to the ball). ');
  s+=`${nm(r.cheat)} cheats up`+(n===2?' a little and stays ready to defend.':' beside the circle.');
  if(r.boost)s+=` ${nm(r.boost)} grabs the ${bs} corner boost, then heads back.`;
  if(r.net)s+=` ${nm(r.net)} stays in net.`;
  return s;
}
function roleSummary(k){const r=koRoles(k);return [`${nm(r.go)} goes`,r.cheat&&`${nm(r.cheat)} cheats`,r.boost&&`${nm(r.boost)} boost`,r.net&&`${nm(r.net)} net`].filter(Boolean).join(' · ')}
function genKick(k){
  const n=k.length,r=koRoles(k),bs=boostSide(r),T=koTargets(k,r);
  const cs=r.cheat&&sgn(r.cheat)?sgn(r.cheat):(sgn(r.go)?-sgn(r.go):1);
  const id=sp=>'b'+(k.indexOf(sp)+1),oid=sp=>'o'+(k.indexOf(sp)+1);
  const st=[{pos:{},m:[]},{pos:{},m:[]},{pos:{},m:[]}];
  const put=(i,sp,p,lab)=>{st[i].pos[id(sp)]=lab===undefined?[p[0],p[1]]:[p[0],p[1],lab];st[i].pos[oid(sp)]=[-p[0],-p[1]]};
  const LAB={go:'GO',cheat:'CHEAT',boost:'BOOST',net:'NET'};
  const roleOf=sp=>sp===r.go?'go':sp===r.cheat?'cheat':sp===r.boost?'boost':'net';
  const [gx,gy]=KO[r.go],gd=Math.hypot(gx,gy),contact=[gx/gd*230,gy/gd*230];
  const via=sp=>{const t=sp.slice(0,3),s=sgn(sp);return t==='dia'?[s*1788,-2300]:t==='off'?[0,-2816]:[0,-2816]};
  for(const sp of k){const role=roleOf(sp);put(0,sp,KO[sp],n>1?LAB[role]:undefined)}
  st[0].m.push(R(Y,KO[r.go],via(r.go),contact));
  if(r.cheat){const c=r.cheat,p=c.startsWith('off')?[[sgn(c)*940,-3308]]:[];st[0].m.push(R(B,KO[c],...p,T[c]))}
  if(r.boost)st[0].m.push(R(G,KO[r.boost],T[r.boost]));
  st[0].say=koSay(k,r)+(n>=3?' Rule: closest goes, next closest cheats, farthest gets boost.':'');
  // contact
  put(1,r.go,contact);if(r.cheat)put(1,r.cheat,T[r.cheat]);if(r.boost)put(1,r.boost,[bs*2950,-4050]);if(r.net)put(1,r.net,[0,-4800]);
  st[1].m.push(ZN(W,-450,-450,450,450));
  const tech=r.go.startsWith('diag')?'From a diagonal: boost the whole way, drive over the small pad in front, and flip into the ball about one car length before contact.':
    r.go.startsWith('off')?'From off-centre: drive over the centre small pad, turn in, then flip into the ball. Go instantly; off-centre is slower than a diagonal.':
    'From straight back: the longest kickoff. Hold boost, take the centre pad, flip early for speed and again into the ball.';
  st[1].say=tech+(r.cheat?' The cheater waits behind the ball\'s line.':'')+(r.boost?' The boost player fills up to 100.':'');
  // aftermath (we win it toward the cheater's side)
  st[2].pos.ball=[cs*2200,2700];
  st[2].pos[id(r.go)]=[-cs*200,800,n>1?(n===2?'BACK':'2nd'):undefined];if(n===1)st[2].pos[id(r.go)]=[cs*300,800];
  st[2].pos[oid(r.go)]=[-cs*400,500];
  if(r.cheat){st[2].pos[id(r.cheat)]=[cs*1600,1500,'1st'];st[2].pos[oid(r.cheat)]=[-cs*700,4200];st[2].m.push(R(B,[cs*1600,1500],[cs*2050,2450]))}
  if(r.boost){st[2].pos[id(r.boost)]=[bs*900,-2600,'3rd'];st[2].pos[oid(r.boost)]=[cs*2600,3500]}
  if(r.net){st[2].pos[id(r.net)]=[0,-4500,'4th'];st[2].pos[oid(r.net)]=[0,4800]}
  if(n===2)st[2].pos[id(r.go)]=[-cs*500,-600,'BACK'];
  st[1].m.push(PS(W,[0,0],[cs*2200,2700]));
  const side=cs>0?'right':'left';
  st[2].say=n===1?"Follow your hit, but if they get to the ball first, get back between ball and net.":
    n===2?`Say we win it toward their ${side} corner. The cheater presses as 1st. The kicker recovers and drops back as the last man.`:
    `Say we win it toward their ${side} corner. The cheater is already moving, so they press as 1st. The kicker recovers as 2nd. The boost player comes up as 3rd with 100 boost.`;
  return st;
}
const KO_TIPS=["Closest goes. Diagonal beats off-centre beats straight.","Tie? Left goes (left from your own car's view).","Next closest cheats beside the circle, behind the ball's line.","Farthest grabs corner boost on the side away from the cheater, then comes back."];
function koLesson(k){return {id:'ko:'+k.join(),cat:'kick',lvl:1,title:`${k.length}s kickoff: ${kickName(k)}`,sum:roleSummary(k),gen:k,tips:KO_TIPS,bad:[],quiz:null}}
function lessonById(id){if(!id)return null;if(String(id).startsWith('ko:')){const k=id.slice(3).split(',');return k.length&&k.every(s=>KO[s])?koLesson(k):null}return LESSONS.find(l=>l.id===id)||null}

function buildLesson(P){
  const map=mapObj().arena==='soccar'?S.map:'dfh';
  const kick=P.gen||P.kick||null, mode=P.gen?P.gen.length:P.mode, steps=P.gen?genKick(P.gen):P.steps;
  const S2={name:P.title,map,mode,kick:kick&&kick.length===mode?kick.slice():null,lessonId:P.id,frames:[]};
  let prev=kickoffObjs(mode,map,kick&&kick.length===mode?kick:null);
  steps.forEach(st=>{
    const objs=prev.map(o=>{const n={...o};const q=st.pos&&st.pos[o.id];if(q){n.x=q[0];n.y=q[1];if(q.length>2){if(q[2])n.label=q[2];else delete n.label}}return n});
    const f={objs,marks:clone(st.m||[])};if(st.say)f.say=st.say;S2.frames.push(f);prev=objs;
  });
  const n=S2.frames.length;
  for(let i=0;i<n;i++)for(const o of S2.frames[i].objs){if(o.kind!=='car')continue;
    const nx=i<n-1?S2.frames[i+1].objs.find(q=>q.id===o.id):null, pv=i>0?S2.frames[i-1].objs.find(q=>q.id===o.id):null;
    const ball=S2.frames[i].objs.find(q=>q.kind==='ball'), faceBall=Math.atan2(ball.y-o.y,ball.x-o.x);
    if(i===0){if(kick)continue;o.a=nx&&Math.hypot(nx.x-o.x,nx.y-o.y)>600?Math.atan2(nx.y-o.y,nx.x-o.x):faceBall;continue}
    if(pv&&Math.hypot(o.x-pv.x,o.y-pv.y)>200)o.a=Math.atan2(o.y-pv.y,o.x-pv.x);else o.a=faceBall;
  }
  return S2;
}

function wireQuiz(box,q,onAnswer,retry){
  const opts=[...box.querySelectorAll('.qopt')], slot=box.querySelector('.why-slot');
  opts.forEach(b=>b.onclick=()=>{if(box.dataset.done)return;box.dataset.done=1;const i=+b.dataset.i, ok=i===q.a;
    opts.forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok');else if(j===i)x.classList.add('no')});
    slot.innerHTML=`<div class="why ${ok?'good':''}"><b>${ok?'Correct!':'Not quite.'}</b> ${esc(q.why)}</div>`+(!ok&&retry?'<button class="btn" data-retry style="margin-top:8px">Try again</button>':'');
    const rt=slot.querySelector('[data-retry]');if(rt)rt.onclick=()=>{delete box.dataset.done;opts.forEach(x=>{x.disabled=false;x.classList.remove('ok','no')});slot.innerHTML=''};
    onAnswer&&onAnswer(ok)});
}

    el.querySelector('#lnList').innerHTML=cats.map(([k,n])=>{const ls=LESSONS.filter(l=>l.cat===k);const dn=ls.filter(l=>prog.done[l.id]).length;
      return `<h3>${n} <span class="cnt">${dn}/${ls.length}</span></h3>`+ls.map(lessonItem).join('')}).join('');
    el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{close();openLesson(b.dataset.l)})};
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>render(b.dataset.c));
  render(CATN[settings.lcat]?settings.lcat:'all');
  const nb=el.querySelector('#lnNext');if(nb)nb.onclick=()=>{close();openLesson(nextL.id)};
  el.querySelector('#lnKick').onclick=()=>{close();openTrainer()};
  el.querySelector('#lnQuiz').onclick=()=>{close();openQuiz()};
  el.querySelector('#lnRules').onclick=()=>{close();openRules()};
}
function openLesson(id,toQuiz){
  const L=lessonById(id);if(!L)return;
  const steps=L.gen?3:L.steps.length, idx=LESSONS.indexOf(L), next=idx>=0?LESSONS[idx+1]:null;
  const list=(a,cls)=>a&&a.length?`<ul class="tipl ${cls}">${a.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'';
  const q=L.quiz?shuffleQ(L.quiz):null;
  const roleBox=L.gen?`<div class="kowrap">${koSvg(L.gen,koRoles(L.gen),96)}<div>${koLegend(L.gen)}</div></div>`:'';
  const {el,close}=modal(`<div class="lhead"><span class="lv lv${L.lvl}">${LVL[L.lvl]}</span><span class="lbl">${CATN[L.cat]} · ${steps} steps</span>${prog.done[L.id]?'<span class="donebadge">✓ Done</span>':''}</div>
   <h2>${esc(L.title)}</h2><p>${esc(L.sum)}</p>${roleBox}
   <button class="btn pri wide" id="lsWatch">${svg('play')}Watch on the board</button>
   ${L.tips&&L.tips.length?'<h3>What to do</h3>'+list(L.tips,'ok'):''}
   ${L.bad&&L.bad.length?'<h3>Common mistakes</h3>'+list(L.bad,'no'):''}
   ${q?'<h3 id="lsQ">Check yourself</h3>'+quizHtml(q):''}
   <div class="row" style="margin-top:16px">${next?'<button class="btn" id="lsNext">Next lesson ›</button>':''}<button class="btn" id="lsAll">All lessons</button>${canLink()&&!L.gen?'<button class="btn" id="lsLink">Copy link</button>':''}</div>`,false,'tall');
  el.querySelector('#lsWatch').onclick=()=>{close();watchLesson(L)};
  if(q)wireQuiz(el.querySelector('.quiz'),q,ok=>{if(ok&&LESSONS.includes(L)&&!prog.done[L.id]){prog.done[L.id]=1;saveProg();toast('Lesson complete ✓')}},true);
  const nb=el.querySelector('#lsNext');if(nb)nb.onclick=()=>{close();openLesson(next.id)};
  el.querySelector('#lsAll').onclick=()=>{close();openLearn()};
  const lk=el.querySelector('#lsLink');if(lk)lk.onclick=()=>{const u=location.origin+location.pathname+'#l='+L.id;try{navigator.clipboard.writeText(u).then(()=>toast('Link copied. Send it to a teammate'),()=>toast(u))}catch(e){toast(u)}};
  if(toQuiz){const h=el.querySelector('#lsQ');if(h)setTimeout(()=>h.scrollIntoView({block:'start'}),60)}
}
function openRules(){
  const {el,close}=modal(`<h2>Golden rules of 3s</h2><p>Screenshot this. If everyone on the team follows these, you'll win more games than with any mechanic.</p>
   <ol class="rules">${RULES.map(([t,d])=>`<li><b>${esc(t)}</b><small>${esc(d)}</small></li>`).join('')}</ol>
   <div class="row" style="margin-top:14px"><button class="btn pri" id="ruAll">Back to Academy</button></div>`,false,'tall');
  el.querySelector('#ruAll').onclick=()=>{close();openLearn()};
}
function openQuiz(){
  const pool=LESSONS.filter(l=>l.quiz);let score=0,count=0,last=null;
  const {el,close}=modal(`<h2>Situation quiz</h2><p id="qzS">Answer as many as you like. Each one links to its lesson.</p><div id="qzBox"></div>`,false,'tall');
  const nextQ=()=>{let L;do{L=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&L===last);last=L;const q=shuffleQ(L.quiz);
    const box=el.querySelector('#qzBox');
    box.innerHTML=`<div class="lhead"><span class="lv lv${L.lvl}">${LVL[L.lvl]}</span><span class="lbl">${CATN[L.cat]}</span></div>${quizHtml(q)}<div class="row" style="margin-top:12px"><button class="btn pri" id="qzN">Next question</button><button class="btn" id="qzW">Open lesson</button></div>`;
    wireQuiz(box.querySelector('.quiz'),q,ok=>{count++;if(ok){score++;if(!prog.done[L.id]){prog.done[L.id]=1;saveProg()}}el.querySelector('#qzS').innerHTML=`Score <b>${score}/${count}</b>`});
    box.querySelector('#qzN').onclick=nextQ;box.querySelector('#qzW').onclick=()=>{close();openLesson(L.id)};
    el.scrollTop=0};
  nextQ();
}
function koLegend(k){const r=koRoles(k);const row=(sp,cls,t,d)=>sp?`<div class="role ${cls}"><b>${k.indexOf(sp)+1} · ${t}</b><small>${nm(sp)}. ${d}</small></div>`:'';
  return row(r.go,'go','GO',k.length>1?(r.tie?'Tie, so left goes.':'Closest to the ball.'):'Always you in 1s.')+row(r.cheat,'ch','CHEAT',k.length===2?'Up a little, ready to defend.':'Beside the circle, behind the ball.')+row(r.boost,'bo','BOOST',`${boostSide(r)<0?'Left':'Right'} corner, then back.`)+row(r.net,'nt','NET','Stays in goal.')}
// off-centre spawns are only 512 apart: spread them in the diagram so both markers stay readable
const koXY=sp=>sp.startsWith('off')?[sgn(sp)*620,KO[sp][1]]:KO[sp];
function koSvg(k,r,w){
  const h=Math.round(w*1.34);let a='',c='';
  if(r){const T=koTargets(k,r);[[r.go,'#ffc93c'],[r.cheat,'#3d9bff'],[r.boost,'#3ddc84'],[r.net,'#ffffff']].forEach(([sp,col])=>{if(!sp)return;const [x,y]=koXY(sp),t=T[sp];
    a+=`<line x1="${x}" y1="${-y}" x2="${t[0]}" y2="${-t[1]}" stroke="${col}" stroke-width="170" stroke-linecap="round"${sp===r.go?'':' stroke-dasharray="320 260"'}/><circle cx="${t[0]}" cy="${-t[1]}" r="200" fill="${col}"/>`})}
  k.forEach((sp,i)=>{const [x,y]=koXY(sp);const col=!r?'#fff':sp===r.go?'#ffc93c':sp===r.cheat?'#3d9bff':sp===r.boost?'#3ddc84':'#fff';
    c+=`<circle cx="${-x}" cy="${y}" r="400" fill="#ff8a1f" stroke="#fff" stroke-width="70" opacity=".8"/>`;
    c+=`<circle cx="${x}" cy="${-y}" r="540" fill="#2f86f0" stroke="${col}" stroke-width="${r?210:90}"/><text x="${x}" y="${-y+40}" fill="#fff" font-size="600" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="Chakra Petch,Arial,sans-serif">${i+1}</text>`});
  const pads=[[-3072,4096],[3072,4096],[-3072,-4096],[3072,-4096],[-3584,0],[3584,0]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="230" fill="#ffc93c" opacity=".75"/>`).join('');
  return `<svg viewBox="-4400 -5900 8800 11800" width="${w}" height="${h}" aria-hidden="true"><rect x="-893" y="-6000" width="1786" height="880" fill="#ff8a1f" opacity=".5"/><rect x="-893" y="5120" width="1786" height="880" fill="#2f86f0" opacity=".5"/><path d="M-2944 -5120H2944L4096 -3968V3968L2944 5120H-2944L-4096 3968V-3968Z" fill="#2f7a37" stroke="#9fb3c8" stroke-width="160"/><line x1="-4096" y1="0" x2="4096" y2="0" stroke="#fff" stroke-opacity=".6" stroke-width="80"/><circle r="1000" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="70"/>${pads}<circle r="330" fill="#fff"/>${a}${c}</svg>`;
}
function openTrainer(){
  let m=S.mode===2?2:3, k=null, phase='go', allOk=true, streak=0, best=LS.get('bb.kbest',0);
  const {el,close}=modal(`<h2>Kickoff trainer</h2><p>You're blue. A random spawn appears: pick the right job until it's automatic.</p>
   <div class="row" style="align-items:center;justify-content:space-between"><div class="seg" id="ktM"><button data-m="2">2s</button><button data-m="3">3s</button></div><span class="streak" id="ktS"></span></div>
   <div class="kt"><div id="ktPic"></div><div id="ktQ" class="ktq"></div></div>
   <h3>Every spawn</h3><div id="ktAll" class="list"></div>`,false,'tall');
  const syncS=()=>{el.querySelector('#ktS').innerHTML=`Streak <b>${streak}</b> · Best <b>${best}</b>`};
  const all=()=>{el.querySelector('#ktAll').innerHTML=combos(m).map(c=>`<div class="item kitem">${koSvg(c,koRoles(c),40)}<div class="meta"><b>${esc(kickName(c))}</b><small>${esc(roleSummary(c))}</small></div><button class="btn" data-w="${c.join()}">Watch</button></div>`).join('');
    el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{close();watchLesson(koLesson(b.dataset.w.split(',')))})};
  const newRound=()=>{const cs=combos(m);let c;do{c=cs[Math.floor(Math.random()*cs.length)]}while(k&&cs.length>1&&c.join()===k.join());k=c;phase='go';allOk=true;ask()};
  const ask=()=>{const r=koRoles(k), want=phase==='go'?r.go:r.cheat;
    el.querySelector('#ktPic').innerHTML=koSvg(k,null,132);
    el.querySelector('#ktQ').innerHTML=`<p class="qq">${phase==='go'?'Who goes for the ball?':'Good. Now, who cheats?'}</p>${k.map((sp,i)=>{const dis=phase==='cheat'&&sp===r.go;return `<button class="qopt" data-sp="${sp}"${dis?' disabled':''}><span class="qk">${i+1}</span>${nm(sp)}${dis?' · goes':''}</button>`}).join('')}`;
    el.querySelectorAll('#ktQ [data-sp]').forEach(b=>b.onclick=()=>{const ok=b.dataset.sp===want;
      el.querySelectorAll('#ktQ [data-sp]').forEach(x=>{x.disabled=true;if(x.dataset.sp===want)x.classList.add('ok');else if(x===b)x.classList.add('no')});
      if(!ok)allOk=false;
      setTimeout(()=>{if(ok&&phase==='go'&&m===3){phase='cheat';ask()}else reveal()},ok?450:900)})};
  const reveal=()=>{const r=koRoles(k);
    if(allOk){streak++;if(streak>best){best=streak;LS.set('bb.kbest',best)}}else streak=0;syncS();
    el.querySelector('#ktPic').innerHTML=koSvg(k,r,132);
    el.querySelector('#ktQ').innerHTML=`<div class="why ${allOk?'good':''}"><b>${allOk?'Correct!':'Not quite.'}</b> ${esc(koSay(k,r))}</div>${koLegend(k)}<div class="row" style="margin-top:10px"><button class="btn pri" id="ktN">Next spawn</button><button class="btn" id="ktW">Watch it</button></div>`;
    el.querySelector('#ktN').onclick=newRound;el.querySelector('#ktW').onclick=()=>{close();watchLesson(koLesson(k))}};
  const setM=v=>{m=v;el.querySelectorAll('#ktM button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===m));all();k=null;newRound()};
  el.querySelectorAll('#ktM button').forEach(b=>b.onclick=()=>setM(+b.dataset.m));
  syncS();setM(m);
}
function openNote(){
  const f=frame();
  const {el,close}=modal(`<h2>Step ${cur+1} note</h2><p>Explain what happens on this step. Notes show under the board while the play runs, and travel inside play codes.</p><textarea id="ntIn" class="note" maxlength="400" placeholder="e.g. 2nd man: hold back, cover the pass">${esc(f.say||'')}</textarea><div class="row" style="margin-top:12px"><button class="btn pri" id="ntOk">Save note</button>${f.say?'<button class="btn bad" id="ntDel">Remove</button>':''}</div>`,true);
  const inp=el.querySelector('#ntIn');setTimeout(()=>inp.focus(),50);
  const set=v=>{pushHistory();const fr=frame();if(v)fr.say=v;else delete fr.say;coachHidden=false;changed();syncCoach();close()};
  el.querySelector('#ntOk').onclick=()=>set(inp.value.trim());const d=el.querySelector('#ntDel');if(d)d.onclick=()=>set('');
}
function syncCoach(fi){
  const el=$('#coach');if(!el)return;
  if(fi==null)fi=cur;
  const L=lessonById(S.lessonId), n=S.frames.length, has=S.frames.some(f=>f.say);
  const show=!coachHidden&&!!(L||has);
  if(el.hidden===show)el.hidden=!show;
  if(!show)return;
  el.classList.toggle('min',!!settings.coachMin);
  $('#chMin').innerHTML=svg(settings.coachMin?'up':'down');
  $('#chTag').textContent=L?`${CATN[L.cat]} lesson`:'Play notes';
  $('#chTitle').textContent=L?L.title:(S.name||'Your play');
  fi=Math.max(0,Math.min(n-1,fi));const say=S.frames[fi].say;
  $('#chSay').innerHTML=`<span class="sn">STEP ${fi+1}/${n}</span>`+(say?esc(say):'<i>No note on this step. Tap the pencil to add one.</i>');
  $('#chPrev').disabled=playing||fi<=0;
  const last=fi>=n-1;
  $('#chNext').textContent=playing?'Pause':(!last?'Next step ›':(L&&L.quiz?'Take the quiz ›':(n>1?'Replay':'Done')));
  $('#chInfo').hidden=!L;
}
function initCoach(){
  $('#chClose').innerHTML=svg('x');$('#chEdit').innerHTML=svg('pen');
  $('#chMin').onclick=()=>{settings.coachMin=!settings.coachMin;saveSettings();syncCoach()};
  $('#chClose').onclick=()=>{coachHidden=true;syncCoach();toast('Notes hidden. The note button brings them back')};
  $('#chPrev').onclick=()=>{if(cur>0){stopPlay();cur--;afterFrame()}};
  $('#chNext').onclick=()=>{if(playing){stopPlay();return}const n=S.frames.length;if(cur<n-1){play(true);return}
    const L=lessonById(S.lessonId);if(L&&L.quiz){openLesson(L.id,true);return}
    if(L&&!L.quiz&&LESSONS.includes(L)&&!prog.done[L.id]){prog.done[L.id]=1;saveProg()}
    if(n>1){cur=0;afterFrame();play()}else coachHidden=true,syncCoach()};
  $('#chInfo').onclick=()=>openLesson(S.lessonId);
  $('#chEdit').onclick=openNote;
  $('#chTag').parentElement.querySelector('.ch-title').onclick=()=>{settings.coachMin=!settings.coachMin;saveSettings();syncCoach()};
}
function openWelcome(){
  const {el,close}=modal(`<h2>New: the Academy</h2><p>${LESSONS.length} lessons for 3s: kickoffs, rotation, attack, defense, boost and game sense. Each one plays on the board step by step with a coach note, tips, common mistakes and a quick quiz.</p>
   <p>Plus a <b>kickoff trainer</b> for every spawn, a <b>situation quiz</b>, and the <b>golden rules</b>. Tap the yellow cap button any time.</p>
   <div class="row" style="margin-top:12px"><button class="btn pri" id="wlGo">${svg('cap')}Start learning</button><button class="btn" id="wlNo">Later</button></div>`,true);
  el.querySelector('#wlGo').onclick=()=>{close();openLearn()};el.querySelector('#wlNo').onclick=close;
}

if(!/claude\.(ai|site)|claudeusercontent/.test(location.host)&&location.protocol.startsWith('http')){
  const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)};
  add('manifest','manifest.webmanifest');add('apple-touch-icon','icon-180.png');
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ---------- boot ----------
buildStatic();initCoach();setTool('run');buildTop();buildFrames();syncUndo();syncPlay();
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#l=([\w:,]+)/);if(m&&lessonById(decodeURIComponent(m[1]))){document.querySelectorAll('.modal').forEach(x=>x.remove());openLesson(decodeURIComponent(m[1]))}});
const hm=location.hash.match(/^#l=([\w:,]+)/);
if(hm&&lessonById(decodeURIComponent(hm[1])))setTimeout(()=>openLesson(decodeURIComponent(hm[1])),300);
else if(!LS.get('bb.seenAcademy',false)){LS.set('bb.seenAcademy',true);LS.set('bb.seen2',true);setTimeout(openWelcome,500)}
else if(!LS.get('bb.seen2',false)){LS.set('bb.seen2',true);setTimeout(()=>toast('Drag a car or ball to move it. Drag the field to draw'),600)}
})();
